name: Weekly Bus Index Update

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (8:00 AM HKT)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Adds a manual "Run workflow" button in GitHub Actions tab

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-24.04 # Pinned to clear the Ubuntu migration notice
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Upgraded to 24 to clear the deprecation warning

      - name: Run Builder Script
        run: node build-index.js

      - name: Commit & Push updated bus_index.min.json
        run: |
          git config --global user.name 'github-actions[bot]'

          - name: Commit & Push updated bus_index.min.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bus_index.min.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated weekly update of bus_index.min.json" && git pull --rebase origin main && git push)
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bus_index.min.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated weekly update of bus_index.min.json" && git push)
