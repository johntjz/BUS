<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Bus HK - Dark Mode</title>
<!-- Leaflet CSS for Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root {
    --kmb-red: #e31837;
    --bg-light: #121212;
    --bg-white: #1c1c1e;
    --text-main: #ffffff;
    --text-sub: #98989d;
    --border-color: #2c2c2e;
    --accent-blue: #0a84ff;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg-light);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color-scheme: dark;
  }

  /* Header */
  .header {
    background-color: var(--kmb-red);
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1001;
    height: 55px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
  .back-btn {
    position: absolute; left: 10px; top: 0; bottom: 0; display: none;
    align-items: center; justify-content: center; background: none; border: none; color: white;
    font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 0 16px;
  }

  /* Views */
  .view-container {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    display: none; flex-direction: column; background: var(--bg-light);
  }
  .view-container.active { display: flex; }

  /* Bottom Tabs */
  .bottom-tabs {
    background-color: var(--bg-white); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; align-items: center;
    height: 65px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
    z-index: 1001;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-sub); flex: 1; height: 100%; cursor: pointer; font-size: 0.75rem; gap: 4px;
    transition: color 0.2s;
  }
  .tab.active { color: var(--kmb-red); font-weight: 700; }
  .tab-icon { font-size: 1.5rem; margin-bottom: 2px; }

  /* Generic Location Header */
  .location-header {
    background: var(--bg-white); padding: 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .refresh-timer { font-size: 1.05rem; color: var(--kmb-red); font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Route List Item - Fixed Layout & No Overlap */
  .route-list-item {
    display: flex; padding: 18px 16px; border-bottom: 1px solid var(--border-color);
    align-items: center; gap: 16px; cursor: pointer; background: var(--bg-light);
    transition: background 0.2s;
  }
  .route-list-item.inactive-route { opacity: 0.85; }
  .route-list-item:active { background: var(--bg-white); }
  
  .route-no-col {
    min-width: 95px;
    max-width: 105px;
    flex-shrink: 0;
    font-size: 1.85rem;
    font-weight: 900;
    text-align: left;
    color: var(--text-main);
    letter-spacing: -0.5px;
    line-height: 1.1;
    word-break: break-word;
  }
  
  .route-info-col {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center;
  }
  .route-dest {
    font-size: 1.2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main);
  }
  .route-sub {
    font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  
  .route-eta-col {
    text-align: right; min-width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
  }
  .eta-time {
    font-size: 2.3rem; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; line-height: 1;
  }
  
  /* ETA Expansion Area */
  .eta-expanded-container {
    display: none; flex-direction: column; gap: 0;
    background: #181818; border-bottom: 1px solid var(--border-color);
  }
  .eta-expanded-container.active { display: flex; }
  .eta-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px dashed var(--border-color); }
  .eta-row:last-child { border-bottom: none; }
  .eta-row-left { display: flex; align-items: center; gap: 16px; font-size: 1rem; color: var(--text-sub); }
  .eta-row-seq { display: inline-block; width: 24px; font-weight: 900; color: var(--text-main); font-size: 1.4rem; }
  .eta-row-time { font-size: 2.2rem; font-weight: 900; font-variant-numeric: tabular-nums; }

  /* Search View */
  .search-box-container { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 10;}
  .search-input {
    width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px;
    font-size: 1.3rem; outline: none; text-align: center; background: var(--bg-light); color: var(--text-main); font-weight: 700;
  }
  .search-input:focus { border-color: var(--kmb-red); }
  .region-filters { display: flex; gap: 8px; justify-content: space-between; }
  .region-btn {
    flex: 1; padding: 14px 0; border-radius: 10px; border: 1px solid var(--border-color);
    background: var(--bg-light); color: var(--text-sub); font-size: 1rem; font-weight: 800; cursor: pointer; text-transform: uppercase;
  }
  .region-btn.active { background: var(--kmb-red); color: white; border-color: var(--kmb-red); }

  /* Route Detail View */
  #map-container { height: 35vh; width: 100%; background: #111; flex-shrink: 0; border-bottom: 1px solid var(--border-color); }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-light); }
  
  .stop-item {
    position: relative; padding: 24px 16px 24px 50px; border-bottom: 1px solid var(--border-color); cursor: pointer;
  }
  .stop-line {
    position: absolute; left: 28px; top: 0; bottom: 0; width: 3px; background-color: var(--kmb-red); z-index: 1;
  }
  .stop-item:first-child .stop-line { top: 34px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 34px; }
  .stop-dot {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px;
    border-radius: 50%; background: #aaa; border: 3px solid var(--bg-light); z-index: 2;
  }
  .stop-item.active-stop .stop-dot { background: var(--kmb-red); box-shadow: 0 0 0 4px rgba(227,24,55,0.3); }
  .stop-name { font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
  
  /* Map View */
  #global-map-container { flex: 1; width: 100%; background: #111; z-index: 1; }
  .map-bottom-sheet {
    position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-white);
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    max-height: 70vh; overflow-y: auto; z-index: 1000;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column;
  }
  .map-bottom-sheet.active { transform: translateY(0); }
  .sheet-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-white); z-index: 2; }
  .sheet-title { font-size: 1.25rem; font-weight: 800; }
  .sheet-close { font-size: 1.5rem; font-weight: bold; color: var(--text-sub); cursor: pointer; background: none; border: none; }
  
  /* Utilities & Status */
  .text-center { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 1.15rem; }
  .init-loader { padding: 80px 20px; text-align: center; }
  .progress-bar { width: 85%; height: 8px; background: #333; margin: 24px auto; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--kmb-red); width: 0%; transition: 0.3s; }
  
  /* Occupancy Pills */
  .occ-pill { 
    padding: 6px 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 800; 
    color: white; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 90px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .occ-seating { background: rgba(48, 209, 88, 0.2); color: var(--accent-green); border: 1px solid rgba(48, 209, 88, 0.4); }
  .occ-standing { background: rgba(255, 159, 10, 0.2); color: var(--accent-orange); border: 1px solid rgba(255, 159, 10, 0.4); }
  .occ-full { background: rgba(227, 24, 55, 0.2); color: var(--kmb-red); border: 1px solid rgba(227, 24, 55, 0.4); }

  /* Favorites Specfic */
  .add-fav-btn {
      margin: 24px; padding: 20px; background: var(--bg-white); border: 2px dashed var(--border-color);
      border-radius: 16px; text-align: center; color: var(--accent-blue); font-size: 1.25rem; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
  }
  .add-fav-btn:active { background: #2c2c2e; }

  .del-fav-btn {
      background: rgba(227, 24, 55, 0.15); border: 1px solid rgba(227, 24, 55, 0.3);
      color: var(--kmb-red); border-radius: 8px; padding: 14px 18px; font-size: 1.2rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* Fav Add Modal Overlay */
  .fav-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); z-index: 2000;
      display: none; justify-content: center; align-items: flex-end;
  }
  .fav-modal-content {
      background: var(--bg-light); width: 100%; height: 90vh;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      display: flex; flex-direction: column; overflow: hidden;
  }
  .fav-modal-header {
      padding: 20px; display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-white); border-bottom: 1px solid var(--border-color);
  }
  .fav-modal-header h3 { font-size: 1.25rem; font-weight: 800; margin: 0; color: var(--text-main); }
  .fav-modal-close { background: none; border: none; color: var(--text-sub); font-size: 1.8rem; font-weight: bold; cursor: pointer; }
  .fav-modal-search { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-search input {
      width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px;
      font-size: 1.2rem; background: var(--bg-light); color: var(--text-main); font-weight: 700; text-align: center;
  }
  .fav-modal-search input:focus { border-color: var(--accent-blue); outline: none; }
  .fav-modal-results { flex: 1; overflow-y: auto; background: var(--bg-light); }

  /* Map Tile Dark Mode Fix */
  .dark-tiles {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
  }

  .custom-user-icon div {
      width: 100% !important; height: 100% !important; background: #0a84ff !important;
      border-radius: 50% !important; border: 3px solid white !important;
      box-shadow: 0 0 12px rgba(0,0,0,0.8) !important;
  }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Bus HK</h1>
</header>

<!-- Main / Nearby View -->
<main id="view-main" class="view-container active">
  <div class="location-header">
    <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size: 1.6rem; color: var(--kmb-red);">📍</span>
        <div class="location-text" id="mainLocationText">Locating nearest stop...</div>
    </div>
    <div class="refresh-timer" id="refreshTimerMain">--</div>
  </div>
  <div id="mainRouteList">
      <div class="init-loader">
          <div id="loadText" style="font-size:1.2rem; color:var(--text-main); font-weight: 700;">Connecting to network...</div>
          <div class="progress-bar"><div class="progress-fill" id="loadBar"></div></div>
      </div>
  </div>
</main>

<!-- Search View -->
<main id="view-search" class="view-container">
  <div class="search-box-container">
    <div class="region-filters">
        <button class="region-btn active" id="filter-ALL" onclick="setRegionFilter('ALL')">All</button>
        <button class="region-btn" id="filter-KMB" onclick="setRegionFilter('KMB')">KMB</button>
        <button class="region-btn" id="filter-LWB" onclick="setRegionFilter('LWB')">LWB</button>
        <button class="region-btn" id="filter-NLB" onclick="setRegionFilter('NLB')">NLB</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Enter Route Number" oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Map View -->
<main id="view-map" class="view-container">
    <div id="global-map-container"></div>
    <div id="map-bottom-sheet" class="map-bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-title" id="sheet-title">Stop Name</div>
            <button class="sheet-close" onclick="closeMapSheet()">✕</button>
        </div>
        <div id="sheet-route-list"></div>
    </div>
</main>

<!-- Favorites View -->
<main id="view-fav" class="view-container">
  <div class="location-header" style="justify-content:center;">
      <div class="location-text">Favorite Routes</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Route Detail View -->
<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div id="stop-list-container"></div>
</main>

<!-- Bottom Tabs -->
<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main">
    <span class="tab-icon">🏠</span>
    <span>Main</span>
  </div>
  <div class="tab" onclick="switchTab('search')" id="tab-search">
    <span class="tab-icon">🔍</span>
    <span>Search</span>
  </div>
  <div class="tab" onclick="switchTab('map')" id="tab-map">
    <span class="tab-icon">🗺️</span>
    <span>Map</span>
  </div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav">
    <span class="tab-icon">⭐</span>
    <span>Favorites</span>
  </div>
</nav>

<!-- Favorite Add Modal -->
<div id="fav-modal" class="fav-modal-overlay">
    <div class="fav-modal-content">
        <div class="fav-modal-header">
            <h3>Add New Favorite</h3>
            <button class="fav-modal-close" onclick="closeFavModal()">✕</button>
        </div>
        <div class="fav-modal-search">
            <input type="text" id="favSearchInput" placeholder="Search route number..." oninput="renderFavSearch()" autocomplete="off">
        </div>
        <div id="favSearchResults" class="fav-modal-results"></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// --- Configuration & State ---
const NLB_API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
const KMB_API_BASE = 'https://data.etabus.gov.hk/v1/transport/kmb';
const REFRESH_INTERVAL = 15; 
const CACHE_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;

let currentView = 'main';
let previousView = 'main';
let allStops = [];
let groupedRoutes = []; 
let routeStopsCache = {};
let favRoutes = JSON.parse(localStorage.getItem('kmb_fav_routes_v7') || '[]');

let lastKnownPos = null;
let currentNearestStopKey = null;
let activeRegionFilter = 'ALL';
let mainExpandedGroupKey = null;
let sheetExpandedGroupKey = null;

// Map & Detail State
let detailRouteGroup = null;
let detailExpandedStopIdx = -1;
let mapInstance = null; 
let globalMapInstance = null; 
let mapRouteLayer = null;
let mapMarkers = [];
let globalMarkers = [];
let userMarkerDetail = null;
let userMarkerGlobal = null;

// Timers
let countdown = REFRESH_INTERVAL;
let timerInterval = null;
let isSyncing = false;

// --- Initialization & Data Fetching ---
async function fetchJSON(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error('API offline');
  return await response.json();
}

function getGlobalStopKey(s) {
    const lat = parseFloat(s.latitude) || 0;
    return `${s.stopName_e}_${lat.toFixed(1)}`;
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*[\(（][^\)）]*[\)）]/g, '').trim();
}

function setLoadProgress(pct, text) {
  const fill = document.getElementById('loadBar');
  const txt = document.getElementById('loadText');
  if (fill) fill.style.width = `${pct}%`;
  if (txt) txt.innerText = text;
}

async function initApp() {
  try {
    const cachedGrouped = localStorage.getItem('kmb_grouped_v7');
    const cachedStops = localStorage.getItem('kmb_stops_v7');
    const cacheTime = localStorage.getItem('kmb_cache_time_v7');
    const now = Date.now(); 

    let loadedFromCache = false;
    if (cachedGrouped && cachedStops && cacheTime && (now - parseInt(cacheTime) < CACHE_EXPIRY_MS)) {
      try {
          setLoadProgress(100, "Loading from cache...");
          groupedRoutes = JSON.parse(cachedGrouped);
          routeStopsCache = JSON.parse(cachedStops);
          loadedFromCache = true;
      } catch (e) { localStorage.removeItem('kmb_cache_time_v7'); }
    } 
    
    if (!loadedFromCache) {
      setLoadProgress(10, "Fetching Network Data...");
      const groupedMap = new Map();
      routeStopsCache = {};

      try {
          const nlbRData = await fetchJSON(`${NLB_API_BASE}/route.php?action=list`);
          const rawNlbRoutes = nlbRData.routes || [];
          
          rawNlbRoutes.forEach(r => {
            const dest_e = r.routeName_e ? r.routeName_e.split('>').pop().trim() : '';
            const cleanDest = cleanStopName(dest_e); 
            const key = `NLB_${r.routeNo}___${cleanDest}`.replace(/[^a-zA-Z0-9_-]/g, '_');

            if (!groupedMap.has(key)) {
              groupedMap.set(key, { key, routeNo: r.routeNo, dest_e: cleanDest, routeIds: [`NLB_${r.routeId}`], company: 'NLB' });
            } else {
              groupedMap.get(key).routeIds.push(`NLB_${r.routeId}`);
            }
          });

          const chunkSize = 15;
          for (let i = 0; i < rawNlbRoutes.length; i += chunkSize) {
            const chunk = rawNlbRoutes.slice(i, i + chunkSize);
            await Promise.all(chunk.map(async (r) => {
              try {
                const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=list&routeId=${r.routeId}`);
                routeStopsCache[`NLB_${r.routeId}`] = (res.stops || []).map(s => ({...s, stopName_e: cleanStopName(s.stopName_e)}));
              } catch(e) {}
            }));
            setLoadProgress(10 + ((i / rawNlbRoutes.length) * 30), "Syncing Lantau Routes...");
          }
      } catch(e) {}

      try {
          setLoadProgress(40, "Fetching KMB Network...");
          const [kmbRoutesRes, kmbStopsRes, kmbRouteStopsRes] = await Promise.all([
              fetch(`${KMB_API_BASE}/route/`).then(r => r.json()).catch(()=>null),
              fetch(`${KMB_API_BASE}/stop/`).then(r => r.json()).catch(()=>null),
              fetch(`${KMB_API_BASE}/route-stop/`).then(r => r.json()).catch(()=>null)
          ]);

          setLoadProgress(80, "Building System Index...");
          const allKmbStops = {};
          if (kmbStopsRes && kmbStopsRes.data) kmbStopsRes.data.forEach(s => { allKmbStops[s.stop] = s; });

          const formatStopName = (name) => name ? name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ') : '';

          if (kmbRoutesRes && kmbRouteStopsRes) {
              const kmbRouteStopsMap = {};
              kmbRouteStopsRes.data.forEach(rs => {
                  const key = `KMB_${rs.route}_${rs.bound}_${rs.service_type}`;
                  if (!kmbRouteStopsMap[key]) kmbRouteStopsMap[key] = [];
                  kmbRouteStopsMap[key].push(rs);
              });

              kmbRoutesRes.data.forEach(r => {
                  const rId = `KMB_${r.route}_${r.bound}_${r.service_type}`;
                  const rsData = kmbRouteStopsMap[rId];
                  if (!rsData) return;

                  rsData.sort((a,b) => parseInt(a.seq) - parseInt(b.seq));
                  routeStopsCache[rId] = rsData.map(rs => {
                      const stopDetail = allKmbStops[rs.stop] || { name_en: 'Unknown', lat: '0', long: '0' };
                      return { stopId: rs.stop, stopName_e: formatStopName(cleanStopName(stopDetail.name_en)), latitude: stopDetail.lat, longitude: stopDetail.long, seq: rs.seq };
                  });

                  const company = (r.route.startsWith('E') || r.route.startsWith('A') || r.route.startsWith('NA') || r.route.startsWith('S')) ? 'LWB' : 'KMB';
                  const cleanDestE = formatStopName(cleanStopName(r.dest_en));
                  const groupKey = `KMB_${r.route}___${cleanDestE}`.replace(/[^a-zA-Z0-9_-]/g, '_');

                  if (!groupedMap.has(groupKey)) {
                      groupedMap.set(groupKey, { key: groupKey, routeNo: r.route, dest_e: cleanDestE, routeIds: [rId], company: company });
                  } else {
                      groupedMap.get(groupKey).routeIds.push(rId);
                  }
              });
          }
      } catch(e) {}

      groupedRoutes = Array.from(groupedMap.values());
      try {
        localStorage.setItem('kmb_grouped_v7', JSON.stringify(groupedRoutes));
        localStorage.setItem('kmb_stops_v7', JSON.stringify(routeStopsCache));
        localStorage.setItem('kmb_cache_time_v7', Date.now().toString());
      } catch (e) {}
    }
    
    buildAllStopsList();
    initDetailMap(); 
    
    await locateNearestStopPromise();
    startTimer();
    
  } catch (err) {
    document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="color:var(--kmb-red);">Error connecting to transit network.</div>';
  }
}

function buildAllStopsList() {
  const uniqueStops = new Map();
  groupedRoutes.forEach(g => {
    g.routeIds.forEach(id => {
      (routeStopsCache[id] || []).forEach(s => {
        if (!s || !s.stopName_e) return;
        const key = getGlobalStopKey(s);
        if (!uniqueStops.has(key)) {
            uniqueStops.set(key, { ...s, stopKey: key, routes: new Set([g.key]), latitude: s.latitude, longitude: s.longitude });
        } else {
            uniqueStops.get(key).routes.add(g.key);
        }
      });
    });
  });
  allStops = Array.from(uniqueStops.values());
}

function getStopsForGroup(group) {
  const uniqueMap = new Map();
  if (!group || !group.routeIds || group.routeIds.length === 0) return [];
  const primaryRouteId = group.routeIds[0]; 
  
  let seq = 1;
  (routeStopsCache[primaryRouteId] || []).forEach(s => {
     const key = getGlobalStopKey(s);
     if (s && s.stopName_e && !uniqueMap.has(key)) {
        uniqueMap.set(key, { ...s, stopKey: key, seq: seq++, latitude: s.latitude, longitude: s.longitude });
     }
  });
  return Array.from(uniqueMap.values());
}

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// --- GPS Location ---
function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            renderMainNearby(); resolve(false); return;
        }

        document.getElementById('mainLocationText').innerText = 'Locating...';

        navigator.geolocation.getCurrentPosition((pos) => {
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            
            const userIcon = L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });
            
            if(mapInstance) {
                if(!userMarkerDetail) userMarkerDetail = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(mapInstance);
                else userMarkerDetail.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
            }
            if(globalMapInstance) {
                if(!userMarkerGlobal) userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(globalMapInstance);
                else userMarkerGlobal.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
            }
            
            let closest = null, minDistance = Infinity;
            allStops.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                document.getElementById('mainLocationText').innerText = closest.stopName_e;
                renderMainNearby();
                
                if (currentView === 'map' && globalMapInstance) {
                    renderGlobalMapStops();
                }
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby stops';
                document.getElementById('mainRouteList').innerHTML = '';
            }
            resolve(true);
        }, () => {
            document.getElementById('mainLocationText').innerText = 'Location Access Denied';
            renderMainNearby(); resolve(false);
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 });
    });
}

// --- UI Navigation ---
function switchTab(tabId) {
    if (tabId === 'main') {
        mainExpandedGroupKey = null; 
        document.getElementById('mainLocationText').innerText = 'Locating...';
        locateNearestStopPromise();
    }
    
    currentView = tabId;
    detailRouteGroup = null; 
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerTitle').innerText = 'Bus HK';
    
    if (tabId === 'search') renderSearchResults();
    if (tabId === 'fav') renderFavList();
    if (tabId === 'map') {
        closeMapSheet();
        if (!globalMapInstance) {
            initGlobalMap();
            locateNearestStopPromise().then(() => {
                renderGlobalMapStops();
            });
        } else {
            globalMapInstance.invalidateSize();
            renderGlobalMapStops();
        }
    }
}

function openRouteDetail(groupKey) {
    const group = groupedRoutes.find(g => g.key === groupKey);
    if (!group) return;
    
    previousView = currentView;
    detailRouteGroup = group;
    detailExpandedStopIdx = -1;
    currentView = 'detail';
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-detail').classList.add('active');
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('headerTitle').innerText = `${group.routeNo} To ${group.dest_e}`;
    
    setTimeout(() => {

}

function navigateBack() {

}

// --- Map Logic ---
function initDetailMap() {
    mapInstance = L.map('map-container', { zoomControl: false }).setView([22.3, 114.16], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        className: 'dark-tiles',
        attribution: '&copy; OpenStreetMap'
    }).addTo(mapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
}

function initGlobalMap() {
    globalMapInstance = L.map('global-map-container', { zoomControl: false }).setView([22.3, 114.16], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        className: 'dark-tiles',
        attribution: '&copy; OpenStreetMap'
    }).addTo(globalMapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(globalMapInstance);
    
    if (lastKnownPos) {
        const userIcon = L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });
        userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(globalMapInstance);
        globalMapInstance.setView([lastKnownPos.lat, lastKnownPos.lon], 16);
    }
}

function drawRouteOnMap(group) {
    if(!mapInstance) return;
    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = getStopsForGroup(group);
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: 'var(--kmb-red)', weight: 6, opacity: 0.9}).addTo(mapInstance);
    
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        marker.on('click', () => {
            expandStop(idx);
            document.getElementById(`stop-item-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        mapMarkers.push(marker);
    });
    
    const bounds = mapRouteLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) {
        bounds.extend(userMarkerDetail.getLatLng());
    }
    mapInstance.fitBounds(bounds, { padding: [40, 40] });
}

function renderGlobalMapStops() {
    if (!globalMapInstance || !lastKnownPos) return;
    
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];
    
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:16px;height:16px;background:white;border:4px solid var(--kmb-red);border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.5);"></div>', iconSize: [16, 16] });
    
    let nearby = allStops.filter(s => calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, parseFloat(s.latitude), parseFloat(s.longitude)) <= 0.8);
    
    nearby.forEach(s => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(globalMapInstance);
        marker.on('click', () => {
            globalMapInstance.setView(marker.getLatLng(), 17, { animate: true });
            openMapSheet(s);
        });
        globalMarkers.push(marker);
    });
    
    globalMapInstance.setView([lastKnownPos.lat, lastKnownPos.lon], 16);
}

function openMapSheet(stopObj) {
    document.getElementById('map-bottom-sheet').classList.add('active');
    document.getElementById('sheet-title').innerText = stopObj.stopName_e;
    
    let relevantGroups = [];
    stopObj.routes.forEach(groupKey => {
        const group = groupedRoutes.find(g => g.key === groupKey);
        if (group) relevantGroups.push(group); 
    });
    
    const listEl = document.getElementById('sheet-route-list');
    listEl.innerHTML = '<div class="text-center">Loading schedules...</div>';
    
    Promise.all(relevantGroups.map(async g => {
        try {
            const arrs = await fetchEtaRaw(g, stopObj.stopKey);
            let firstEtaMins = Infinity;
            if (arrs.length > 0) {
                const targetMs = new Date(arrs[0].estimatedArrivalTime.replace(/-/g, '/')).getTime();
                firstEtaMins = Math.max(0, Math.floor((targetMs - Date.now())/60000));
            }
            return { group: g, arrs, firstEtaMins };
        } catch(e) {
            return { group: g, arrs: [], firstEtaMins: Infinity };
        }
    })).then(groupsWithEtas => {
        groupsWithEtas.sort((a, b) => {
            if (a.firstEtaMins !== Infinity && b.firstEtaMins !== Infinity) {
                return a.firstEtaMins - b.firstEtaMins;
            } else if (a.firstEtaMins === Infinity && b.firstEtaMins === Infinity) {
                const numA = parseInt(a.group.routeNo.replace(/[^0-9]/g, '')) || 999;
                const numB = parseInt(b.group.routeNo.replace(/[^0-9]/g, '')) || 999;
                if (numA === numB) return a.group.routeNo.localeCompare(b.group.routeNo);
                return numA - numB;
            } else {
                return a.firstEtaMins === Infinity ? 1 : -1;
            }
        });

        let html = '';
        groupsWithEtas.forEach(item => {
            const g = item.group;
            const arrs = item.arrs;
            const mins = item.firstEtaMins;

            let summaryHtml = '';
            let itemClass = '';
            
            if (mins !== Infinity) {
                let timeHtml = mins === 0 ? 'Due' : `${mins}<span style="font-size:1.1rem; margin-left:2px;">m</span>`;
                let isScheduled = (arrs[0].noGPS === 1 || arrs[0].noGPS === '1');
                let colorClass = isScheduled ? 'color: var(--accent-orange)' : 'color: var(--accent-green)';
                summaryHtml = `<div class="eta-time" style="${colorClass}">${timeHtml}</div>`;
            } else {
                summaryHtml = `<div class="eta-time" style="color:var(--text-sub)">--</div>`;
                itemClass = 'inactive-route';
            }

            html += `
              <div class="route-list-item ${itemClass}" onclick="toggleSheetEta('${g.key}', '${stopObj.stopKey}')" id="sheet-item-${g.key}">
                  <div class="route-no-col">${g.routeNo}</div>
                  <div class="route-info-col">
                      <div class="route-dest">To ${g.dest_e}</div>
                  </div>
                  <div class="route-eta-col" id="sheet-eta-summary-${g.key}">
                     ${summaryHtml}
                  </div>
              </div>
              <div class="eta-expanded-container" id="sheet-eta-expanded-${g.key}"></div>
            `;
        });
        
        listEl.innerHTML = html || '<div class="text-center">No routes available</div>';
    });
}

function closeMapSheet() {
    document.getElementById('map-bottom-sheet').classList.remove('active');
    sheetExpandedGroupKey = null;
}

async function toggleSheetEta(groupKey, stopKey) {
    const expandContainer = document.getElementById(`sheet-eta-expanded-${groupKey}`);
    if (!expandContainer) return;
    
    if (sheetExpandedGroupKey === groupKey) {
        expandContainer.classList.remove('active');
        sheetExpandedGroupKey = null;
    } else {
        if (sheetExpandedGroupKey) {
            const prev = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
            if (prev) prev.classList.remove('active');
        }
        sheetExpandedGroupKey = groupKey;
        expandContainer.classList.add('active');
        expandContainer.innerHTML = '<div style="color:var(--text-sub); padding: 20px; text-align:center;">Loading...</div>';
        
        const group = groupedRoutes.find(g => g.key === groupKey);
        if(group) {
            try {
                const arrs = await fetchEtaRaw(group, stopKey);
                expandContainer.innerHTML = generateExpandedETAsHtml(arrs, group, stopKey);
            } catch(e) {
                expandContainer.innerHTML = '<div style="color:var(--kmb-red); padding: 20px; text-align:center;">Failed</div>';
            }
        }
    }
}

// --- Main View Core Logic ---
async function renderMainNearby(isSilentRefresh = false) {
    const listEl = document.getElementById('mainRouteList');
    if (!currentNearestStopKey) {
        if (!isSilentRefresh) listEl.innerHTML = '<div class="text-center">Locating...</div>';
        return;
    }
    
    const stopObj = allStops.find(s => s.stopKey === currentNearestStopKey);
    if (!stopObj) return;

    let relevantGroups = [];
    stopObj.routes.forEach(groupKey => {
        const group = groupedRoutes.find(g => g.key === groupKey);
        if (group) relevantGroups.push(group); 
    });

    if (!isSilentRefresh) {
        listEl.innerHTML = '<div class="init-loader"><div style="font-size:1.2rem; color:var(--text-main); font-weight:700;">Fetching live times...</div></div>';
    }

    let groupsWithEtas = await Promise.all(relevantGroups.map(async g => {
        try {
            const arrs = await fetchEtaRaw(g, currentNearestStopKey);
            let firstEtaMins = Infinity;
            if (arrs.length > 0) {
                const targetMs = new Date(arrs[0].estimatedArrivalTime.replace(/-/g, '/')).getTime();
                firstEtaMins = Math.max(0, Math.floor((targetMs - Date.now())/60000));
            }
            return { group: g, arrs, firstEtaMins };
        } catch(e) {
            return { group: g, arrs: [], firstEtaMins: Infinity };
        }
    }));

    // Sort: Active buses by time, then Inactive buses by alphanumeric route number
    groupsWithEtas.sort((a, b) => {
        if (a.firstEtaMins !== Infinity && b.firstEtaMins !== Infinity) {
            return a.firstEtaMins - b.firstEtaMins;
        } else if (a.firstEtaMins === Infinity && b.firstEtaMins === Infinity) {
            const numA = parseInt(a.group.routeNo.replace(/[^0-9]/g, '')) || 999;
            const numB = parseInt(b.group.routeNo.replace(/[^0-9]/g, '')) || 999;
            if (numA === numB) return a.group.routeNo.localeCompare(b.group.routeNo);
            return numA - numB;
        } else {
            return a.firstEtaMins === Infinity ? 1 : -1;
        }
    });

    let html = '';
    groupsWithEtas.forEach(item => {
        const g = item.group;
        const arrs = item.arrs;
        const mins = item.firstEtaMins;

        let summaryHtml = '';
        let itemClass = '';
        
        if (mins !== Infinity) {
            let timeHtml = mins === 0 ? 'Due' : `${mins}<span style="font-size:1.1rem; margin-left:2px;">m</span>`;
            let isScheduled = (arrs[0].noGPS === 1 || arrs[0].noGPS === '1');
            let colorClass = isScheduled ? 'color: var(--accent-orange)' : 'color: var(--accent-green)';
            summaryHtml = `<div class="eta-time" style="${colorClass}">${timeHtml}</div>`;
        } else {
            summaryHtml = `<div class="eta-time" style="color:var(--text-sub)">--</div>`;
            itemClass = 'inactive-route';
        }

        const isExpanded = (mainExpandedGroupKey === g.key);
        const expandClass = isExpanded ? 'active' : '';

        html += `
          <div class="route-list-item ${itemClass}" onclick="toggleMainEta('${g.key}')" id="main-item-${g.key}">
              <div class="route-no-col">${g.routeNo}</div>
              <div class="route-info-col">
                  <div class="route-dest">To ${g.dest_e}</div>
                  <div class="route-sub">${g.company}</div>
              </div>
              <div class="route-eta-col" id="main-eta-summary-${g.key}">
                 ${summaryHtml}
              </div>
          </div>
          <div class="eta-expanded-container ${expandClass}" id="main-eta-expanded-${g.key}">
        `;
        
        if (isExpanded) {
            html += generateExpandedETAsHtml(arrs, g, currentNearestStopKey);
        }
        
        html += `</div>`;
    });

    listEl.innerHTML = html || '<div class="text-center">No routes found for this stop.</div>';
}

async function toggleMainEta(groupKey) {
    if (mainExpandedGroupKey === groupKey) {
        document.getElementById(`main-eta-expanded-${groupKey}`).classList.remove('active');
        mainExpandedGroupKey = null;
    } else {
        if (mainExpandedGroupKey) {
            const prev = document.getElementById(`main-eta-expanded-${mainExpandedGroupKey}`);
            if (prev) prev.classList.remove('active');
        }
        mainExpandedGroupKey = groupKey;
        const expandContainer = document.getElementById(`main-eta-expanded-${groupKey}`);
        expandContainer.classList.add('active');
        expandContainer.innerHTML = '<div style="color:var(--text-sub); padding: 20px; text-align:center;">Loading times...</div>';
        
        const group = groupedRoutes.find(g => g.key === groupKey);
        if(group && currentNearestStopKey) {
            try {
                const arrs = await fetchEtaRaw(group, currentNearestStopKey);
                expandContainer.innerHTML = generateExpandedETAsHtml(arrs, group, currentNearestStopKey);
            } catch(e) {
                expandContainer.innerHTML = '<div style="color:var(--kmb-red); padding: 20px; text-align:center;">Failed to load.</div>';
            }
        }
    }
}

function generateExpandedETAsHtml(arrs, group, stopKey) {
    if (arrs.length === 0) {
        return '<div style="color:var(--text-sub); text-align:center; padding: 20px;">No further departures scheduled.</div>';
    }
    
    const stops = getStopsForGroup(group);
    const stopIdx = stops.findIndex(s => s.stopKey === stopKey);
    
    let html = '';
    // Show max 3 buses
    for(let i = 0; i < Math.min(3, arrs.length); i++) {
        const arr = arrs[i];
        const targetMs = new Date(arr.estimatedArrivalTime.replace(/-/g, '/')).getTime();
        let mins = Math.max(0, Math.floor((targetMs - Date.now())/60000));
        let isScheduled = (arr.noGPS === 1 || arr.noGPS === '1');
        
        let timeStr = mins === 0 ? 'Due' : `${mins} <span style="font-size:1.2rem; font-weight:700;">m</span>`;
        let color = isScheduled ? 'var(--accent-orange)' : 'var(--accent-green)'; 
        
        // Only show occupancy for the immediate bus AND if it's within 20 mins
        let occBadge = '';
        if (i === 0 && mins <= 20) {
            const occPct = calculateOccupancy(group.routeNo, group.dest_e, Math.max(0, stopIdx), stops.length, Date.now());
            let occClass = occPct > 80 ? 'occ-full' : (occPct > 50 ? 'occ-standing' : 'occ-seating');
            let occText = occPct > 80 ? 'Full' : (occPct > 50 ? 'Standing' : 'Seating');
            occBadge = `<span class="occ-pill ${occClass}">${occText}</span>`;
        }
        
        html += `
            <div class="eta-row">
                <div class="eta-row-left">
                    <span class="eta-row-seq">${i+1}</span>
                    ${occBadge}
                </div>
                <div class="eta-row-time" style="color:${color};">${timeStr}</div>
            </div>
        `;
    }
    return html;
}

function renderSearchResults() {

    const listEl = document.getElementById('searchResults');
    
    let matches = groupedRoutes;
    if (activeRegionFilter !== 'ALL') {
        matches = matches.filter(g => g.company === activeRegionFilter);
    }
    if(query) {
        matches = matches.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query));
    }
    
    if(matches.length === 0) {
        listEl.innerHTML = '<div class="text-center" style="padding-top:60px; font-size:4rem; opacity:0.2;">🚌</div><div class="text-center" style="padding-top:0;">No routes found</div>';

         return;
    }
    
    let html = '';
    matches.slice(0, 100).forEach(g => {
        html += `
          <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
              <div class="route-no-col" style="color:var(--kmb-red);">${g.routeNo}</div>

}

function renderFavSearch() {
    const query = document.getElementById('favSearchInput').value.trim().toLowerCase();

    if(!query) {
        listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">🔍</div><div class="text-center" style="padding-top:0;">Type route number to add</div>';

    }

    const matches = groupedRoutes.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query));
    
    if(matches.length === 0) {
        listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">🚌</div><div class="text-center" style="padding-top:0;">No routes found</div>';
        return;
    }
    
    let html = '';
    matches.slice(0, 50).forEach(g => {
        const isSaved = favRoutes.includes(g.key);
        html += `
          <div class="route-list-item" style="opacity: ${isSaved ? '0.5' : '1'}; pointer-events: ${isSaved ? 'none' : 'auto'};" onclick="addFavFromModal('${g.key}')">
              <div class="route-no-col" style="color:var(--kmb-red);">${g.routeNo}</div>
              <div class="route-info-col">
                  <div class="route-dest">To ${g.dest_e}</div>
                  <div class="route-sub">${g.company} ${isSaved ? ' (Saved)' : ''}</div>
              </div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function addFavFromModal(key) {
    if(!favRoutes.includes(key)) {
        favRoutes.push(key);
        localStorage.setItem('kmb_fav_routes_v7', JSON.stringify(favRoutes));
    }
    closeFavModal();
    renderFavList();
}

// --- Detail View Stops ---
function renderStopList() {
    const listEl = document.getElementById('stop-list-container');
    const stops = getStopsForGroup(detailRouteGroup);
    
    let html = '';
    stops.forEach((s, idx) => {
        html += `
            <div class="stop-item" id="stop-item-${idx}" onclick="expandStop(${idx})">
                <div class="stop-line"></div>
                <div class="stop-dot" id="stop-dot-${idx}"></div>
                <div class="stop-name">${idx + 1}. ${s.stopName_e}</div>
                <div class="eta-expanded-container" id="detail-eta-expanded-${idx}" style="margin-top: 20px; border-radius:12px;"></div>
            </div>
        `;
    });
    listEl.innerHTML = html;
}

async function expandStop(idx) {
    if (detailExpandedStopIdx === idx) {
        document.getElementById(`detail-eta-expanded-${idx}`).classList.remove('active');
        document.getElementById(`stop-item-${idx}`).classList.remove('active-stop');
        
        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) {
            mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] }));
        }
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: '<div style="width:20px;height:20px;background:white;border:6px solid var(--kmb-red);border-radius:50%;"></div>', iconSize: [20, 20] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    const stops = getStopsForGroup(detailRouteGroup);
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchEtaRaw(detailRouteGroup, targetStop.stopKey);
        expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup, targetStop.stopKey);
    } catch(e) {
        expandContainer.innerHTML = '<div style="color:var(--kmb-red); padding:20px; text-align:center;">Failed to fetch ETAs.</div>';
    }
}

// --- API Helpers ---
async function fetchEtaRaw(group, stopKeyToMatch) {
    let combined = [];
    const now = Date.now();
    
    await Promise.all(group.routeIds.map(async (rId) => {
        const stops = routeStopsCache[rId] || [];
        const tIndex = stops.findIndex(s => getGlobalStopKey(s) === stopKeyToMatch);
        if (tIndex === -1) return;
        
        const targetStop = stops[tIndex];
        
        if (rId.startsWith('KMB_')) {
            const parts = rId.split('_');
            const routeNo = parts[1], dir = parts[2], serviceType = parts[3];
            try {
                const res = await fetchJSON(`${KMB_API_BASE}/eta/${targetStop.stopId}/${routeNo}/${serviceType}`);
                if(res && res.data) {
                    res.data.filter(e => e.dir === dir && e.eta).forEach(e => {
                        combined.push({
                            estimatedArrivalTime: e.eta.replace('T', ' ').substring(0, 19),
                            noGPS: (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0
                        });
                    });
                }
            } catch(e) {}
        } else {
            const rawNlbId = rId.replace('NLB_', '');
            try {
                const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rawNlbId}&stopId=${targetStop.stopId}&language=en`);
                if(res && res.estimatedArrivals) {
                    res.estimatedArrivals.forEach(arr => combined.push(arr));
                }
            } catch(e) {}
        }
    }));
    
    return combined.filter(arr => new Date(arr.estimatedArrivalTime.replace(/-/g, '/')).getTime() > now - 60000)
                   .sort((a,b) => a.estimatedArrivalTime.localeCompare(b.estimatedArrivalTime));
}

function calculateOccupancy(routeNo, destName, currentStopIndex, totalStops, currentTimestamp) {
  const date = new Date(currentTimestamp);
  const hour = date.getHours();
  const day = date.getDay(); 
  const isWeekend = (day === 0 || day === 6);
  let baseLoad = 30; 
  
  if (!isWeekend) {
    if (hour >= 7 && hour <= 9) baseLoad = 75;
    else if (hour >= 17 && hour <= 20) baseLoad = 85;
  } else {
    if (hour >= 9 && hour <= 19) baseLoad = 65;
  }
  
  let progress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
  let spatialMultiplier = Math.sin(progress * Math.PI) + 0.3;
  return Math.min(100, Math.max(0, Math.round(baseLoad * spatialMultiplier)));
}

// --- Global App Loop ---
function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  
  timerInterval = setInterval(() => {
    if (isSyncing) return;
    countdown--;
    
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimerMain').innerText = '...';
      
      if (currentView === 'main') {
          renderMainNearby(true).then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          const stops = getStopsForGroup(detailRouteGroup);
          const targetStop = stops[detailExpandedStopIdx];
          fetchEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              const expandContainer = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
              if(expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup, targetStop.stopKey);
              isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else if (currentView === 'map' && sheetExpandedGroupKey) {
          const group = groupedRoutes.find(g => g.key === sheetExpandedGroupKey);
          if(group && currentNearestStopKey) {
              fetchEtaRaw(group, currentNearestStopKey).then(arrs => {
                 const expandContainer = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
                 if (expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, group, currentNearestStopKey);
                 isSyncing = false;
              }).catch(() => { isSyncing = false; });
          } else { isSyncing = false; }
      } else {
          isSyncing = false;
      }
    } else {
      document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
    }
  }, 1000);
}

// Init
window.onload = initApp;
