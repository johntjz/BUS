<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TransitPulse HK - Smart Engine</title>
<style>
  :root {
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-blue: #0a84ff;
    --accent-yellow: #ffd60a;
    --accent-orange: #ff9f0a;
    --accent-purple: #bf5af2;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background-color: var(--accent-red);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  
  .live-badge {
    background: rgba(0,0,0,0.25);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  
  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  .stop-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: var(--bg-color);
    gap: 10px;
    flex-wrap: wrap;
  }

  .stop-selector-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 240px;
  }

  .stop-select {
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-weight: 600;
    outline: none;
    max-width: 200px;
  }

  .stop-input {
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.82rem;
    outline: none;
    width: 110px;
  }

  .refresh-timer { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; }

  #routeList { display: flex; flex-direction: column; }

  .route-card {
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
    background-color: var(--bg-color);
    gap: 12px;
  }

  .card-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .route-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; padding-right: 10px; }
  .route-no { font-size: 1.8rem; font-weight: 900; width: 60px; letter-spacing: -0.5px; flex-shrink: 0; }

  .route-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  
  .dest-wrap { display: flex; align-items: center; flex-wrap: wrap; column-gap: 10px; row-gap: 4px; }
  .route-dest { font-size: 0.95rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  
  .route-status { font-size: 0.75rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .eta-container { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 50px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; }

  .official-eta {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .smart-eta {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--accent-green);
    font-variant-numeric: tabular-nums;
  }

  .smart-eta.adjusted { color: var(--accent-blue); }

  .compact-occupancy {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.03);
  }

  .bar-segments {
    display: flex;
    gap: 2px;
  }

  .segment {
    width: 4px;
    height: 10px;
    border-radius: 1px;
    background-color: #2c2c2e;
  }

  .segment.active-green { background-color: var(--accent-green); }
  .segment.active-orange { background-color: var(--accent-orange); }
  .segment.active-red { background-color: var(--accent-red); }

  .occupancy-pct-text {
    font-size: 0.7rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 28px;
    text-align: right;
  }

  .inference-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .tag {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    font-weight: 500;
  }

  .tag.blue { color: var(--accent-blue); border-color: rgba(10, 132, 255, 0.3); }
  .tag.green { color: var(--accent-green); border-color: rgba(48, 209, 88, 0.3); }
  .tag.orange { color: var(--accent-orange); border-color: rgba(255, 159, 10, 0.3); }
  .tag.yellow { color: var(--accent-yellow); border-color: rgba(255, 214, 10, 0.3); }
  .tag.purple { color: var(--accent-purple); border-color: rgba(191, 90, 242, 0.3); }
</style>
</head>
<body>

<div class="header">
  <h1>TransitPulse HK</h1>
  <div class="live-badge">SMART ENGINE</div>
</div>

<div class="stop-header">
  <div class="stop-selector-wrap">
    <span>📍</span>
    <select id="stopSelect" class="stop-select" onchange="handleStopSelect(this.value)">
      <option value="Lo Uk Tsuen">Lo Uk Tsuen (老屋村)</option>
      <option value="Mui Wo Ferry Pier">Mui Wo Ferry Pier (梅窩碼頭)</option>
      <option value="Tung Chung">Tung Chung Town Centre (東涌)</option>
      <option value="Tat Tung Road">Tung Chung Tat Tung Rd (達東路)</option>
      <option value="Tai O">Tai O (大澳)</option>
      <option value="Ngong Ping">Ngong Ping (昂坪)</option>
      <option value="Shek Pik">Shek Pik (石壁)</option>
      <option value="Tong Fuk">Tong Fuk (塘福)</option>
      <option value="Pui O San Wai">Pui O San Wai (貝澳新圍)</option>
      <option value="Airport">Airport GTC (機場)</option>
    </select>
    <input type="text" id="customStopInput" class="stop-input" placeholder="Custom stop..." onchange="handleCustomStop(this.value)">
  </div>
  <span class="refresh-timer" id="refreshTimer">Syncing...</span>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Initializing network telemetry...</div>
</div>

<script>
  const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
  const REFRESH_INTERVAL = 30;
  
  let currentStopName = localStorage.getItem('selectedNLBStop') || 'Lo Uk Tsuen';
  let countdown = REFRESH_INTERVAL;
  let timerInterval;
  const busStateMap = {};

  // Preset stop selector UI match
  document.addEventListener('DOMContentLoaded', () => {
    const selectEl = document.getElementById('stopSelect');
    const customEl = document.getElementById('customStopInput');
    
    let matched = false;
    for (let option of selectEl.options) {
      if (option.value.toLowerCase() === currentStopName.toLowerCase()) {
        selectEl.value = option.value;
        matched = true;
        break;
      }
    }
    if (!matched) {
      customEl.value = currentStopName;
    }
  });

  function handleStopSelect(val) {
    document.getElementById('customStopInput').value = '';
    changeStop(val);
  }

  function handleCustomStop(val) {
    if (val.trim()) {
      changeStop(val.trim());
    }
  }

  function changeStop(newStop) {
    currentStopName = newStop;
    localStorage.setItem('selectedNLBStop', currentStopName);
    
    // Clear route cards & state
    document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Syncing stop telemetry...</div>';
    for (let key in busStateMap) delete busStateMap[key];
    
    countdown = REFRESH_INTERVAL;
    updateNetworkTelemetry();
  }

  function calculateDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function calculateOccupancy(destName, estimatedArrivals) {
    const now = new Date();
    const hour = now.getHours();
    const dest = destName.toLowerCase();

    let baseLoad = 35; 
    if (hour >= 7 && hour <= 9) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo')) ? 75 : 40;
    } else if (hour >= 17 && hour <= 19) {
      baseLoad = (!dest.includes('tung chung')) ? 70 : 45;
    } else if (hour >= 11 && hour <= 14) {
      baseLoad = 38;
    }

    let multiplier = 1.0;

    if (estimatedArrivals && estimatedArrivals.length >= 2) {
      const serverTime = new Date(estimatedArrivals[0].generateTime.replace(/-/g, '/'));
      const t1 = Math.max(0, Math.floor((new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000));
      const t2 = Math.max(0, Math.floor((new Date(estimatedArrivals[1].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000));
      const gap = t2 - t1;

      if (gap <= 10) {
        multiplier = 1.95;
      } else {
        multiplier = Math.max(0.4, Math.min(2.1, gap / 15.0));
      }
    }

    const pct = Math.min(98, Math.max(12, Math.round(baseLoad * multiplier)));
    const activeBars = Math.min(10, Math.max(1, Math.round(pct / 10)));

    return { pct, activeBars };
  }

  async function fetchJSON(endpoint) {
    const response = await fetch(`${API_BASE}${endpoint}`);
    if (!response.ok) throw new Error('API offline');
    return await response.json();
  }

  async function updateNetworkTelemetry() {
    try {
      const routeData = await fetchJSON('/route.php?action=list');
      const allRoutes = routeData.routes;
      
      const promises = allRoutes.map(route => processRouteSmartETA(route));
      await Promise.all(promises);

      const loadingEl = document.getElementById('loadingText');
      if (loadingEl) loadingEl.remove();

      sortCards();

    } catch (err) {
      console.error('Telemetry failure:', err);
    }
  }

  async function processRouteSmartETA(route) {
    const routeId = route.routeId;
    
    try {
      const stopData = await fetchJSON(`/stop.php?action=list&routeId=${routeId}`);
      const stops = stopData.stops || [];
      
      // Case-insensitive flexible stop search for any NLB location
      const targetIndex = stops.findIndex(s => 
        (s.stopName_e && s.stopName_e.toLowerCase().includes(currentStopName.toLowerCase())) ||
        (s.stopName_c && s.stopName_c.includes(currentStopName))
      );

      const cardId = `route-${routeId}`;
      let cardEl = document.getElementById(cardId);

      if (targetIndex === -1) {
        if (cardEl) cardEl.remove();
        return;
      }

      const destName = route.routeName_e.split('>').pop().trim();

      // Dynamically add card if route serves this stop
      if (!cardEl) {
        const listEl = document.getElementById('routeList');
        const loadingEl = document.getElementById('loadingText');
        if (loadingEl) loadingEl.remove();

        listEl.insertAdjacentHTML('beforeend', `
          <div class="route-card" id="${cardId}" data-smart-mins="9999">
            <div class="card-main">
              <div class="route-left">
                <div class="route-no">${route.routeNo}</div>
                <div class="route-info">
                  <div class="dest-wrap">
                    <div class="route-dest">To ${destName}</div>
                    <div class="compact-occupancy" id="occ-sec-${routeId}" style="display:none;">
                      <div class="bar-segments" id="bars-${routeId}">
                        ${Array(10).fill('<div class="segment"></div>').join('')}
                      </div>
                      <span class="occupancy-pct-text" id="pct-${routeId}">--%</span>
                    </div>
                  </div>
                  <div class="route-status" id="status-${routeId}">Loading telemetry...</div>
                </div>
              </div>
              <div class="eta-container">
                <div class="eta-box">
                  <span class="eta-label">Official</span>
                  <span class="official-eta" id="off-${routeId}">--</span>
                </div>
                <div class="eta-box">
                  <span class="eta-label">Smart</span>
                  <span class="smart-eta" id="smart-${routeId}">--</span>
                </div>
              </div>
            </div>
            <div class="inference-row" id="tags-${routeId}"></div>
          </div>
        `);
        cardEl = document.getElementById(cardId);
      }

      const statusEl = document.getElementById(`status-${routeId}`);
      const offEl = document.getElementById(`off-${routeId}`);
      const smartEl = document.getElementById(`smart-${routeId}`);
      const tagsEl = document.getElementById(`tags-${routeId}`);
      const occSecEl = document.getElementById(`occ-sec-${routeId}`);
      const barsEl = document.getElementById(`bars-${routeId}`);
      const pctEl = document.getElementById(`pct-${routeId}`);
      
      const targetStop = stops[targetIndex];
      const upstreamStop = targetIndex > 0 ? stops[targetIndex - 1] : null;

      const [targetEtaRes, upstreamEtaRes] = await Promise.all([
        fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${targetStop.stopId}&language=en`),
        upstreamStop 
          ? fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${upstreamStop.stopId}&language=en`)
          : Promise.resolve(null)
      ]);

      if (!targetEtaRes.estimatedArrivals || targetEtaRes.estimatedArrivals.length === 0) {
        setEmptyState(cardEl, offEl, smartEl, statusEl, tagsEl, occSecEl);
        return;
      }

      const now = Date.now();
      
      // FIX 1: Strictly track index 0 (immediate arriving bus) to prevent jumping to Bus #2
      const activeBus = targetEtaRes.estimatedArrivals[0];
      const serverTime = new Date(activeBus.generateTime.replace(/-/g, '/'));
      const arrivalTime = new Date(activeBus.estimatedArrivalTime.replace(/-/g, '/'));
      const busArrivalTimeId = activeBus.estimatedArrivalTime;
      
      let elapsedSinceGenerate = now - serverTime.getTime();
      if (elapsedSinceGenerate < 0 || elapsedSinceGenerate > 120000) {
        elapsedSinceGenerate = 0; 
      }

      const remainingMs = (arrivalTime.getTime() - serverTime.getTime()) - elapsedSinceGenerate;
      const rawEtaMins = Math.max(0, Math.floor(remainingMs / 60000));
      
      let smartMins = rawEtaMins;
      let reasonTags = [];
      const destNameLower = destName.toLowerCase();

      // Mui Wo specific delay observation (Sewage Plant Traffic Signal / Dwell)
      if (destNameLower.includes('mui wo') && rawEtaMins <= 3 && rawEtaMins > 0) {
         smartMins = Math.max(smartMins, rawEtaMins + 1);
         reasonTags.push(`<span class="tag orange">Traffic Signal</span>`);
      }

      // Occupancy Gauge
      const { pct, activeBars } = calculateOccupancy(destName, targetEtaRes.estimatedArrivals);
      
      let colorClass = 'active-green';
      if (pct > 75) colorClass = 'active-red';
      else if (pct > 45) colorClass = 'active-orange';

      let barHtml = '';
      for (let i = 1; i <= 10; i++) {
        barHtml += `<div class="segment ${i <= activeBars ? colorClass : ''}"></div>`;
      }
      barsEl.innerHTML = barHtml;
      pctEl.innerText = `${pct}%`;
      pctEl.style.color = pct > 75 ? 'var(--accent-red)' : (pct > 45 ? 'var(--accent-orange)' : 'var(--accent-green)');
      occSecEl.style.display = 'flex';

      const busKey = routeId;
      const prevState = busStateMap[busKey];
      const isSameBus = prevState && prevState.busArrivalTimeId === busArrivalTimeId;

      // Processing & Anti-Jump Logic
      if (rawEtaMins > 0) {
        if (upstreamStop && upstreamEtaRes && upstreamEtaRes.estimatedArrivals && upstreamEtaRes.estimatedArrivals.length > 0) {
          const upBus = upstreamEtaRes.estimatedArrivals[0];
          const upArrTime = new Date(upBus.estimatedArrivalTime.replace(/-/g, '/'));
          const upServerTime = new Date(upBus.generateTime.replace(/-/g, '/'));
          const upstreamEtaMins = Math.max(0, Math.floor((upArrTime - upServerTime) / 60000));

          const distanceKm = calculateDistanceKm(
            parseFloat(upstreamStop.latitude), parseFloat(upstreamStop.longitude),
            parseFloat(targetStop.latitude), parseFloat(targetStop.longitude)
          );
          const minTransitMins = Math.max(1.0, (distanceKm / 35.0) * 60);

          if (rawEtaMins < upstreamEtaMins + Math.floor(minTransitMins)) {
            smartMins = Math.ceil(upstreamEtaMins + minTransitMins);
            reasonTags.push(`<span class="tag blue">Upstream Buffer</span>`);
          }
        }

        if (isSameBus) {
          const elapsedMins = (now - prevState.timestamp) / 60000;
          const expectedSmart = prevState.smartMins - elapsedMins;
          
          if (smartMins < expectedSmart - 1 && !reasonTags.join('').includes('Traffic Signal')) { 
            smartMins = Math.ceil(expectedSmart - 0.5);
            reasonTags.push(`<span class="tag purple">Signal Smoothed</span>`);
          }

          const rawDecay = prevState.rawEtaMins - rawEtaMins;
          const decayRate = elapsedMins > 0 ? (rawDecay / elapsedMins) : 1;
          
          if (decayRate < 0.2 && rawEtaMins > 2) {
            smartMins = Math.max(smartMins, Math.min(rawEtaMins + 2, prevState.smartMins));
            if (!reasonTags.join('').includes('Smoothed') && !reasonTags.join('').includes('Traffic Signal')) {
              reasonTags.push(`<span class="tag yellow">Traffic Delay</span>`);
            }
          }
        } else if (prevState && prevState.smartMins <= 1 && rawEtaMins > 5) {
          // FIX 2: Grace period when active bus departs and API switches to next bus (e.g., 13 mins away)
          // Holds "Due" for 25s while bus is physically passing the stop
          const timeSincePreviousDue = (now - prevState.timestamp) / 1000;
          if (timeSincePreviousDue < 25) {
            smartMins = 0;
            reasonTags.push(`<span class="tag green">At Stop</span>`);
          }
        }

        busStateMap[busKey] = { timestamp: now, rawEtaMins, smartMins, busArrivalTimeId };
      } else {
        smartMins = 0;
        busStateMap[busKey] = { timestamp: now, rawEtaMins: 0, smartMins: 0, busArrivalTimeId };
      }

      // DOM Updates
      cardEl.dataset.smartMins = smartMins;
      offEl.innerText = rawEtaMins === 0 ? 'Due' : `${rawEtaMins}m`;

      if (smartMins === 0) {
        smartEl.innerText = 'Due';
        smartEl.className = 'smart-eta';
      } else {
        smartEl.innerText = `${smartMins} min`;
        smartEl.className = smartMins > rawEtaMins ? 'smart-eta adjusted' : 'smart-eta';
      }

      // FIX 3: Removed redundant "Live GPS" tag per request
      tagsEl.innerHTML = reasonTags.join(' ');
      
      const localTimeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      const serverTimeString = serverTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      statusEl.innerText = `Sync: ${localTimeString} | API: ${serverTimeString}`;

    } catch (err) {
      const statusEl = document.getElementById(`status-${routeId}`);
      if (statusEl) statusEl.innerText = 'Telemetry sync failed';
      const cardEl = document.getElementById(`route-${routeId}`);
      if (cardEl) cardEl.dataset.smartMins = 9999;
    }
  }
  
  function setEmptyState(cardEl, offEl, smartEl, statusEl, tagsEl, occSecEl) {
    if(cardEl) cardEl.dataset.smartMins = 9999;
    if(offEl) offEl.innerText = '--';
    if(smartEl) smartEl.innerText = '--';
    if(statusEl) statusEl.innerText = 'No upcoming departures';
    if(tagsEl) tagsEl.innerHTML = '';
    if(occSecEl) occSecEl.style.display = 'none';
  }

  function sortCards() {
    const listEl = document.getElementById('routeList');
    const cards = Array.from(listEl.querySelectorAll('.route-card'));
    cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
    cards.forEach(card => listEl.appendChild(card));
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        document.getElementById('refreshTimer').innerText = 'Syncing...';
        updateNetworkTelemetry();
      } else {
        document.getElementById('refreshTimer').innerText = `Syncing in ${countdown}s`;
      }
    }, 1000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimer').innerText = 'Syncing...';
      updateNetworkTelemetry();
      startTimer();
    } else {
      clearInterval(timerInterval);
    }
  });

  updateNetworkTelemetry();
  startTimer();
</script>
</body>
</html>
