<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TransitPulse HK - Smart Engine</title>
<style>
  :root {
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-blue: #0a84ff;
    --accent-orange: #ff9f0a;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background-color: var(--accent-red);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .header-left {
    display: flex;
    flex-direction: column;
  }

  .header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  .clock { font-size: 0.75rem; font-weight: 500; opacity: 0.9; margin-top: 2px; font-variant-numeric: tabular-nums; }
  
  .live-badge {
    background: rgba(0,0,0,0.25);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  
  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  .stop-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background-color: var(--bg-color);
    gap: 12px;
    flex-wrap: wrap;
  }

  .controls-container {
    display: flex;
    gap: 10px;
    flex: 1;
    min-width: 260px;
  }

  .gps-btn {
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    width: 48px;
    height: 72px; 
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  
  .gps-btn:active { background: #3a3a3c; }
  .gps-btn.loading { color: var(--accent-blue); animation: pulse 1s infinite; }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .selectors {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  select.stop-input {
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    padding: 8px 32px 8px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    outline: none;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989d" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
    background-repeat: no-repeat;
    background-position: right 8px center;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  
  select.stop-input:focus { border-color: var(--accent-blue); }

  .status-bar {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .refresh-timer { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; }
  .gps-status { font-size: 0.75rem; color: var(--accent-blue); font-weight: 600; margin-top: 4px; text-align: right; }

  #routeList { display: flex; flex-direction: column; min-height: 50vh; }

  .route-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
    background-color: var(--bg-color);
  }

  .route-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; padding-right: 10px; }
  .route-no { font-size: 1.8rem; font-weight: 900; width: 60px; letter-spacing: -0.5px; flex-shrink: 0; }

  .route-info { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .route-dest { font-size: 1.05rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

  .eta-container { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 50px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; }

  .official-eta { font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .smart-eta { font-size: 1.45rem; font-weight: 800; color: var(--accent-green); font-variant-numeric: tabular-nums; }
  .smart-eta.adjusted { color: var(--accent-blue); }

  .compact-occupancy {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .bar-segments { display: flex; gap: 3px; }
  .segment { width: 8px; height: 12px; border-radius: 2px; background-color: #2c2c2e; }
  .segment.active-green { background-color: var(--accent-green); }
  .segment.active-orange { background-color: var(--accent-orange); }
  .segment.active-red { background-color: var(--accent-red); }

  .occupancy-pct-text { font-size: 0.75rem; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>TransitPulse HK</h1>
    <span class="clock" id="liveClock">--:--:--</span>
  </div>
  <div class="live-badge">SMART ETA</div>
</div>

<div class="stop-header">
  <div class="controls-container">
    <button id="gpsBtn" class="gps-btn" onclick="locateNearestStop(false, false)" aria-label="Find nearest stop">📍</button>
    <div class="selectors">
      <select id="routeSelect" class="stop-input" onchange="handleRouteChange(this.value)">
        <option value="ALL">All Lines (Network-Wide)</option>
      </select>
      <select id="stopSelect" class="stop-input" onchange="handleStopChange(this.value)"></select>
    </div>
  </div>
  <div class="status-bar">
    <span class="refresh-timer" id="refreshTimer">Initializing...</span>
    <span class="gps-status" id="gpsStatus"></span>
  </div>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Connecting to NLB Transport Network...</div>
</div>

<script>
  const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
  const REFRESH_INTERVAL = 15; 
  const CACHE_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;
  
  let currentRouteKey = 'ALL';
  let currentStopName = '';
  let countdown = REFRESH_INTERVAL;
  let timerInterval;
  
  let allStops = [];
  let rawRoutes = [];
  let groupedRoutes = []; 
  let routeStopsCache = {};
  const busStateMap = {};

  setInterval(() => {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
  }, 1000);

  async function fetchJSON(endpoint) {
    const response = await fetch(`${API_BASE}${endpoint}`);
    if (!response.ok) throw new Error('API offline');
    return await response.json();
  }

  function generateGroupKey(routeNo, destName) {
    return `${routeNo}___${destName}`.replace(/[^a-zA-Z0-9_-]/g, '_');
  }

  // --- BUS FLEET IDENTIFIER ---
  function getExpectedFleet(routeNo) {
    // Always single due to terrain (Tai O / Ngong Ping) or specific use (Airport)
    const strictSingle = ['1', '2', '11', '21', '34', '36', 'A35', 'N35'];
    
    // Mostly double, but sometimes randomly single (which destroys capacity)
    const mixedRisk = ['3M', '4'];
    
    // High-capacity routes that are reliably double-decker
    const strictDouble = ['37M', '38', '39M', 'B2', 'B2P', 'B4', 'B6'];
    
    if (strictSingle.includes(routeNo)) return { type: "Single-Decker", risk: false };
    if (mixedRisk.includes(routeNo)) return { type: "Usually Double-Decker", risk: true };
    if (strictDouble.includes(routeNo)) return { type: "Double-Decker", risk: false };
    
    return { type: "Unknown Fleet", risk: false };
  }

  // --- INITIALIZATION & MERGING ROUTE VARIANTS ---
  async function initApp() {
    try {
      document.getElementById('loadingText').innerText = "Loading NLB station index...";
      
      const cachedGrouped = localStorage.getItem('nlb_grouped_routes_v2');
      const cachedStops = localStorage.getItem('nlb_stops_v2');
      const cacheTime = localStorage.getItem('nlb_cache_time_v2');
      const now = Date.now();

      if (cachedGrouped && cachedStops && cacheTime && (now - parseInt(cacheTime) < CACHE_EXPIRY_MS)) {
        groupedRoutes = JSON.parse(cachedGrouped);
        routeStopsCache = JSON.parse(cachedStops);
      } else {
        document.getElementById('loadingText').innerText = "Syncing Network Mappings (First time only)...";
        
        const rData = await fetchJSON('/route.php?action=list');
        rawRoutes = rData.routes || [];
        
        const groupedMap = new Map();
        rawRoutes.forEach(r => {
          const rawDest = r.routeName_e ? r.routeName_e.split('>').pop().trim() : '';
          const cleanDest = rawDest.replace(/\s*\([^)]*\)/g, '').trim(); 
          const key = generateGroupKey(r.routeNo, cleanDest);

          if (!groupedMap.has(key)) {
            groupedMap.set(key, {
              key: key,
              routeNo: r.routeNo,
              destName: cleanDest,
              routeIds: [r.routeId]
            });
          } else {
            groupedMap.get(key).routeIds.push(r.routeId);
          }
        });

        groupedRoutes = Array.from(groupedMap.values());

        routeStopsCache = {};
        const chunkSize = 6;
        for (let i = 0; i < rawRoutes.length; i += chunkSize) {
          const chunk = rawRoutes.slice(i, i + chunkSize);
          await Promise.all(chunk.map(async (r) => {
            try {
              const res = await fetchJSON(`/stop.php?action=list&routeId=${r.routeId}`);
              routeStopsCache[r.routeId] = res.stops || [];
            } catch(e) {
              routeStopsCache[r.routeId] = [];
            }
          }));
          document.getElementById('loadingText').innerText = `Building Station Index... (${Math.round((i/rawRoutes.length)*100)}%)`;
        }
        
        try {
          localStorage.setItem('nlb_grouped_routes_v2', JSON.stringify(groupedRoutes));
          localStorage.setItem('nlb_stops_v2', JSON.stringify(routeStopsCache));
          localStorage.setItem('nlb_cache_time_v2', now.toString());
        } catch (e) { console.warn('LocalStorage unavailable'); }
      }
      
      const rSelect = document.getElementById('routeSelect');
      groupedRoutes.forEach(g => {
          rSelect.insertAdjacentHTML('beforeend', `<option value="${g.key}">${g.routeNo} (To ${g.destName})</option>`);
      });

      buildAllStopsList();
      
      const savedStop = localStorage.getItem('selectedNLBStop');
      const savedRoute = localStorage.getItem('selectedNLBRouteKey');
      
      if (savedRoute) {
          currentRouteKey = savedRoute;
          rSelect.value = savedRoute;
      }
      
      if (savedRoute !== 'ALL' && savedRoute != null) {
          const targetGroup = groupedRoutes.find(g => g.key === savedRoute);
          if (targetGroup) {
            const groupStops = getStopsForGroup(targetGroup);
            populateStopDropdown(groupStops);
          } else {
            populateStopDropdown(allStops);
          }
      } else {
          populateStopDropdown(allStops); 
      }
      
      if (savedStop && allStops.some(s => s.stopName_e === savedStop)) {
        currentStopName = savedStop;
        document.getElementById('stopSelect').value = currentStopName;
        startAppLoop();
      } else {
        locateNearestStop(true, false); 
      }
    } catch (err) {
      document.getElementById('loadingText').innerText = "Network Error: Could not connect to HK Gov Transport API.";
    }
  }

  function getStopsForGroup(group) {
    const uniqueMap = new Map();
    group.routeIds.forEach(id => {
      const stops = routeStopsCache[id] || [];
      stops.forEach(s => {
        if (s && s.stopName_e && !uniqueMap.has(s.stopName_e)) {
          uniqueMap.set(s.stopName_e, s);
        }
      });
    });
    return Array.from(uniqueMap.values());
  }

  function buildAllStopsList() {
    const uniqueStops = new Map();
    Object.values(routeStopsCache).flat().forEach(s => {
      if (s && s.stopName_e && !uniqueStops.has(s.stopName_e)) {
        uniqueStops.set(s.stopName_e, s);
      }
    });
    allStops = Array.from(uniqueStops.values()).sort((a, b) => a.stopName_e.localeCompare(b.stopName_e));
  }

  function populateStopDropdown(stopsList) {
    const sSelect = document.getElementById('stopSelect');
    sSelect.innerHTML = '';
    
    if (!stopsList || stopsList.length === 0) return;

    const unique = [];
    const seen = new Set();
    for (const s of stopsList) {
        if (s && s.stopName_e && !seen.has(s.stopName_e)) {
            seen.add(s.stopName_e);
            unique.push(s);
        }
    }
    
    unique.forEach(s => {
        sSelect.insertAdjacentHTML('beforeend', `<option value="${s.stopName_e}">${s.stopName_c} - ${s.stopName_e}</option>`);
    });

    if (sSelect.options.length > 0) {
      if (!currentStopName || !seen.has(currentStopName)) {
        currentStopName = sSelect.options[0].value;
      }
      sSelect.value = currentStopName;
    }
  }

  async function handleRouteChange(val) {
    currentRouteKey = val;
    localStorage.setItem('selectedNLBRouteKey', currentRouteKey);
    
    if (val === 'ALL') {
        populateStopDropdown(allStops);
        locateNearestStop(false, true); 
        return;
    } else {
        const targetGroup = groupedRoutes.find(g => g.key === val);
        if (targetGroup) {
          const groupStops = getStopsForGroup(targetGroup);
          populateStopDropdown(groupStops);
        }
        ensureValidStopAndFetch();
    }
  }

  function handleStopChange(val) {
    if (!val || val.trim() === '') return;
    currentStopName = val.trim();
    localStorage.setItem('selectedNLBStop', currentStopName);
    document.getElementById('gpsStatus').innerText = ''; 
    
    document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Fetching live arrivals...</div>';
    for (let key in busStateMap) delete busStateMap[key];
    
    countdown = REFRESH_INTERVAL;
    updateNetworkTelemetry();
  }

  function ensureValidStopAndFetch() {
    const sSelect = document.getElementById('stopSelect');
    let stopExists = Array.from(sSelect.options).some(opt => opt.value === currentStopName);
    
    if (!stopExists && sSelect.options.length > 0) {
        currentStopName = sSelect.options[0].value;
        localStorage.setItem('selectedNLBStop', currentStopName);
    } 
    
    if (sSelect.options.length > 0) {
        sSelect.value = currentStopName;
    }
    
    document.getElementById('gpsStatus').innerText = '';
    document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Fetching live arrivals...</div>';
    for (let key in busStateMap) delete busStateMap[key];
    
    countdown = REFRESH_INTERVAL;
    updateNetworkTelemetry();
  }

  function calculateDistanceKm(lat1, lon1, lat2, lon2) {
    if (isNaN(lat1) || isNaN(lon1) || isNaN(lat2) || isNaN(lon2)) return Infinity;
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function locateNearestStop(isAutoInit = false, isFromDropdown = false) {
    if (!navigator.geolocation) {
      handleGPSFailure(isAutoInit, isFromDropdown, "GPS Not Supported");
      return;
    }
    
    const btn = document.getElementById('gpsBtn');
    btn.classList.add('loading');
    document.getElementById('gpsStatus').innerText = 'Locating...';

    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      
      let closest = null;
      let minDistance = Infinity;
      
      allStops.forEach(s => {
        const sLat = parseFloat(s.latitude);
        const sLon = parseFloat(s.longitude);
        if (isNaN(sLat) || isNaN(sLon) || sLat === 0 || sLon === 0) return;
        
        const d = calculateDistanceKm(lat, lon, sLat, sLon);
        if (d < minDistance) {
          minDistance = d;
          closest = s;
        }
      });
      
      btn.classList.remove('loading');
      
      if (closest) {
        currentRouteKey = 'ALL';
        document.getElementById('routeSelect').value = 'ALL';
        localStorage.setItem('selectedNLBRouteKey', 'ALL');
        populateStopDropdown(allStops);

        currentStopName = closest.stopName_e;
        document.getElementById('stopSelect').value = currentStopName;
        localStorage.setItem('selectedNLBStop', currentStopName);
        
        const distMeters = Math.round(minDistance * 1000);
        document.getElementById('gpsStatus').innerText = `Nearest: ${distMeters}m away`;
        
        for (let key in busStateMap) delete busStateMap[key];
        
        if (isAutoInit) {
            startAppLoop();
        } else {
            document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Fetching live arrivals...</div>';
            countdown = REFRESH_INTERVAL;
            updateNetworkTelemetry();
        }
      } else {
        handleGPSFailure(isAutoInit, isFromDropdown, "No stops found");
      }
    }, (err) => {
      btn.classList.remove('loading');
      handleGPSFailure(isAutoInit, isFromDropdown, "GPS Denied / Failed");
    }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
  }

  function handleGPSFailure(isAutoInit, isFromDropdown, msg) {
    document.getElementById('gpsStatus').innerText = msg;
    if (isAutoInit) {
        fallbackDefault();
    } else if (isFromDropdown) {
        ensureValidStopAndFetch();
    }
  }

  function fallbackDefault() {
    currentRouteKey = 'ALL';
    document.getElementById('routeSelect').value = 'ALL';
    populateStopDropdown(allStops);
    
    if (allStops.length > 0) {
      const valid = allStops.some(s => s.stopName_e === currentStopName);
      if (!valid || !currentStopName) {
          currentStopName = 'Tung Chung Station Bus Terminus';
      }
      document.getElementById('stopSelect').value = currentStopName;
    }
    startAppLoop();
  }

  function startAppLoop() {
    updateNetworkTelemetry();
    startTimer();
  }

  // --- MERGED TELEMETRY LOGIC ---
  async function updateNetworkTelemetry() {
    if (!currentStopName) return;
    
    try {
      const groupsToCheck = currentRouteKey === 'ALL' 
        ? groupedRoutes 
        : groupedRoutes.filter(g => g.key === currentRouteKey);
        
      const relevantGroups = [];
      const searchLower = currentStopName.toLowerCase();
      
      for (const group of groupsToCheck) {
        const matchDetails = [];
        
        for (const routeId of group.routeIds) {
          const stops = routeStopsCache[routeId] || [];
          const targetIndex = stops.findIndex(s => s.stopName_e && s.stopName_e.toLowerCase() === searchLower);
          
          if (targetIndex !== -1) {
            matchDetails.push({ routeId, stops, targetIndex });
          }
        }
        
        if (matchDetails.length > 0) {
          relevantGroups.push({ group, matchDetails });
        }
      }

      const listEl = document.getElementById('routeList');
      const loadingEl = document.getElementById('loadingText');
      if (loadingEl) loadingEl.remove();

      if (relevantGroups.length === 0) {
        listEl.innerHTML = `<div style="padding: 20px; color: var(--text-secondary); text-align: center;">No active buses depart from here currently.</div>`;
        return;
      }

      for (const item of relevantGroups) {
        const group = item.group;
        const cardId = `route-${group.key}`;

        if (!document.getElementById(cardId)) {
          // Identify fleet type and generate warning if applicable
          const fleetInfo = getExpectedFleet(group.routeNo);
          const capacityWarning = fleetInfo.risk 
            ? `<div style="font-size: 0.65rem; color: var(--accent-orange); margin-top: 4px; font-weight: 600;">⚠️ High crowding risk if Single-Decker</div>` 
            : '';

          listEl.insertAdjacentHTML('beforeend', `
            <div class="route-card" id="${cardId}" data-smart-mins="9999">
              <div class="route-left">
                <div class="route-no">${group.routeNo}</div>
                <div class="route-info">
                  <div class="route-dest">To ${group.destName}</div>
                  <div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px;">
                    ${fleetInfo.type}
                  </div>
                  ${capacityWarning}
                  <div class="compact-occupancy" id="occ-sec-${group.key}" style="display:none;">
                    <div class="bar-segments" id="bars-${group.key}">
                      ${Array(5).fill('<div class="segment"></div>').join('')}
                    </div>
                    <span class="occupancy-pct-text" id="pct-text-${group.key}">--</span>
                  </div>
                </div>
              </div>
              <div class="eta-container">
                <div class="eta-box">
                  <span class="eta-label">Official</span>
                  <span class="official-eta" id="off-${group.key}">--</span>
                </div>
                <div class="eta-box">
                  <span class="eta-label">Actual ETA</span>
                  <span class="smart-eta" id="smart-${group.key}">--</span>
                </div>
              </div>
            </div>
          `);
        }
      }

      const validCardIds = relevantGroups.map(i => `route-${i.group.key}`);
      document.querySelectorAll('.route-card').forEach(c => {
        if (!validCardIds.includes(c.id)) c.remove();
      });

      const promises = relevantGroups.map(item => processMergedSmartETA(item.group, item.matchDetails));
      await Promise.all(promises);

      sortCards();

    } catch (err) {
      console.error('Telemetry failure:', err);
    }
  }

  async function processMergedSmartETA(group, matchDetails) {
    const groupKey = group.key;
    const cardEl = document.getElementById(`route-${groupKey}`);
    
    try {
      const offEl = document.getElementById(`off-${groupKey}`);
      const smartEl = document.getElementById(`smart-${groupKey}`);
      const occSecEl = document.getElementById(`occ-sec-${groupKey}`);
      const barsEl = document.getElementById(`bars-${groupKey}`);
      const pctTextEl = document.getElementById(`pct-text-${groupKey}`);

      let combinedArrivals = [];

      await Promise.all(matchDetails.map(async (m) => {
        const targetStop = m.stops[m.targetIndex];
        const upstreamStop = m.targetIndex > 0 ? m.stops[m.targetIndex - 1] : null;

        const [targetEtaRes, upstreamEtaRes] = await Promise.all([
          fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${m.routeId}&stopId=${targetStop.stopId}&language=en`),
          upstreamStop 
            ? fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${m.routeId}&stopId=${upstreamStop.stopId}&language=en`)
            : Promise.resolve(null)
        ]);

        if (targetEtaRes && targetEtaRes.estimatedArrivals) {
          targetEtaRes.estimatedArrivals.forEach(arr => {
            combinedArrivals.push({
              arrival: arr,
              routeId: m.routeId,
              targetStop,
              upstreamStop,
              upstreamEtaRes,
              targetIndex: m.targetIndex,
              totalStops: m.stops.length
            });
          });
        }
      }));

      if (combinedArrivals.length === 0) {
        setEmptyState(cardEl, offEl, smartEl, occSecEl);
        return;
      }

      combinedArrivals.sort((a, b) => {
        const tA = new Date(a.arrival.estimatedArrivalTime.replace(/-/g, '/')).getTime();
        const tB = new Date(b.arrival.estimatedArrivalTime.replace(/-/g, '/')).getTime();
        return tA - tB;
      });

      const activeItem = combinedArrivals[0];
      const activeBus = activeItem.arrival;
      const now = Date.now();
      const serverTime = new Date(activeBus.generateTime.replace(/-/g, '/'));
      const arrivalTime = new Date(activeBus.estimatedArrivalTime.replace(/-/g, '/'));
      const busArrivalTimeId = activeBus.estimatedArrivalTime;
      
      let elapsedSinceGenerate = now - serverTime.getTime();
      if (elapsedSinceGenerate < 0 || elapsedSinceGenerate > 120000) {
        elapsedSinceGenerate = 0; 
      }

      const remainingMs = (arrivalTime.getTime() - serverTime.getTime()) - elapsedSinceGenerate;
      const rawEtaMins = Math.max(0, Math.floor(remainingMs / 60000));
      
      let smartMins = rawEtaMins;
      const destNameLower = group.destName.toLowerCase();

      if (destNameLower.includes('mui wo') && rawEtaMins <= 3 && rawEtaMins > 0) {
         smartMins = Math.max(smartMins, rawEtaMins + 1);
      }

      const allRawArrivals = combinedArrivals.map(c => c.arrival);
      const { pct, activeBars } = calculateOccupancy(group.destName, allRawArrivals, activeItem.targetIndex, activeItem.totalStops);
      
      let colorClass = pct > 80 ? 'active-red' : (pct > 50 ? 'active-orange' : 'active-green');
      let barHtml = '';
      for (let i = 1; i <= 5; i++) {
          barHtml += `<div class="segment ${i <= activeBars ? colorClass : ''}"></div>`;
      }
      barsEl.innerHTML = barHtml;
      pctTextEl.innerText = getOccupancyText(pct);
      pctTextEl.style.color = pct > 80 ? 'var(--accent-red)' : (pct > 50 ? 'var(--accent-orange)' : 'var(--accent-green)');
      occSecEl.style.display = 'flex';

      const prevState = busStateMap[groupKey];
      const isSameBus = prevState && prevState.busArrivalTimeId === busArrivalTimeId;

      if (rawEtaMins > 0) {
        if (activeItem.upstreamStop && activeItem.upstreamEtaRes && activeItem.upstreamEtaRes.estimatedArrivals && activeItem.upstreamEtaRes.estimatedArrivals.length > 0) {
          const upBus = activeItem.upstreamEtaRes.estimatedArrivals[0];
          const upArrTime = new Date(upBus.estimatedArrivalTime.replace(/-/g, '/'));
          const upServerTime = new Date(upBus.generateTime.replace(/-/g, '/'));
          const upstreamEtaMins = Math.max(0, Math.floor((upArrTime - upServerTime) / 60000));

          const distanceKm = calculateDistanceKm(
            parseFloat(activeItem.upstreamStop.latitude), parseFloat(activeItem.upstreamStop.longitude),
            parseFloat(activeItem.targetStop.latitude), parseFloat(activeItem.targetStop.longitude)
          );
          const minTransitMins = Math.max(1.0, (distanceKm / 35.0) * 60);

          if (rawEtaMins < upstreamEtaMins + Math.floor(minTransitMins)) {
            smartMins = Math.ceil(upstreamEtaMins + minTransitMins);
          }
        }

        if (isSameBus) {
          const elapsedMins = (now - prevState.timestamp) / 60000;
          const expectedSmart = prevState.smartMins - elapsedMins;
          
          if (smartMins < expectedSmart - 1) { 
            smartMins = Math.ceil(expectedSmart - 0.5);
          }

          const rawDecay = prevState.rawEtaMins - rawEtaMins;
          const decayRate = elapsedMins > 0 ? (rawDecay / elapsedMins) : 1;
          
          if (decayRate < 0.2 && rawEtaMins > 2) {
            smartMins = Math.max(smartMins, Math.min(rawEtaMins + 2, prevState.smartMins));
          }
        } else if (prevState && prevState.smartMins <= 1 && rawEtaMins > 5) {
          const timeSincePreviousDue = (now - prevState.timestamp) / 1000;
          if (timeSincePreviousDue < 25) {
            smartMins = 0;
          }
        }

        if (rawEtaMins <= 2) {
          smartMins = rawEtaMins;
        } else if (Math.abs(smartMins - rawEtaMins) > 10) {
          smartMins = rawEtaMins;
        }

        busStateMap[groupKey] = { timestamp: now, rawEtaMins, smartMins, busArrivalTimeId };
      } else {
        smartMins = 0;
        busStateMap[groupKey] = { timestamp: now, rawEtaMins: 0, smartMins: 0, busArrivalTimeId };
      }

      cardEl.dataset.smartMins = smartMins;
      offEl.innerText = rawEtaMins === 0 ? 'Due' : `${rawEtaMins}m`;

      if (smartMins === 0) {
        smartEl.innerText = 'Due';
        smartEl.className = 'smart-eta';
      } else {
        smartEl.innerText = `${smartMins} min`;
        smartEl.className = smartMins > rawEtaMins ? 'smart-eta adjusted' : 'smart-eta';
      }

    } catch (err) {
      if (cardEl) cardEl.dataset.smartMins = 9999;
    }
  }
  
  function getOccupancyText(pct) {
      if (pct < 35) return "Plenty of Seats";
      if (pct < 65) return "Seats Available";
      if (pct < 85) return "Standing Room Only";
      return "Very Crowded";
  }

  function calculateOccupancy(destName, estimatedArrivals, currentStopIndex, totalStops) {
    const now = new Date();
    const hour = now.getHours();
    const dest = destName.toLowerCase();

    let baseLoad = 40; 
    if (hour >= 7 && hour <= 9) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo')) ? 80 : 45;
    } else if (hour >= 17 && hour <= 19) {
      baseLoad = (!dest.includes('tung chung')) ? 75 : 50;
    } else if (hour >= 11 && hour <= 14) {
      baseLoad = 35;
    }

    const routeProgress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
    let spatialMultiplier = 1 - Math.pow(routeProgress, 2.5);
    
    if (routeProgress < 0.05 && estimatedArrivals && estimatedArrivals.length > 0) {
      const minToDeparture = Math.floor((new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - now) / 60000);
      if (minToDeparture > 5) spatialMultiplier *= 0.5;
    }

    let headwayMultiplier = 1.0;
    if (estimatedArrivals && estimatedArrivals.length >= 2) {
      const serverTime = new Date(estimatedArrivals[0].generateTime.replace(/-/g, '/'));
      const t1 = Math.max(0, (new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000);
      const t2 = Math.max(0, (new Date(estimatedArrivals[1].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000);
      const gap = t2 - t1;

      if (gap <= 8) {
        headwayMultiplier = 1.8;
      } else {
        const lambda = 0.08; 
        headwayMultiplier = 0.5 + (2.0 * (1 - Math.exp(-lambda * gap)));
      }
    }

    let calculatedLoad = baseLoad * spatialMultiplier * headwayMultiplier;
    const noise = (Math.random() * 6) - 3;
    
    const pct = Math.min(98, Math.max(5, Math.round(calculatedLoad + noise)));
    const activeBars = Math.min(5, Math.max(1, Math.ceil(pct / 20)));

    return { pct, activeBars };
  }

  function setEmptyState(cardEl, offEl, smartEl, occSecEl) {
    if(cardEl) cardEl.dataset.smartMins = 9999;
    if(offEl) offEl.innerText = '--';
    if(smartEl) smartEl.innerText = '--';
    if(occSecEl) occSecEl.style.display = 'none';
  }

  function sortCards() {
    const listEl = document.getElementById('routeList');
    const cards = Array.from(listEl.querySelectorAll('.route-card'));
    cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
    cards.forEach(card => listEl.appendChild(card));
  }

  function startTimer() {
    clearInterval(timerInterval);
    countdown = REFRESH_INTERVAL;
    document.getElementById('refreshTimer').innerText = `Refresh in ${countdown}s`;
    
    timerInterval = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        document.getElementById('refreshTimer').innerText = 'Refreshing...';
        updateNetworkTelemetry();
      } else {
        document.getElementById('refreshTimer').innerText = `Refresh in ${countdown}s`;
      }
    }, 1000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimer').innerText = 'Refreshing...';
      updateNetworkTelemetry();
      startTimer();
    } else {
      clearInterval(timerInterval);
    }
  });

  // Startup
  initApp();
</script>
