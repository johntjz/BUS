<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse HK</title>
    <!-- 1. Load Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div class="header-left">
            <div class="title-row">
                <h1>Pulse HK</h1>
                <span class="build-badge" id="buildVersion">v2.0-Modular</span>
            </div>
            <span class="clock" id="liveClock">--:--:--</span>
        </div>
        <select id="langSelect" class="lang-select">
            <option value="en">EN</option>
            <option value="tc">繁體</option>
            <option value="sc">简体</option>
        </select>
    </div>

    <!-- Controls Section -->
    <div class="stop-header">
        <div class="controls-container">
            <button id="gpsBtn" class="gps-btn">📍</button>
            <div class="selectors">
                <!-- Added Franchise Filter -->
                <select id="companySelect" class="stop-input">
                    <option value="ALL">All Franchises</option>
                    <option value="NLB">NLB (New Lantao Bus)</option>
                    <option value="KMB">KMB (Kowloon Motor Bus)</option>
                    <option value="LWB">LWB (Long Win Bus)</option>
                </select>
                <select id="routeSelect" class="stop-input"></select>
                <select id="stopSelect" class="stop-input"></select>
            </div>
        </div>
        <div class="status-bar">
            <span class="refresh-timer" id="refreshTimer">Initializing...</span>
            <span class="gps-status" id="gpsStatus"></span>
        </div>
    </div>

    <!-- ETA List Container -->
    <div id="routeList">
        <div style="padding: 20px; color: var(--text-secondary); text-align: center;" id="loadingText">
            Loading route metadata...
        </div>
    </div>

    <!-- ============================================== -->
    <!-- 2. LOAD ROUTE METADATA (MANUALLY UPDATED DATA) -->
    <!-- ============================================== -->
    
    <!-- Initialize the global BusData object first -->
    <script>window.BusData = { NLB: [], LWB: [], KMB: [] };</script>
    
    <!-- NLB Data (2 files) -->
    <script src="data/routes/nlb/nlb_south.js"></script>
    <script src="data/routes/nlb/nlb_north.js"></script>
    
    <!-- LWB Data (3 files) -->
    <script src="data/routes/lwb/lwb_a_na.js"></script>
    <script src="data/routes/lwb/lwb_e.js"></script>
    <script src="data/routes/lwb/lwb_s_r.js"></script>
    
    <!-- KMB Data (5 files) -->
    <script src="data/routes/kmb/kmb_1_29.js"></script>
    <script src="data/routes/kmb/kmb_30_69.js"></script>
    <script src="data/routes/kmb/kmb_70_99.js"></script>
    <script src="data/routes/kmb/kmb_100_999.js"></script>
    <script src="data/routes/kmb/kmb_special.js"></script>

    <!-- ============================================== -->
    <!-- 3. LOAD CORE APPLICATION LOGIC                 -->
    <!-- ============================================== -->
    <script src="js/app.js"></script>

</body>
</html>
