<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Bus HK - Dark Mode</title>

<!-- Local Leaflet CSS for Map -->
<link rel="stylesheet" href="leaflet.css">

<style>
  /* ==========================================
     CSS ZONE 1: VARIABLES & RESET
     ========================================== */
  :root {
    --kmb-red: #e31837;
    --bg-light: #121212;
    --bg-white: #1c1c1e;
    --text-main: #ffffff;
    --text-sub: #98989d;
    --border-color: #2c2c2e;
    --accent-blue: #0a84ff;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  /* 3-Tier Text Scaling */
  html { font-size: 16px; transition: font-size 0.2s ease-in-out; }
  html.text-sm { font-size: 14px; } 
  html.text-xs { font-size: 12px; } 

  body {
    background-color: var(--bg-light);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color-scheme: dark;
  }

  /* ==========================================
     CSS ZONE 2: LAYOUT & VIEWS
     ========================================== */
  .header {
    background-color: var(--kmb-red); color: white; padding: 0 12px;
    display: flex; justify-content: center; align-items: center; position: relative;
    z-index: 1001; height: 55px; flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.15rem; font-weight: 700; margin: 0; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-left: 50px; padding-right: 50px; width: 100%; box-sizing: border-box;
  }
  .back-btn {
    position: absolute; left: 4px; top: 0; bottom: 0; width: 44px; display: none;
    align-items: center; justify-content: center; background: none; border: none;
    color: white; font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 0; z-index: 2; line-height: 1;
  }
  .text-size-btn {
    position: absolute; right: 4px; top: 0; bottom: 0; width: 44px; display: flex;
    align-items: center; justify-content: center; background: none; border: none;
    color: white; font-size: 1.05rem; font-weight: 800; cursor: pointer; padding: 0; z-index: 2;
  }
  .view-container {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    display: none; flex-direction: column; background: var(--bg-light);
  }
  .view-container.active { display: flex; }

  /* ==========================================
     CSS ZONE 3: COMPONENTS (Tabs, Lists, ETAs)
     ========================================== */
  .bottom-tabs {
    background-color: var(--bg-white); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; align-items: center;
    height: 65px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 1001;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-sub); flex: 1; height: 100%; cursor: pointer; font-size: 0.75rem; gap: 4px; transition: color 0.2s;
  }
  .tab.active { color: var(--kmb-red); font-weight: 700; }
  .tab-icon { font-size: 1.5rem; margin-bottom: 2px; }

  .location-header {
    background: var(--bg-white); padding: 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .refresh-timer { font-size: 1.05rem; color: var(--kmb-red); font-weight: 800; font-variant-numeric: tabular-nums; }

  .detail-live-bar {
    background: var(--bg-white); padding: 8px 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;
    color: var(--text-sub); font-weight: 700; flex-shrink: 0;
  }
  .live-dot-pulse {
    color: var(--accent-green); display: inline-flex; align-items: center; gap: 6px; font-weight: 800;
  }

  .route-list-item {
    display: flex; padding: 18px 16px; border-bottom: 1px solid var(--border-color);
    align-items: center; gap: 16px; cursor: pointer; background: var(--bg-light); transition: background 0.2s;
  }
  .route-list-item.inactive-route { opacity: 0.85; }
  .route-list-item:active { background: var(--bg-white); }
  
  .route-no-col {
    min-width: 95px; max-width: 105px; flex-shrink: 0; font-size: 1.85rem; font-weight: 900;
    text-align: left; color: var(--text-main); letter-spacing: -0.5px; line-height: 1.1; word-break: break-word;
  }
  .route-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .route-dest { font-size: 1.2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
  .route-sub { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .route-eta-col { text-align: right; min-width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
  .eta-time { font-size: 2.3rem; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; line-height: 1; }
  
  .eta-expanded-container { display: none; flex-direction: column; gap: 0; background: #181818; border-bottom: 1px solid var(--border-color); }
  .eta-expanded-container.active { display: flex; }
  .eta-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px dashed var(--border-color); }
  .eta-row:last-child { border-bottom: none; }
  .eta-row-left { display: flex; align-items: center; gap: 16px; font-size: 1rem; color: var(--text-sub); flex: 1; }
  .eta-row-seq { display: inline-block; min-width: 50px; font-weight: 900; color: var(--text-main); font-size: 1.35rem; line-height: 1; letter-spacing: -0.5px; flex-shrink:0; }
  .eta-row-time { font-size: 2.2rem; font-weight: 900; font-variant-numeric: tabular-nums; flex-shrink:0; }

  /* ==========================================
     CSS ZONE 4: SEARCH, MAPS & UTILS
     ========================================== */
  .search-box-container { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 10;}
  .search-input {
    width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px;
    font-size: 1.3rem; outline: none; text-align: center; background: var(--bg-light); color: var(--text-main); font-weight: 700;
  }
  .search-input:focus { border-color: var(--kmb-red); }
  .region-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
  .region-filters::-webkit-scrollbar { display: none; }
  .region-btn { flex: 0 0 auto; padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-sub); font-size: 1rem; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  .region-btn.active { background: var(--kmb-red); color: white; border-color: var(--kmb-red); }

  #map-container { 
      height: 35vh; width: 100%; background: #111; flex-shrink: 0; 
      border-bottom: 1px solid var(--border-color); 
      transition: height 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); 
  }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-light); }
  
  .stop-item { position: relative; padding: 24px 16px 24px 50px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
  .stop-line { position: absolute; left: 28px; top: 0; bottom: 0; width: 3px; background-color: var(--kmb-red); z-index: 1; }
  .stop-item:first-child .stop-line { top: 34px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 34px; }
  .stop-dot { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: #aaa; border: 3px solid var(--bg-light); z-index: 2; }
  .stop-item.active-stop .stop-dot { background: var(--kmb-red); box-shadow: 0 0 0 4px rgba(227,24,55,0.3); }
  .stop-name { font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
  .nearest-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; background: rgba(10,132,255,0.2); color: var(--accent-blue); border: 1px solid rgba(10,132,255,0.4); vertical-align: middle; text-transform: uppercase; }
  
  #global-map-container { flex: 1; width: 100%; background: #111; z-index: 1; }
  .map-bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-white); border-top-left-radius: 20px; border-top-right-radius: 20px; max-height: 70vh; overflow-y: auto; z-index: 1000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); box-shadow: 0 -4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
  .map-bottom-sheet.active { transform: translateY(0); }
  .sheet-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-white); z-index: 2; }
  .sheet-title { font-size: 1.25rem; font-weight: 800; }
  .sheet-close { font-size: 1.5rem; font-weight: bold; color: var(--text-sub); cursor: pointer; background: none; border: none; }
  
  .text-center { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 1.15rem; }
  .init-loader { padding: 80px 20px; text-align: center; }
  .progress-bar { width: 85%; height: 8px; background: #333; margin: 24px auto; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--kmb-red); width: 0%; transition: 0.3s; }
  
  .occ-pill { padding: 6px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 800; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 95px; text-transform: uppercase; letter-spacing: 0.5px; }
  .occ-seating { background: rgba(48, 209, 88, 0.2); color: var(--accent-green); border: 1px solid rgba(48, 209, 88, 0.4); }
  .occ-standing { background: rgba(255, 159, 10, 0.2); color: var(--accent-orange); border: 1px solid rgba(255, 159, 10, 0.4); }
  .occ-crowded { background: rgba(255, 69, 58, 0.2); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.4); }
  .occ-full { background: rgba(227, 24, 55, 0.2); color: var(--kmb-red); border: 1px solid rgba(227, 24, 55, 0.4); }

  .add-fav-btn { margin: 24px; padding: 20px; background: var(--bg-white); border: 2px dashed var(--border-color); border-radius: 16px; text-align: center; color: var(--accent-blue); font-size: 1.25rem; font-weight: 800; cursor: pointer; transition: background 0.2s; }
  .add-fav-btn:active { background: #2c2c2e; }
  .del-fav-btn { background: rgba(227, 24, 55, 0.15); border: 1px solid rgba(227, 24, 55, 0.3); color: var(--kmb-red); border-radius: 8px; padding: 14px 18px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .fav-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: flex-end; }
  .fav-modal-content { background: var(--bg-light); width: 100%; height: 90vh; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
  .fav-modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-header h3 { font-size: 1.25rem; font-weight: 800; margin: 0; color: var(--text-main); }
  .fav-modal-close { background: none; border: none; color: var(--text-sub); font-size: 1.8rem; font-weight: bold; cursor: pointer; }
  .fav-modal-search { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-search input { width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1.2rem; background: var(--bg-light); color: var(--text-main); font-weight: 700; text-align: center; }
  .fav-modal-search input:focus { border-color: var(--accent-blue); outline: none; }
  .fav-modal-results { flex: 1; overflow-y: auto; background: var(--bg-light); }

  .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  .custom-user-icon div { width: 100% !important; height: 100% !important; background: #0a84ff !important; border-radius: 50% !important; border: 3px solid white !important; box-shadow: 0 0 12px rgba(0,0,0,0.8) !important; }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Bus HK</h1>
  <button class="text-size-btn" onclick="toggleTextSize()">aA</button>
</header>

<!-- Nearby View -->
<main id="view-main" class="view-container active">
  <div class="location-header">
    <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size: 1.6rem; color: var(--kmb-red);">📍</span>
        <div class="location-text" id="mainLocationText">Locating nearest stop...</div>
    </div>
    <div class="refresh-timer" id="refreshTimerMain">--</div>
  </div>
  <div id="mainRouteList">
      <div class="init-loader">
          <div id="loadText" style="font-size:1.2rem; color:var(--text-main); font-weight: 700;">Connecting to network...</div>
          <div class="progress-bar"><div class="progress-fill" id="loadBar"></div></div>
      </div>
  </div>
</main>

<!-- Route (Search) View -->
<main id="view-search" class="view-container">
  <div class="search-box-container">
   <div class="region-filters">
        <button class="region-btn active" id="filter-ALL" onclick="setRegionFilter('ALL')">All</button>
        <button class="region-btn" id="filter-KMB" onclick="setRegionFilter('KMB')">KMB</button>
        <button class="region-btn" id="filter-LWB" onclick="setRegionFilter('LWB')">LWB</button>
        <button class="region-btn" id="filter-CTB" onclick="setRegionFilter('CTB')">CTB</button>
        <button class="region-btn" id="filter-NLB" onclick="setRegionFilter('NLB')">NLB</button>
        <button class="region-btn" id="filter-GMB" onclick="setRegionFilter('GMB')">GMB</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Enter Route Number" oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Map View -->
<main id="view-map" class="view-container">
    <div id="global-map-container"></div>
    <div id="map-bottom-sheet" class="map-bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-title" id="sheet-title">Stop Name</div>
            <button class="sheet-close" onclick="closeMapSheet()">✕</button>
        </div>
        <div id="sheet-route-list"></div>
    </div>
</main>

<!-- Favorites View -->
<main id="view-fav" class="view-container">
  <div class="location-header" style="justify-content:center;">
      <div class="location-text">Favorite Routes</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Route Detail View -->
<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div class="detail-live-bar" id="detailLiveBar">
    <span class="live-dot-pulse">● LIVE</span>
    <span id="detailLastUpdated">Loading live times...</span>
  </div>
  <div id="stop-list-container"></div>
</main>

<!-- Bottom Tabs -->
<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main"><span class="tab-icon">📍</span><span>Nearby</span></div>
  <div class="tab" onclick="switchTab('search')" id="tab-search"><span class="tab-icon">🚌</span><span>Route</span></div>
  <div class="tab" onclick="switchTab('map')" id="tab-map"><span class="tab-icon">🗺️</span><span>Map</span></div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav"><span class="tab-icon">⭐</span><span>Favorites</span></div>
</nav>

<!-- Favorite Add Modal -->
<div id="fav-modal" class="fav-modal-overlay">
    <div class="fav-modal-content">
        <div class="fav-modal-header">
            <h3>Add New Favorite</h3>
            <button class="fav-modal-close" onclick="closeFavModal()">✕</button>
        </div>
        <div class="fav-modal-search">
            <input type="text" id="favSearchInput" placeholder="Search route number..." oninput="renderFavSearch()" autocomplete="off">
        </div>
        <div id="favSearchResults" class="fav-modal-results"></div>
    </div>
</div>

<script src="leaflet.js"></script>

<script>
// ==========================================
// ZONE 1: CONFIGURATION & GLOBAL STATE
// ==========================================
const NLB_API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
const KMB_API_BASE = 'https://data.etabus.gov.hk/v1/transport/kmb';
const REFRESH_INTERVAL = 15; 

let currentView = 'main';
let previousView = 'main';
let allStops = [];
let groupedRoutes = []; 
let routeStopsCache = {};
let favRoutes = JSON.parse(localStorage.getItem('kmb_fav_routes_v7') || '[]');

let lastKnownPos = null;
let currentNearestStopKey = null;
let activeRegionFilter = 'ALL';
let mainExpandedGroupKey = null;
let sheetExpandedGroupKey = null;

// Map & Detail State
let detailRouteGroup = null;
let detailExpandedStopIdx = -1;
let detailOpenToken = 0;
let mapInstance = null; 
let globalMapInstance = null; 
let mapRouteLayer = null;
let mapMarkers = [];
let globalMarkers = [];
let userMarkerDetail = null;
let userMarkerGlobal = null;

// Timers & Trackers
let countdown = REFRESH_INTERVAL;
let timerInterval = null;
let isSyncing = false;
let gpsWatcherId = null;

// Initialize Text Size (0: Normal, 1: Small, 2: Extra Small)
let textSizeState = parseInt(localStorage.getItem('bus_hk_text_size_state') || '0');
if (textSizeState === 1) document.documentElement.classList.add('text-sm');
if (textSizeState === 2) document.documentElement.classList.add('text-xs');

// ==========================================
// ZONE 2: PURE ALGORITHMS & UTILITIES
// ==========================================
function getGlobalStopKey(s) {
    const lat = parseFloat(s.latitude) || 0;
    return `${s.stopName_e}_${lat.toFixed(1)}`;
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*[\(（][^\)）]*[\)）]/g, '').trim();
}

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  if (lat1 === 0 || lat2 === 0) return Infinity;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestStopIdx(stops, pos) {
    let best = -1, bestD = Infinity;
    stops.forEach((s, i) => {
        const la = parseFloat(s.latitude), lo = parseFloat(s.longitude);
        if (!la || !lo) return;
        const d = calculateDistanceKm(pos.lat, pos.lon, la, lo);
        if (d < bestD) { bestD = d; best = i; }
    });
    return best;
}

function sortGroupsWithEtas(list) {
    list.sort((a, b) => {
        if (a.firstEtaMins !== Infinity && b.firstEtaMins !== Infinity) {
            return a.firstEtaMins - b.firstEtaMins;
        } else if (a.firstEtaMins === Infinity && b.firstEtaMins === Infinity) {
            const numA = parseInt(a.group.routeNo.replace(/[^0-9]/g, '')) || 999;
            const numB = parseInt(b.group.routeNo.replace(/[^0-9]/g, '')) || 999;
            if (numA === numB) return a.group.routeNo.localeCompare(b.group.routeNo);
            return numA - numB;
        } else {
            return a.firstEtaMins === Infinity ? 1 : -1;
        }
    });
    return list;
}

const HK_PUBLIC_HOLIDAYS = ["01-01", "02-17", "02-18", "02-19", "04-03", "04-04", "04-06", "04-07", "05-01", "05-24", "06-19", "07-01", "10-01", "10-07", "10-29", "12-25", "12-26"];

function isPublicHoliday(date) {
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return HK_PUBLIC_HOLIDAYS.includes(`${mm}-${dd}`);
}

function calculateOccupancy(routeNo, destName, currentStopIndex, totalStops, currentTimestamp) {
    const date = new Date(currentTimestamp);
    const hour = date.getHours();
    const day = date.getDay(); 
    const isWeekend = (day === 0 || day === 6);
    const isPH = isPublicHoliday(date);
    const isHolidayOrSunday = (day === 0 || isPH);
    const isSaturday = (day === 6 && !isPH);

    let progress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
    if (currentStopIndex === totalStops - 1 && totalStops > 1) return 0;

    const rNo = String(routeNo).toUpperCase();
    const destUpper = String(destName).toUpperCase();

    if (['E36', '3M', '1', '2'].includes(rNo)) {
        let dayType = 'weekday';
        if (isHolidayOrSunday) dayType = 'holiday';
        else if (isSaturday) dayType = 'saturday';

        let timeOfDay = 'midday';
        if (hour >= 6 && hour < 10) timeOfDay = 'am_peak';
        else if (hour >= 16 && hour < 20) timeOfDay = 'pm_peak';
        else if (hour >= 20 || hour < 6) timeOfDay = 'night';

        let baseLoad = 35;
        let spatialCurve = 1.0;

        if (rNo === 'E36') {
            const isToAirport = destUpper.includes('AIRPORT') || destUpper.includes('TUNG CHUNG');
            if (isToAirport) {
                if (dayType === 'weekday') {
                    if (timeOfDay === 'am_peak') baseLoad = 95;
                    else if (timeOfDay === 'pm_peak') baseLoad = 45;
                    else if (timeOfDay === 'midday') baseLoad = 35;
                    else baseLoad = 20;
                } else {
                    if (timeOfDay === 'am_peak') baseLoad = 80;
                    else if (timeOfDay === 'pm_peak') baseLoad = 50;
                    else if (timeOfDay === 'midday') baseLoad = 65;
                    else baseLoad = 25;
                }
            } else { 
                if (dayType === 'weekday') {
                    if (timeOfDay === 'am_peak') baseLoad = 40;
                    else if (timeOfDay === 'pm_peak') baseLoad = 95;
                    else if (timeOfDay === 'midday') baseLoad = 35;
                    else baseLoad = 50;
                } else {
                    if (timeOfDay === 'am_peak') baseLoad = 35;
                    else if (timeOfDay === 'pm_peak') baseLoad = 85;
                    else if (timeOfDay === 'midday') baseLoad = 60;
                    else baseLoad = 40;
                }
            }
            if (progress < 0.2) spatialCurve = progress / 0.2;
            else if (progress > 0.8) spatialCurve = (1 - progress) / 0.2;
            else spatialCurve = 1.0;

        } else if (rNo === '3M') {
            const isToMuiWo = destUpper.includes('MUI WO');
            if (isToMuiWo) {
                if (dayType === 'holiday' || dayType === 'saturday') {
                    if (timeOfDay === 'am_peak') baseLoad = 98;
                    else if (timeOfDay === 'midday') baseLoad = 85;
                    else baseLoad = 40;
                } else {
                    if (timeOfDay === 'am_peak') baseLoad = 70;
                    else if (timeOfDay === 'pm_peak') baseLoad = 60;
                    else baseLoad = 40;
                }
                spatialCurve = 1.0 - Math.pow(progress, 3);
            } else { 
                if (dayType === 'holiday' || dayType === 'saturday') {
                    if (timeOfDay === 'am_peak') baseLoad = 92; 
                    else if (timeOfDay === 'pm_peak') baseLoad = 98;
                    else if (timeOfDay === 'midday') baseLoad = 75;
                    else baseLoad = 40;
                } else {
                    if (timeOfDay === 'am_peak') baseLoad = 88;
                    else if (timeOfDay === 'pm_peak') baseLoad = 60;
                    else baseLoad = 40;
                }
                spatialCurve = Math.min(1.0, 0.45 + (Math.sqrt(progress) * 0.55));
            }

        } else if (rNo === '1') {
            const isToTaiO = destUpper.includes('TAI O');
            if (isToTaiO) {
                if (dayType === 'holiday' || dayType === 'saturday') {
                    if (timeOfDay === 'am_peak') baseLoad = 92;
                    else if (timeOfDay === 'midday') baseLoad = 95;
                    else baseLoad = 40;
                } else {
                    baseLoad = 45; 
                }
                spatialCurve = 1.0 - Math.pow(progress, 2);
            } else { 
                if (dayType === 'holiday' || dayType === 'saturday') {
                    if (timeOfDay === 'pm_peak') baseLoad = 95;
                    else if (timeOfDay === 'midday') baseLoad = 80;
                    else baseLoad = 35;
                } else {
                    baseLoad = 40;
                }
                spatialCurve = Math.pow(progress, 0.7);
            }

        } else if (rNo === '2') {
            const isToNgongPing = destUpper.includes('NGONG PING');
            if (isToNgongPing) {
                if (dayType === 'holiday' || dayType === 'saturday') {
                    if (timeOfDay === 'am_peak') baseLoad = 98;
                    else if (timeOfDay === 'midday') baseLoad = 85;
                    else baseLoad = 30;
                } else {
                    baseLoad = 50; 
                }
                spatialCurve = 1.0 - Math.pow(progress, 3);
            } else { 
                if (dayType === 'holiday' || dayType === 'saturday') {
                    if (timeOfDay === 'pm_peak') baseLoad = 98;
                    else if (timeOfDay === 'midday') baseLoad = 70;
                    else baseLoad = 25;
                } else {
                    baseLoad = 45; 
                }
                spatialCurve = Math.pow(progress, 0.5);
            }
        }
        const noise = (date.getMinutes() % 7) - 3;
        let finalLoad = Math.round(baseLoad * spatialCurve) + noise;
        return Math.min(100, Math.max(0, finalLoad));
    }

    let baseLoad = 30; 
    if (!isWeekend) {
        if (hour >= 7 && hour <= 9) baseLoad = 75;
        else if (hour >= 17 && hour <= 20) baseLoad = 85;
    } else {
        if (hour >= 9 && hour <= 19) baseLoad = 65;
    }
    let spatialMultiplier = Math.sin(progress * Math.PI) + 0.3;
    let fallbackLoad = Math.round(baseLoad * spatialMultiplier);
    return Math.min(100, Math.max(0, fallbackLoad));
}

// ZONE 3: API & DATA FETCHING
// ==========================================
async function fetchJSON(url) {
  try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) return null;
      return await response.json();
  } catch(e) {
      return null;
  }
}

async function fetchEtaRaw(group, stopKeyToMatch) {
    let rawETAs = [];
    const now = Date.now();
    
    await Promise.all(group.routeIds.map(async (rId) => {
        try {
            const stops = routeStopsCache[rId] || [];
            const tIndex = stops.findIndex(s => getGlobalStopKey(s) === stopKeyToMatch);
            if (tIndex === -1) return;
            
            const targets = [];
            for(let i=0; i<=4; i++){
                if (tIndex + i < stops.length && stops[tIndex + i]) {
                    targets.push({ stop: stops[tIndex + i], offset: i });
                }
            }
            
            await Promise.all(targets.map(async ({ stop, offset }) => {
                if (!stop || !stop.stopId) return;
                
                const addEta = (etaStr, noGPS) => {
                    if (!etaStr) return;
                    rawETAs.push({
                        estimatedArrivalTime: etaStr.replace('T', ' ').substring(0, 19),
                        noGPS: noGPS,
                        offset: offset
                    });
                };

                if (rId.startsWith('KMB_') || rId.startsWith('LWB_')) {
                    const parts = rId.split('_');
                    const routeNo = parts[1], dir = parts[2], serviceType = parts[3];
                    const res = await fetchJSON(`${KMB_API_BASE}/eta/${stop.stopId}/${routeNo}/${serviceType}`);
                    if(res && res.data && Array.isArray(res.data)) {
                        res.data.filter(e => e.dir === dir && e.eta).forEach(e => {
                            addEta(e.eta, (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0);
                        });
                    }
                } else if (rId.startsWith('NLB_')) {
                    const rawNlbId = rId.replace('NLB_', '');
                    const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rawNlbId}&stopId=${stop.stopId}&language=en`);
                    if(res && res.estimatedArrivals && Array.isArray(res.estimatedArrivals)) {
                        res.estimatedArrivals.forEach(arr => addEta(arr.estimatedArrivalTime, arr.noGPS));
                    }
                } else if (rId.startsWith('CTB_')) {
                    const parts = rId.split('_');
                    const routeNo = parts[1];
                    const [resCTB, resNWFB] = await Promise.all([
                        fetchJSON(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stop.stopId}/${routeNo}`),
                        fetchJSON(`https://rt.data.gov.hk/v2/transport/citybus/eta/NWFB/${stop.stopId}/${routeNo}`)
                    ]);
                    [resCTB, resNWFB].forEach(res => {
                        if(res && res.data && Array.isArray(res.data)) {
                            res.data.forEach(e => {
                                if (e.eta) addEta(e.eta, (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0);
                            });
                        }
                    });
                } else if (rId.startsWith('GMB_')) {
                    const parts = rId.split('_');
                    const routeId = parts[1];
                    const routeSeq = parts[2];
                    const res = await fetchJSON(`https://data.etagmb.gov.hk/eta/stop/${stop.stopId}`);
                    if(res && res.data && Array.isArray(res.data)) {
                        const targetData = res.data.find(d => String(d.route_id) === routeId && String(d.route_seq) === routeSeq);
                        if (targetData && targetData.eta && Array.isArray(targetData.eta)) {
                            targetData.eta.forEach(e => { if(e.timestamp) addEta(e.timestamp, 0); });
                        }
                    }
                }
            }));
        } catch(e) { console.error("ETA Fetch Ignored:", e); }
    }));
    
    let currETAs = [];
    let futureETAs = [];
    
    rawETAs.forEach(e => {
        const arrTime = new Date(e.estimatedArrivalTime.replace(/-/g, '/')).getTime();
        if (!isNaN(arrTime) && arrTime > now - 15000) {
            e.targetMs = arrTime;
            if (e.offset === 0) currETAs.push(e);
            else futureETAs.push(e);
        }
    });

    let leftBuses = [];
    futureETAs.forEach(fEta => {
        const diffMins = (fEta.targetMs - now) / 60000;
        const assumedTravelTime = fEta.offset * 2.5; 
        
        if (diffMins <= assumedTravelTime + 1.5) { 
            const isStillComing = currETAs.some(cEta => {
                return cEta.targetMs < fEta.targetMs + 60000 && cEta.targetMs > fEta.targetMs - (fEta.offset * 5 * 60000);
            });
            
            if (!isStillComing) {
                let minsAgo = assumedTravelTime - diffMins;
                if (minsAgo < 0) minsAgo = 0; 
                
                leftBuses.push({
                    ...fEta,
                    isLeft: true,
                    minsAgo: minsAgo,
                    sortTime: now - (minsAgo * 60000)
                });
            }
        }
    });

    leftBuses.sort((a,b) => a.minsAgo - b.minsAgo);
    let uniqueLeft = [];
    if (leftBuses.length > 0) uniqueLeft.push(leftBuses[0]);

    currETAs.forEach(e => { e.sortTime = e.targetMs; e.isLeft = false; });
    let combined = [...uniqueLeft, ...currETAs];

    let uniqueCombined = [];
    let seenMins = new Set();
    combined.sort((a,b) => a.sortTime - b.sortTime).forEach(arr => {
         const m = Math.floor(arr.sortTime / 60000);
         const key = `${m}_${arr.isLeft}`;
         if (!seenMins.has(key)) {
             seenMins.add(key);
             uniqueCombined.push(arr);
         }
    });
    
    return uniqueCombined;
}

function makeUserIcon() {
    return L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });
}

function updateUserMarkers() {
    if (!lastKnownPos) return;
    const icon = makeUserIcon();
    if (mapInstance) {
        if (!userMarkerDetail) userMarkerDetail = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(mapInstance);
        else userMarkerDetail.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
    }
    if (globalMapInstance) {
        if (!userMarkerGlobal) userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(globalMapInstance);
        else userMarkerGlobal.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
    }
}

function startGPSTracking() {
    if (!navigator.geolocation || gpsWatcherId) return;
    gpsWatcherId = navigator.geolocation.watchPosition((pos) => {
        lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        updateUserMarkers();
    }, (err) => { console.warn('GPS Watch Error:', err); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
}

function refreshGPS(timeoutMs = 4000) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(lastKnownPos); return; }
        navigator.geolocation.getCurrentPosition((pos) => {
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            resolve(lastKnownPos);
        }, () => resolve(lastKnownPos), { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 10000 });
    });
}

function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            renderMainNearby(); resolve(false); return;
        }
        document.getElementById('mainLocationText').innerText = 'Locating...';
        
        navigator.geolocation.getCurrentPosition((pos) => {
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            
            let closest = null, minDistance = Infinity;
            allStops.forEach(s => {
                if(s.latitude === '0' || s.longitude === '0') return; 
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                document.getElementById('mainLocationText').innerText = closest.stopName_e;
                renderMainNearby();
                if (currentView === 'map' && globalMapInstance) renderGlobalMapStops();
                if (currentView === 'search') renderSearchResults();
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby stops mapped';
                document.getElementById('mainRouteList').innerHTML = '';
            }
            
            startGPSTracking(); 
            resolve(true);
        }, () => {
            document.getElementById('mainLocationText').innerText = 'Location Access Denied';
            renderMainNearby(); resolve(false);
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 });
    });
}

async function recenterMap(mapType) {
    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);
    if (!pos) return;
    
    if (mapType === 'detail' && mapInstance) {
        mapInstance.flyTo([pos.lat, pos.lon], 16, { animate: true, duration: 1 });
    } else if (mapType === 'global' && globalMapInstance) {
        globalMapInstance.flyTo([pos.lat, pos.lon], 16, { animate: true, duration: 1 });
    }
}

function initDetailMap() {
    mapInstance = L.map('map-container', { zoomControl: false }).setView([22.3, 114.16], 11);
    L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', {
        className: 'dark-tiles', attribution: '&copy; Hong Kong GeoData Store'
    }).addTo(mapInstance);
    L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/en/wgs84/{z}/{x}/{y}.png', {
        className: 'dark-tiles'
    }).addTo(mapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
    new L.Control.Recenter('detail').addTo(mapInstance);

    let lastTapTime = 0;
    document.getElementById('map-container').addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) return;
        const now = Date.now();
        if (now - lastTapTime < 400 && now - lastTapTime > 0) {
            mapInstance.zoomIn();
            if(e.cancelable) e.preventDefault();
        }
        lastTapTime = now;
    }, { passive: false });
}

function initGlobalMap() {
    globalMapInstance = L.map('global-map-container', { zoomControl: false }).setView([22.3, 114.16], 15);
    L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png', {

    }).addTo(globalMapInstance);
    L.tileLayer('https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/label/hk/en/wgs84/{z}/{x}/{y}.png', {

    }).addTo(globalMapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(globalMapInstance);
    new L.Control.Recenter('global').addTo(globalMapInstance);
    
    if (lastKnownPos) {
        userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: makeUserIcon(), zIndexOffset: 1000}).addTo(globalMapInstance);
        globalMapInstance.setView([lastKnownPos.lat, lastKnownPos.lon], 16);
    }

    let lastTapTime = 0;
    document.getElementById('global-map-container').addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) return;
        const now = Date.now();
        if (now - lastTapTime < 400 && now - lastTapTime > 0) {
            globalMapInstance.zoomIn();
            if(e.cancelable) e.preventDefault();
        }
        lastTapTime = now;
    }, { passive: false });
}

function drawRouteOnMap(group) {
    if(!mapInstance) return;
    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = getStopsForGroup(group).filter(s => s.latitude !== '0' && s.longitude !== '0');
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: 'var(--kmb-red)', weight: 6, opacity: 0.9}).addTo(mapInstance);
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        marker.on('click', () => {
            expandStop(idx);
            document.getElementById(`stop-item-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        mapMarkers.push(marker);
    });
    
    const bounds = mapRouteLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) { bounds.extend(userMarkerDetail.getLatLng()); }
    mapInstance.fitBounds(bounds, { padding: [40, 40] });
}

function renderGlobalMapStops() {
    if (!globalMapInstance || !lastKnownPos) return;
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:16px;height:16px;background:white;border:4px solid var(--kmb-red);border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.5);"></div>', iconSize: [16, 16] });
    
    let nearby = allStops.filter(s => s.latitude !== '0' && calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, parseFloat(s.latitude), parseFloat(s.longitude)) <= 0.8);
    nearby.forEach(s => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(globalMapInstance);
        marker.on('click', () => {
            globalMapInstance.setView(marker.getLatLng(), 17, { animate: true });
            openMapSheet(s);
        });
        globalMarkers.push(marker);
    });
    globalMapInstance.setView([lastKnownPos.lat, lastKnownPos.lon], 16);
}

function updateDetailTimestamp() {
    const el = document.getElementById('detailLastUpdated');
    if (el) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        el.innerText = `Updated ${timeStr}`;
    }
}

function setLoadProgress(pct, text) {
  const fill = document.getElementById('loadBar');
  const txt = document.getElementById('loadText');
  if (fill) fill.style.width = `${pct}%`;
  if (txt) txt.innerText = text;
}

async function initApp() {
  try {
    setLoadProgress(50, "Loading bus network...");
    const indexResponse = await fetch('bus_index.min.json', { cache: 'default' });
    if (!indexResponse.ok) throw new Error('Failed to load network index');
    const db = await indexResponse.json();
    groupedRoutes = db.groupedRoutes;
    routeStopsCache = db.routeStopsCache;
    
    buildAllStopsList();
    initDetailMap(); 
    await locateNearestStopPromise();
    startTimer();
  } catch (err) {
    document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="color:var(--kmb-red);">Error connecting to transit network.</div>';
  }
}

function buildAllStopsList() {
  const uniqueStops = new Map();
  groupedRoutes.forEach(g => {
    g.routeIds.forEach(id => {
      (routeStopsCache[id] || []).forEach(s => {
        if (!s || !s.stopName_e) return;
        const key = getGlobalStopKey(s);
        if (!uniqueStops.has(key)) {
            uniqueStops.set(key, { ...s, stopKey: key, routes: new Set([g.key]), latitude: s.latitude, longitude: s.longitude });
        } else {
            uniqueStops.get(key).routes.add(g.key);
        }
      });
    });
  });
  allStops = Array.from(uniqueStops.values());
}

function getStopsForGroup(group) {
  const uniqueMap = new Map();
  if (!group || !group.routeIds || group.routeIds.length === 0) return [];
  const primaryRouteId = group.routeIds[0]; 
  let seq = 1;
  (routeStopsCache[primaryRouteId] || []).forEach(s => {
     const key = getGlobalStopKey(s);
     if (s && s.stopName_e && !uniqueMap.has(key)) {
        uniqueMap.set(key, { ...s, stopKey: key, seq: seq++, latitude: s.latitude, longitude: s.longitude });
     }
  });
  return Array.from(uniqueMap.values());
}

function getNearbyRoutes(maxDistanceKm = 1.0, targetCompany = 'ALL') {
    if (!lastKnownPos || allStops.length === 0) return [];

    let eligibleStops = allStops;
    if (targetCompany !== 'ALL') {
        eligibleStops = allStops.filter(s => {
            return Array.from(s.routes).some(rk => {
                const g = groupedRoutes.find(r => r.key === rk);
                return g && g.company === targetCompany;
            });
        });
    }

    if (eligibleStops.length === 0) {
        if (targetCompany !== 'ALL') return groupedRoutes.filter(g => g.company === targetCompany).slice(0, 15);
        return [];
    }

    const stopsWithDist = eligibleStops.map(s => {
        const lat = parseFloat(s.latitude);
        const lon = parseFloat(s.longitude);
        const dist = (isNaN(lat) || isNaN(lon) || lat === 0) ? Infinity : calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, lat, lon);
        return { stop: s, dist };
    }).filter(item => item.dist !== Infinity).sort((a, b) => a.dist - b.dist);

    if (stopsWithDist.length === 0) {
        if (targetCompany !== 'ALL') return groupedRoutes.filter(g => g.company === targetCompany).slice(0, 15);
        return [];
    }

    let candidates = stopsWithDist.filter(item => item.dist <= maxDistanceKm);
    if (candidates.length === 0) candidates = stopsWithDist.slice(0, 3); 

    const seenGroupKeys = new Set();
    const result = [];
    candidates.forEach(item => {
        item.stop.routes.forEach(rk => {
            if (!seenGroupKeys.has(rk)) {
                seenGroupKeys.add(rk);
                const g = groupedRoutes.find(r => r.key === rk);
                if (g && (targetCompany === 'ALL' || g.company === targetCompany)) {
                    result.push({ ...g, nearestDistKm: item.dist, nearestStopName: item.stop.stopName_e });
                }
            }
        });
    });

    result.sort((a, b) => {
        const numA = parseInt(a.routeNo.replace(/[^0-9]/g, '')) || 999;
        const numB = parseInt(b.routeNo.replace(/[^0-9]/g, '')) || 999;
        if (numA === numB) return a.routeNo.localeCompare(b.routeNo);
        return numA - numB;
    });
    return result;
}

function switchTab(tabId) {
    if (tabId === 'main') {
        mainExpandedGroupKey = null; 
        document.getElementById('mainLocationText').innerText = 'Locating...';
        locateNearestStopPromise();
    }
    currentView = tabId;
    detailRouteGroup = null; 
    detailOpenToken++; 
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerTitle').innerText = 'Bus HK';
    
    if (tabId === 'search') {
        renderSearchResults();
        if (!lastKnownPos) refreshGPS().then(() => { if (currentView === 'search') renderSearchResults(); });
    }
    if (tabId === 'fav') renderFavList();
    if (tabId === 'map') {
        closeMapSheet();
        if (!globalMapInstance) {
            initGlobalMap();
            locateNearestStopPromise().then(() => { renderGlobalMapStops(); });
        } else {
            globalMapInstance.invalidateSize();
            renderGlobalMapStops();
        }
    }
}

async function autoSelectNearestStop(token) {
    const stops = getStopsForGroup(detailRouteGroup);
    if (stops.length === 0) return;

    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);

    if (token !== detailOpenToken) return;

    let bestIdx = 0; 
    if (pos) {
        let foundIdx = findNearestStopIdx(stops, pos);
        if (foundIdx !== -1) bestIdx = foundIdx;
    }

    const nameEl = document.querySelector(`#stop-item-${bestIdx} .stop-name`);
    if (nameEl && pos && stops[bestIdx].latitude !== '0' && stops[bestIdx].latitude) {
         nameEl.insertAdjacentHTML('beforeend', `<span class="nearest-tag">Nearest GPS</span>`);
    }

    await expandStop(bestIdx, true);
}

function openRouteDetail(groupKey) {
    const group = groupedRoutes.find(g => g.key === groupKey);
    if (!group) return;
    
    previousView = currentView;
    detailRouteGroup = group;
    detailExpandedStopIdx = -1;
    detailNearestIdx = -1;
    currentView = 'detail';
    const token = ++detailOpenToken;
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-detail').classList.add('active');
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('headerTitle').innerText = `${group.routeNo} To ${group.dest_e}`;
    
    const updateEl = document.getElementById('detailLastUpdated');
    if (updateEl) updateEl.innerText = 'Locating you...';

    setTimeout(async () => {
        if (token !== detailOpenToken) return;
        if(mapInstance) mapInstance.invalidateSize();
        drawRouteOnMap(group);
        renderStopList();
        
        await autoSelectNearestStop(token);
    }, 100);
}

function generateExpandedETAsHtml(arrs, group, stopKey) {
    if (arrs.length === 0) return '<div style="color:var(--text-sub); text-align:center; padding: 20px;">No departures scheduled.</div>';
    
    const stops = getStopsForGroup(group);
    const stopIdx = stops.findIndex(s => s.stopKey === stopKey);
    let html = '';
    
    let occBadgeAssigned = false;
    
    for(let i = 0; i < Math.min(4, arrs.length); i++) {
        const arr = arrs[i];
        
        let mainTimeStr = '';
        let subTimeStr = '';
        let color = '';
        let occBadge = '';
        
        if (arr.isLeft) {
            let m = Math.floor(arr.minsAgo);
            let s = Math.floor((arr.minsAgo % 1) * 60);
            let leftStr = m > 0 ? `-${m}m ${s}s` : `-${s}s`;
            
            const apiDiffMs = Math.max(0, arr.targetMs - Date.now());
            let apiM = Math.floor(apiDiffMs / 60000);
            let apiS = Math.floor((apiDiffMs % 60000) / 1000);
            let apiStr = apiM > 0 ? `${apiM}m ${apiS}s` : `${apiS}s`;

            occBadge = `<span style="font-size:1.6rem; font-weight:900; color:var(--text-sub);">${leftStr}</span>`;
            mainTimeStr = `<span style="opacity:0;">--</span>`; 
            subTimeStr = `Live Tracker (+${arr.offset} stop): ${apiStr}`;
            color = 'var(--text-sub)';
        } else {
            const apiDiffMs = Math.max(0, arr.targetMs - Date.now());
            let apiM = Math.floor(apiDiffMs / 60000);
            let apiS = Math.floor((apiDiffMs % 60000) / 1000);
            let apiStr = apiM > 0 ? `${apiM}m ${apiS}s` : `${apiS}s`;

            let isScheduled = (arr.noGPS === 1 || arr.noGPS === '1');
            color = isScheduled ? 'var(--accent-orange)' : 'var(--accent-green)'; 
            
            mainTimeStr = (apiM === 0 && apiS <= 45) ? 'Due' : `${Math.max(1, apiM)} <span style="font-size:1.2rem; font-weight:700;">m</span>`;
            subTimeStr = `Live Tracker (Stop): ${apiStr}`;
            
            if (!occBadgeAssigned && apiM <= 25) {
                const occPct = calculateOccupancy(group.routeNo, group.dest_e, Math.max(0, stopIdx), stops.length, Date.now());
                let occClass = '';
                let occText = '';
                
                if (occPct >= 90) {
                    occClass = 'occ-full';
                    occText = 'FULL';
                } else if (occPct >= 70) {
                    occClass = 'occ-crowded';
                    occText = 'CROWDED';
                } else if (occPct >= 45) {
                    occClass = 'occ-standing';
                    occText = 'STAND';
                } else {
                    occClass = 'occ-seating';
                    occText = 'SEATS';
                }
                
                occBadge = `<span class="occ-pill ${occClass}">${occText}</span>`;
                occBadgeAssigned = true; 
            }
        }
        
        html += `
            <div class="eta-row">
                <div class="eta-row-left"><span class="eta-row-seq">${group.routeNo}</span>${occBadge}</div>
                <div class="eta-row-time" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;">
                    <div style="color:${color};">${mainTimeStr}</div>
                    <div style="font-size:0.75rem; font-weight:700; color:var(--text-sub); margin-top:4px;">${subTimeStr}</div>
                </div>
            </div>
        `;
    }
    return html;
}

function renderSearchResults() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('searchResults');
    
    if (!query) {
        let nearby = getNearbyRoutes(1.0, activeRegionFilter);
        
        if (!lastKnownPos && nearby.length === 0) {
            listEl.innerHTML = `<div class="text-center" style="padding-top:60px;"><div style="font-size:3rem; margin-bottom:12px;">📍</div><div style="font-weight:700;">Locating nearby routes...</div></div>`;
            return;
        }
        if (nearby.length === 0) {
            let fallback = groupedRoutes.filter(g => activeRegionFilter === 'ALL' || g.company === activeRegionFilter).slice(0, 15);
            if (fallback.length > 0) nearby = fallback;
            else {
                listEl.innerHTML = `<div class="text-center" style="padding-top:60px;"><div style="font-size:3rem; margin-bottom:12px;">🚌</div><div style="font-weight:700;">No routes found for ${activeRegionFilter}</div></div>`;
                return;
            }
        }

        const firstValid = nearby.find(g => g.nearestDistKm !== undefined && !isNaN(g.nearestDistKm));
        const headerLabel = firstValid ? `${firstValid.nearestStopName} (${firstValid.nearestDistKm.toFixed(1)}km)` : 'Nearby';

        let html = `
            <div style="padding: 12px 16px; font-size: 0.85rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5;">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%;">📍 Nearest ${activeRegionFilter !== 'ALL' ? activeRegionFilter : ''} (${headerLabel})</span>
                <span style="color: var(--accent-blue); font-size: 0.8rem; flex-shrink: 0;">${nearby.length} routes</span>
            </div>
        `;
        nearby.forEach(g => {
            html += `
              <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
                  <div class="route-no-col" style="color:var(--kmb-red);">${g.routeNo}</div>
                  <div class="route-info-col"><div class="route-dest">To ${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
              </div>
            `;
        });
        listEl.innerHTML = html;
        return;
    }

    let matches = groupedRoutes;
    if (activeRegionFilter !== 'ALL') matches = matches.filter(g => g.company === activeRegionFilter);
    matches = matches.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query));
    
    if(matches.length === 0) {
        listEl.innerHTML = '<div class="text-center" style="padding-top:60px; font-size:4rem; opacity:0.2;">🚌</div><div class="text-center">No routes found</div>';
        return;
    }
    
    let html = '';
    matches.slice(0, 100).forEach(g => {
        html += `
          <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
              <div class="route-no-col" style="color:var(--kmb-red);">${g.routeNo}</div>
              <div class="route-info-col"><div class="route-dest">To ${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

async function expandStop(idx, forceOpen = false) {
    if (detailExpandedStopIdx === idx && !forceOpen) {
        document.getElementById(`detail-eta-expanded-${idx}`).classList.remove('active');
        document.getElementById(`stop-item-${idx}`).classList.remove('active-stop');
        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] }));
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    if (!item || !expandContainer) return;
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: '<div style="width:20px;height:20px;background:white;border:6px solid var(--kmb-red);border-radius:50%;"></div>', iconSize: [20, 20] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (mapInstance && mapMarkers[idx]) {
        mapInstance.setView(mapMarkers[idx].getLatLng(), 16, { animate: true });
    }
    
    const stops = getStopsForGroup(detailRouteGroup);
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchEtaRaw(detailRouteGroup, targetStop.stopKey);
        if (detailExpandedStopIdx !== idx) return; 
        expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup, targetStop.stopKey);
        updateDetailTimestamp();
    } catch (e) {
        expandContainer.innerHTML = '<div style="color:var(--kmb-red); text-align:center; padding: 20px;">Network Failed</div>';
    }
}

function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  
  timerInterval = setInterval(() => {
    if (isSyncing) return;
    countdown--;
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimerMain').innerText = '...';
      
      if (currentView === 'main') {
          renderMainNearby(true).then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          const stops = getStopsForGroup(detailRouteGroup);
          const targetStop = stops[detailExpandedStopIdx];
          fetchEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              const expandContainer = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
              if(expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup, targetStop.stopKey);
              updateDetailTimestamp();
              isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else if (currentView === 'map' && sheetExpandedGroupKey) {
          const group = groupedRoutes.find(g => g.key === sheetExpandedGroupKey);
          if(group && currentNearestStopKey) {
              fetchEtaRaw(group, currentNearestStopKey).then(arrs => {
                 const expandContainer = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
                 if (expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, group, currentNearestStopKey);
                 isSyncing = false;
              }).catch(() => { isSyncing = false; });
          } else { isSyncing = false; }
      } else { isSyncing = false; }
    } else {
      document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
    }
  }, 1000);
}

// Ensure GPS never freezes by re-triggering the watcher when app is un-minimized
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        clearInterval(timerInterval);
        if (gpsWatcherId) { navigator.geolocation.clearWatch(gpsWatcherId); gpsWatcherId = null; }
    } else {
        if (groupedRoutes.length > 0) startTimer();
        startGPSTracking();
        refreshGPS(2000);
    }
});

window.onload = initApp;
</script>
