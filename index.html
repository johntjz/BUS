<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Bus HK - Network</title>
<!-- Leaflet CSS for Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  :root {
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
    --accent-blue: #0a84ff;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color-scheme: dark;
  }

  /* Header */
  .header {
    background-color: var(--accent-red);
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1001;
    height: 55px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
  .back-btn {
    position: absolute; left: 10px; top: 0; bottom: 0; display: none;
    align-items: center; justify-content: center; background: none; border: none; color: white;
    font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 0 16px;
  }

  /* Views */
  .view-container {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    display: none; flex-direction: column; background: var(--bg-color);
  }
  .view-container.active { display: flex; }

  /* Bottom Tabs */
  .bottom-tabs {
    background-color: var(--card-bg); border-top: 1px solid var(--card-border);
    display: flex; justify-content: space-around; align-items: center;
    height: 65px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom);
    z-index: 1001;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-secondary); flex: 1; height: 100%; cursor: pointer; font-size: 0.75rem; gap: 4px;
    transition: color 0.2s;
  }
  .tab.active { color: var(--accent-red); font-weight: 700; }
  .tab-icon { font-size: 1.5rem; margin-bottom: 2px; }

  /* Generic Location Header & Commute buttons */
  .top-action-bar {
    background: var(--card-bg); padding: 12px 16px; border-bottom: 1px solid var(--card-border);
    display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; z-index: 10;
  }
  .location-header { display: flex; justify-content: space-between; align-items: center; }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px;}
  
  .quick-commute-row { display: flex; gap: 10px; }
  .commute-btn {
    flex: 1; background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
    padding: 10px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .commute-btn:active { background: #3a3a3c; }
  .commute-edit { font-size: 0.7rem; color: var(--text-secondary); padding: 4px; border: 1px solid #444; border-radius: 6px; }

  /* Advanced Route Cards */
  .route-card {
    display: flex; flex-direction: column; align-items: stretch;
    padding: 16px 16px 16px 12px; border-bottom: 1px solid var(--card-border); gap: 0;
    border-left: 6px solid var(--card-border);
    cursor: pointer; background-color: var(--bg-color); transition: background-color 0.2s;
  }
  .route-card.inactive { display: none; }
  .route-card:active { background-color: #1e1e20; }
  .route-main-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

  .route-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .route-no { font-size: 1.6rem; font-weight: 900; min-width: 45px; letter-spacing: -0.5px; flex-shrink: 0; color: var(--text-primary); }
  .route-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .route-dest { font-size: 1.05rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; color: var(--text-primary); }
  
  .eta-container { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 42px; padding: 4px; border-radius: 8px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; text-align: right; }
  .smart-eta { font-size: 1.45rem; font-weight: 800; color: var(--accent-green); font-variant-numeric: tabular-nums; }
  
  .smart-eta.arriving { color: var(--accent-orange); font-size: 1.25rem; animation: blink-arriving 1.5s infinite; }
  .smart-eta.delayed { animation: blink-delayed 2s infinite; font-size: 1.15rem; font-weight: 700; }
  .smart-eta.departing { color: var(--text-secondary); font-size: 1.05rem; font-weight: 700; opacity: 0.7; }
  
  @keyframes blink-arriving { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  @keyframes blink-delayed { 0% { opacity: 1; color: var(--accent-orange); } 50% { opacity: 0.4; color: var(--accent-red); } 100% { opacity: 1; color: var(--accent-orange); } }
  
  /* Occupancy Pills */
  .compact-occupancy { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .occ-pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px;
    font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; font-variant-numeric: tabular-nums;
  }
  .occ-seating { background: rgba(48, 209, 88, 0.15); color: var(--accent-green); }
  .occ-standing { background: rgba(255, 159, 10, 0.15); color: var(--accent-orange); }
  .occ-full { background: rgba(227, 24, 55, 0.15); color: var(--accent-red); border: 1px solid transparent; }

  /* Sub ETAs & Timeline */
  .subsequent-etas {
    display: none; flex-direction: column; gap: 10px;
    margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--card-border); width: 100%;
  }
  .route-card.expanded .subsequent-etas { display: flex; }
  .sub-eta-row { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
  .sub-eta-label { font-size: 0.95rem; color: var(--text-secondary); font-weight: 600; }
  .sub-eta-time { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  
  /* Search View */
  .search-box-container { padding: 16px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 10;}
  .search-company-tabs { display: flex; gap: 8px; }
  .co-tab { flex: 1; padding: 10px; background: var(--bg-color); color: var(--text-secondary); border: 2px solid var(--card-border); border-radius: 8px; font-weight: 800; cursor: pointer; transition: all 0.2s ease; }
  .co-tab.active { background: var(--accent-red); color: white; border-color: var(--accent-red); }
  .search-input { width: 100%; padding: 16px; border: 2px solid var(--card-border); border-radius: 12px; font-size: 1.3rem; outline: none; text-align: center; background: var(--bg-color); color: var(--text-primary); font-weight: 700; }
  .search-input:focus { border-color: var(--accent-blue); }
  
  .simple-list-item { display: flex; padding: 16px; border-bottom: 1px solid var(--card-border); align-items: center; gap: 16px; cursor: pointer; background: var(--bg-color); transition: background 0.2s; }
  .simple-list-item:active { background: var(--card-bg); }
  .co-badge { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }

  /* Map View */
  #map-container { height: 35vh; width: 100%; background: #111; flex-shrink: 0; border-bottom: 1px solid var(--card-border); }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-color); }
  
  #global-map-container { width: 100%; height: 100%; transition: height 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); z-index: 1; flex-shrink: 0; }
  
  .map-bottom-sheet {
    background: var(--bg-color);
    height: 0; overflow-y: auto; z-index: 2;
    transition: height 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .map-bottom-sheet.active { height: 50%; border-top: 1px solid var(--card-border); }
  
  .sheet-header { padding: 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--card-bg); z-index: 3; }
  .sheet-title { font-size: 1.25rem; font-weight: 800; }
  .sheet-close { font-size: 1.5rem; font-weight: bold; color: var(--text-secondary); cursor: pointer; background: none; border: none; }

  /* Detail Stop List UI */
  .stop-item { position: relative; padding: 20px 16px 20px 50px; border-bottom: 1px solid var(--card-border); cursor: pointer; }
  .stop-line { position: absolute; left: 28px; top: 0; bottom: 0; width: 3px; background-color: var(--accent-red); z-index: 1; }
  .stop-item:first-child .stop-line { top: 30px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 30px; }
  .stop-dot { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: #aaa; border: 3px solid var(--bg-color); z-index: 2; }
  .stop-item.active-stop .stop-dot { background: var(--accent-red); box-shadow: 0 0 0 4px rgba(227,24,55,0.3); }
  .stop-name { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); }

  /* Modal Overlays */
  .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 1000;
      display: none; justify-content: center; align-items: flex-end;
  }
  .modal-content {
      background: var(--bg-color); width: 100%; height: 90vh;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      display: flex; flex-direction: column; overflow: hidden;
      padding-bottom: 65px; 
  }
  .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border-bottom: 1px solid var(--card-border); }
  .modal-header h3 { font-size: 1.25rem; font-weight: 800; margin: 0; }
  .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.8rem; font-weight: bold; cursor: pointer; }
  .modal-search { padding: 16px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); }
  .modal-search input { width: 100%; padding: 14px; border: 2px solid var(--card-border); border-radius: 12px; font-size: 1.1rem; background: var(--bg-color); color: var(--text-primary); font-weight: 700; text-align: center; outline: none; }
  .modal-results { flex: 1; overflow-y: auto; background: var(--bg-color); }
  .stop-item-search { padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer; }
  .stop-item-search:active { background: var(--card-bg); }

  /* Utilities */
  .text-center { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 1.15rem; }
  .init-loader { padding: 80px 20px; text-align: center; }
  .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  .custom-user-icon div { width: 100% !important; height: 100% !important; background: #0a84ff !important; border-radius: 50% !important; border: 3px solid white !important; box-shadow: 0 0 12px rgba(0,0,0,0.8) !important; }

  /* Favorites Specific */
  .add-fav-btn { margin: 24px; padding: 20px; background: var(--card-bg); border: 2px dashed var(--card-border); border-radius: 16px; text-align: center; color: var(--accent-blue); font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: background 0.2s; }
  .add-fav-btn:active { background: #2c2c2e; }
  .del-fav-btn { background: rgba(227, 24, 55, 0.15); border: 1px solid rgba(227, 24, 55, 0.3); color: var(--accent-red); border-radius: 8px; padding: 14px 18px; font-size: 1.2rem; cursor: pointer; }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Bus HK</h1>
</header>

<!-- Main View -->
<main id="view-main" class="view-container active">
  <div class="top-action-bar">
    <div class="location-header">
      <div class="location-text">
          <span style="font-size: 1.4rem; color: var(--accent-red);">📍</span>
          <span id="mainLocationText">Locating nearest stop...</span>
      </div>
    </div>
    <div class="quick-commute-row">
        <button class="commute-btn" onclick="triggerCommute('work')">
            <span>💼 To Work</span>
            <span class="commute-edit" onclick="event.stopPropagation(); editCommute('work')">Edit</span>
        </button>
        <button class="commute-btn" onclick="triggerCommute('home')">
            <span>🏠 To Home</span>
            <span class="commute-edit" onclick="event.stopPropagation(); editCommute('home')">Edit</span>
        </button>
    </div>
  </div>
  <div id="mainRouteList">
      <div class="init-loader" id="loader-container">
          <div id="loadText" style="font-size:1.1rem; color:var(--text-primary); font-weight: 700;">Connecting to network...</div>
      </div>
  </div>
</main>

<!-- Search View -->
<main id="view-search" class="view-container">
  <div class="search-box-container">
    <div class="search-company-tabs" id="search-company-tabs">
        <button class="co-tab active" onclick="setSearchCompany('ALL')">All</button>
        <button class="co-tab" onclick="setSearchCompany('KMB')">KMB</button>
        <button class="co-tab" onclick="setSearchCompany('LWB')">LWB</button>
        <button class="co-tab" onclick="setSearchCompany('NLB')">NLB</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search Route Number..." oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Map View -->
<main id="view-map" class="view-container">
    <div id="global-map-container"></div>
    <div id="map-bottom-sheet" class="map-bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-title" id="sheet-title">Stop Name</div>
            <button class="sheet-close" onclick="closeMapSheet()">✕</button>
        </div>
        <div id="sheet-route-list" style="padding-bottom: 20px;"></div>
    </div>
</main>

<!-- Favorites View -->
<main id="view-fav" class="view-container">
  <div class="top-action-bar" style="justify-content:center;">
      <div class="location-text" style="justify-content: center; font-size:1.2rem;">Favorite Routes</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Route Detail View -->
<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div id="stop-list-container"></div>
</main>

<!-- Bottom Tabs -->
<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main">
    <span class="tab-icon">🏠</span>
    <span>Main</span>
  </div>
  <div class="tab" onclick="switchTab('search')" id="tab-search">
    <span class="tab-icon">🔍</span>
    <span>Search</span>
  </div>
  <div class="tab" onclick="switchTab('map')" id="tab-map">
    <span class="tab-icon">🗺️</span>
    <span>Map</span>
  </div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav">
    <span class="tab-icon">⭐</span>
    <span>Favorites</span>
  </div>
</nav>

<!-- Commute Setup Modal -->
<div id="commute-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="commuteSetupTitle">Set Commute Stop</h3>
            <button class="modal-close" onclick="closeCommuteModal()">✕</button>
        </div>
        <div class="modal-search">
            <input type="text" id="commuteStopSearch" placeholder="Search stop by name..." oninput="renderCommuteStopSearch()" autocomplete="off">
        </div>
        <div id="commuteStopResults" class="modal-results"></div>
    </div>
</div>

<!-- Favorite Add Modal -->
<div id="fav-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Favorite Route</h3>
            <button class="modal-close" onclick="closeFavModal()">✕</button>
        </div>
        <div class="modal-search">
            <input type="text" id="favSearchInput" placeholder="Search route number..." oninput="renderFavSearch()" autocomplete="off">
        </div>
        <div id="favSearchResults" class="modal-results"></div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// --- Configuration & State ---
const NLB_API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
const CACHE_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;

let currentView = 'main';
let previousView = 'main';
let appMode = 'NEAREST'; 
let allStops = [];
let groupedRoutes = []; 
let routeStopsCache = {};
let busStateMap = {}; 
// Bumping cache version to v12 to force a fresh load of all KMB/LWB API data
let favRoutes = JSON.parse(localStorage.getItem('hkbus_fav_routes_v12') || '[]');
let searchCompanyFilter = 'ALL';

let lastKnownPos = null;
let currentNearestStopKey = null;
let activeCommuteSetupType = '';
let currentMapSheetStop = null;

// Map & Detail State
let detailRouteGroup = null;
let mapInstance = null; 
let globalMapInstance = null; 
let mapRouteLayer = null;
let mapMarkers = [];
let globalMarkers = [];
let userMarkerDetail = null;
let userMarkerGlobal = null;

let isSyncing = false;

// --- Data Fetching & Caching ---
async function fetchJSON(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error('API offline');
  return await response.json();
}

function getGlobalStopKey(s) {
    const lat = parseFloat(s.latitude) || 0;
    return `${s.stopName_e}_${lat.toFixed(1)}`;
}

function cleanStopName(name) {
    if (!name) return '';
    return name.replace(/\s*[\(（][^\)）]*[\)）]/g, '').trim();
}

function updateLoadingText(text) {
  const txt = document.getElementById('loadText');
  if (txt) txt.innerText = text;
}

async function initApp() {
  try {
    const cachedGrouped = localStorage.getItem('hkbus_grouped_v12');
    const cachedStops = localStorage.getItem('hkbus_stops_v12');
    const cacheTime = localStorage.getItem('hkbus_cache_time_v12');
    const now = Date.now(); 

    let loadedFromCache = false;
    if (cachedGrouped && cachedStops && cacheTime && (now - parseInt(cacheTime) < CACHE_EXPIRY_MS)) {
      try {
          updateLoadingText("Loading cached network...");
          groupedRoutes = JSON.parse(cachedGrouped);
          routeStopsCache = JSON.parse(cachedStops);
          loadedFromCache = true;
      } catch (e) { localStorage.removeItem('hkbus_cache_time_v12'); }
    } 
    
    if (!loadedFromCache) {
      updateLoadingText("Fetching Network Data...");
      const groupedMap = new Map();
      routeStopsCache = {};

      // 1. NLB Base Data Fetching
      try {
          const nlbRData = await fetchJSON(`${NLB_API_BASE}/route.php?action=list`);
          const rawNlbRoutes = nlbRData.routes || [];
          
          rawNlbRoutes.forEach(r => {
            const dest_e = r.routeName_e ? r.routeName_e.split('>').pop().trim() : '';
            const cleanDest = cleanStopName(dest_e); 
            const key = `NLB_${r.routeNo}___${cleanDest}`.replace(/[^a-zA-Z0-9_-]/g, '_');

            if (!groupedMap.has(key)) {
              groupedMap.set(key, { key, routeNo: r.routeNo, dest_e: cleanDest, routeIds: [`NLB_${r.routeId}`], company: 'NLB' });
            } else {
              groupedMap.get(key).routeIds.push(`NLB_${r.routeId}`);
            }
          });

          const chunkSize = 15;
          for (let i = 0; i < rawNlbRoutes.length; i += chunkSize) {
            const chunk = rawNlbRoutes.slice(i, i + chunkSize);
            await Promise.all(chunk.map(async (r) => {
              try {
                const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=list&routeId=${r.routeId}`);
                routeStopsCache[`NLB_${r.routeId}`] = (res.stops || []).map(s => ({...s, stopName_e: cleanStopName(s.stopName_e), company: 'NLB'}));
              } catch(e) {}
            }));
            updateLoadingText(`Syncing Lantau Routes... ${Math.round((i/rawNlbRoutes.length)*100)}%`);
          }
      } catch(e) { console.error("Error fetching NLB network", e); }

      // 2. KMB / LWB Base Data Fetching
      // Note: Data.gov.hk serves both KMB and LWB routes through the same '/v1/transport/kmb/' endpoint.
      try {
          updateLoadingText("Fetching KMB/LWB Network Data...");
          
          // Using Promise.all here speeds up KMB/LWB API load times significantly
          const [kmbRoutesData, kmbStopsData, kmbRouteStopsData] = await Promise.all([
              fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/route/'),
              fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/stop'),
              fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/route-stop')
          ]);

          const kmbStopsMap = {};
          if(kmbStopsData && kmbStopsData.data) {
              kmbStopsData.data.forEach(s => { kmbStopsMap[s.stop] = s; });
          }

          const kmbRouteCoMap = {}; 

          if(kmbRoutesData && kmbRoutesData.data) {
              kmbRoutesData.data.forEach(r => {
                  const cleanDest = cleanStopName(r.dest_en);
                  // The API specifically flags 'LWB' routes in the 'co' field here, otherwise it's 'KMB'
                  const co = r.co || 'KMB'; 
                  kmbRouteCoMap[`${r.route}_${r.bound}_${r.service_type}`] = co;
                  
                  const key = `${co}_${r.route}___${cleanDest}`.replace(/[^a-zA-Z0-9_-]/g, '_');
                  const routeId = `${co}_${r.route}_${r.bound}_${r.service_type}`;

                  if(!groupedMap.has(key)) {
                      groupedMap.set(key, { key, routeNo: r.route, dest_e: cleanDest, routeIds: [routeId], company: co });
                  } else {
                      groupedMap.get(key).routeIds.push(routeId);
                  }
              });
          }

          if(kmbRouteStopsData && kmbRouteStopsData.data) {
              const kmbRsMap = {};
              kmbRouteStopsData.data.forEach(rs => {
                  const co = kmbRouteCoMap[`${rs.route}_${rs.bound}_${rs.service_type}`] || 'KMB';
                  const routeId = `${co}_${rs.route}_${rs.bound}_${rs.service_type}`;
                  if(!kmbRsMap[routeId]) kmbRsMap[routeId] = [];
                  kmbRsMap[routeId].push({...rs, co});
              });

              Object.keys(kmbRsMap).forEach(routeId => {
                  kmbRsMap[routeId].sort((a,b) => parseInt(a.seq) - parseInt(b.seq));
                  routeStopsCache[routeId] = kmbRsMap[routeId].map(rs => {
                      const stopInfo = kmbStopsMap[rs.stop];
                      return {
                          stopId: rs.stop,
                          stopName_e: cleanStopName(stopInfo ? stopInfo.name_en : 'Unknown Stop'),
                          latitude: stopInfo ? stopInfo.lat : 0,
                          longitude: stopInfo ? stopInfo.long : 0,
                          kmbRoute: rs.route,
                          kmbServiceType: rs.service_type,
                          kmbBound: rs.bound,
                          company: rs.co
                      };
                  });
              });
          }
      } catch(e) { console.error("Error fetching KMB/LWB network", e); }

      groupedRoutes = Array.from(groupedMap.values());
      try {
        localStorage.setItem('hkbus_grouped_v12', JSON.stringify(groupedRoutes));
        localStorage.setItem('hkbus_stops_v12', JSON.stringify(routeStopsCache));
        localStorage.setItem('hkbus_cache_time_v12', Date.now().toString());
      } catch (e) {}
    }
    
    buildAllStopsList();
    initDetailMap(); 
    
    await locateNearestStopPromise();
    startBackgroundLoop();
    
  } catch (err) {
    document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="color:var(--accent-red);">Error connecting to transit network.</div>';
  }
}

function buildAllStopsList() {
  const uniqueStops = new Map();
  groupedRoutes.forEach(g => {
    g.routeIds.forEach(id => {
      (routeStopsCache[id] || []).forEach(s => {
        if (!s || !s.stopName_e) return;
        const key = getGlobalStopKey(s);
        if (!uniqueStops.has(key)) {
            uniqueStops.set(key, { ...s, stopKey: key, routes: new Set([g.key]), latitude: s.latitude, longitude: s.longitude });
        } else {
            uniqueStops.get(key).routes.add(g.key);
        }
      });
    });
  });
  allStops = Array.from(uniqueStops.values());
}

function getStopsForGroup(group) {
  const uniqueMap = new Map();
  if (!group || !group.routeIds || group.routeIds.length === 0) return [];
  const primaryRouteId = group.routeIds[0]; 
  
  let seq = 1;
  (routeStopsCache[primaryRouteId] || []).forEach(s => {
     const key = getGlobalStopKey(s);
     if (s && s.stopName_e && !uniqueMap.has(key)) {
        uniqueMap.set(key, { ...s, stopKey: key, seq: seq++, latitude: s.latitude, longitude: s.longitude });
     }
  });
  return Array.from(uniqueMap.values());
}

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// --- GPS Location ---
function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            updateNetworkTelemetry(); resolve(false); return;
        }

        navigator.geolocation.getCurrentPosition((pos) => {
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            
            const userIcon = L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });
            
            if(mapInstance) {
                if(!userMarkerDetail) userMarkerDetail = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(mapInstance);
                else userMarkerDetail.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
            }
            if(globalMapInstance) {
                if(!userMarkerGlobal) userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(globalMapInstance);
                else userMarkerGlobal.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
            }
            
            let closest = null, minDistance = Infinity;
            allStops.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                updateNetworkTelemetry();
                
                if (currentView === 'map' && globalMapInstance) {
                    renderGlobalMapStops();
                }
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby stops';
                document.getElementById('mainRouteList').innerHTML = '';
            }
            resolve(true);
        }, () => {
            document.getElementById('mainLocationText').innerText = 'Location Access Denied';
            updateNetworkTelemetry(); resolve(false);
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 });
    });
}

function getCommuteRelevantGroups(destStopKey) {
    if (!lastKnownPos) return [];

    const nearbyStops = allStops.filter(s => calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, parseFloat(s.latitude), parseFloat(s.longitude)) < 1.0);
    if (nearbyStops.length === 0) return [];
    const nearbyKeys = new Set(nearbyStops.map(s => s.stopKey));

    let relevantGroups = [];
    let directRoutesFound = false;

    // Direct Routes
    groupedRoutes.forEach(group => {
        for (const rId of group.routeIds) {
            const stops = routeStopsCache[rId] || [];
            const destIdx = stops.findIndex(s => getGlobalStopKey(s) === destStopKey);
            if (destIdx > 0) {
                for (let i = 0; i < destIdx; i++) {
                    if (nearbyKeys.has(getGlobalStopKey(stops[i]))) {
                        relevantGroups.push({
                            group: group,
                            matchDetails: [{ routeId: rId, stops: stops, targetIndex: i, isLastStop: false }],
                            isTransfer: false
                        });
                        directRoutesFound = true;
                        break; 
                    }
                }
            }
        }
    });

    // 1-Transfer Fallback
    if (!directRoutesFound) {
        let destRouteIds = [];
        groupedRoutes.forEach(g => {
            g.routeIds.forEach(rId => {
                const stops = routeStopsCache[rId] || [];
                const destIdx = stops.findIndex(s => getGlobalStopKey(s) === destStopKey);
                if(destIdx > 0) destRouteIds.push({ g, rId, stops, destIdx });
            });
        });

        groupedRoutes.forEach(origGroup => {
            for(const origRId of origGroup.routeIds) {
                const origStops = routeStopsCache[origRId] || [];
                let bestOrigIdx = -1;
                for(let i=0; i<origStops.length; i++) {
                    if(nearbyKeys.has(getGlobalStopKey(origStops[i]))) {
                        bestOrigIdx = i; break;
                    }
                }
                
                if(bestOrigIdx !== -1) {
                    let transferFound = false;
                    for(const dRoute of destRouteIds) {
                        if (dRoute.g.routeNo === origGroup.routeNo) continue;
                        
                        for(let i = bestOrigIdx + 1; i < origStops.length; i++) {
                            const intersectionKey = getGlobalStopKey(origStops[i]);
                            const destIntIdx = dRoute.stops.findIndex(ds => getGlobalStopKey(ds) === intersectionKey);
                            
                            if(destIntIdx !== -1 && destIntIdx < dRoute.destIdx) {
                                relevantGroups.push({
                                    group: origGroup,
                                    matchDetails: [{ routeId: origRId, stops: origStops, targetIndex: bestOrigIdx, isLastStop: false }],
                                    isTransfer: true,
                                    transferName: `Transfer to ${dRoute.g.routeNo} at ${origStops[i].stopName_e}`
                                });
                                transferFound = true;
                                break;
                            }
                        }
                        if(transferFound) break;
                    }
                }
            }
        });
    }
    
    let unique = [];
    let seen = new Set();
    for(let rg of relevantGroups) {
        let key = rg.group.key + (rg.isTransfer ? '_T' : '');
        if(!seen.has(key)) {
            seen.add(key);
            unique.push(rg);
        }
    }
    return unique;
}

}

async function updateNetworkTelemetry() {
    if (currentView !== 'main') return;
    
    let relevantGroups = [];
    if (appMode === 'COMMUTE_WORK') {
        const stopObj = allStops.find(s => s.stopKey === localStorage.getItem('pulse_work_stop'));
        document.getElementById('mainLocationText').innerText = `Commuting to Work (${stopObj ? stopObj.stopName_e : ''})`;
        relevantGroups = getCommuteRelevantGroups(localStorage.getItem('pulse_work_stop'));
    } else if (appMode === 'COMMUTE_HOME') {
        const stopObj = allStops.find(s => s.stopKey === localStorage.getItem('pulse_home_stop'));
        document.getElementById('mainLocationText').innerText = `Commuting to Home (${stopObj ? stopObj.stopName_e : ''})`;
        relevantGroups = getCommuteRelevantGroups(localStorage.getItem('pulse_home_stop'));
    } else {
        if (!currentNearestStopKey) {
            document.getElementById('mainRouteList').innerHTML = '<div class="text-center">No nearby stops detected.</div>';
            return;
        }
        const stopObj = allStops.find(s => s.stopKey === currentNearestStopKey);
        if(stopObj) {
            document.getElementById('mainLocationText').innerText = stopObj.stopName_e;
            stopObj.routes.forEach(groupKey => {
                const group = groupedRoutes.find(g => g.key === groupKey);
                if (group) {
                    let matchDetails = [];
                    group.routeIds.forEach(rId => {
                        const stops = routeStopsCache[rId] || [];
                        const targetIndex = stops.findIndex(s => getGlobalStopKey(s) === currentNearestStopKey);
                        if (targetIndex !== -1) {
                            matchDetails.push({ routeId: rId, stops, targetIndex, isLastStop: (targetIndex === stops.length - 1) });
                        }
                    });
                    if (matchDetails.length > 0) relevantGroups.push({ group, matchDetails, isTransfer: false });
                }
            });
        }
    }

    const containerId = 'mainRouteList';
    const prefix = 'main';
    buildEtaCardsHTML(relevantGroups, containerId, prefix);
    
    await Promise.all(relevantGroups.map(item => processSmartArrivals(item, prefix)));

    // Re-sort elements purely based on remaining minutes
    const listEl = document.getElementById(containerId);
    if(listEl) {
        const cards = Array.from(listEl.querySelectorAll('.route-card'));
        cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
        cards.forEach(card => listEl.appendChild(card));
    }
}

// --- Load Factor & Core Arrival Processing ---
class KalmanFilter1D {
  constructor(processNoise, initialEstimate, initialError) { this.q = processNoise; this.x = initialEstimate; this.p = initialError; }
  update(measurement, dt, isOptimistic, dynamicR) {
    this.x = this.x - dt; this.p = this.p + this.q; 
    const currentR = isOptimistic ? (dynamicR * 0.2) : dynamicR; 
    const k = this.p / (this.p + currentR); 
    this.x = this.x + k * (measurement - this.x); 
    this.p = (1 - k) * this.p; 
    return Math.max(0, this.x); 
  }
}

function generateDeterministicNoise(routeStr, currentStopIndex, timestamp) {
  const timeBlock = Math.floor(timestamp / 300000); 
  const seed = `${routeStr}-${currentStopIndex}-${timeBlock}`;
  let hash = 0;
  for (let i = 0; i < seed.length; i++) { hash = ((hash << 5) - hash) + seed.charCodeAt(i); hash |= 0; }
  return ((Math.abs(hash) % 100) / 100 * 6) - 3;
}

function calculateOccupancy(routeNo, destName, currentStopIndex, totalStops, currentTimestamp) {
  const date = new Date(currentTimestamp);
  const hour = date.getHours();
  const isWeekend = (date.getDay() === 0 || date.getDay() === 6);
  let baseLoad = 30; 
  if (!isWeekend) {
    if (hour >= 7 && hour <= 9) baseLoad = 75;
    else if (hour >= 17 && hour <= 20) baseLoad = 85;
  } else {
    if (hour >= 9 && hour <= 19) baseLoad = 65;
  }
  
  let progress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
  let spatialMultiplier = Math.sin(progress * Math.PI) + 0.3;
  const stableNoise = generateDeterministicNoise(routeNo, currentStopIndex, currentTimestamp);
  let pct = Math.min(100, Math.max(0, Math.round((baseLoad * spatialMultiplier) + stableNoise)));
  return { pct };
}

function getOccData(state) {
    if (state === 'full') return { class: 'occ-full', key: 'Full', icon: '⚠️' };
    if (state === 'standing') return { class: 'occ-standing', key: 'Standing', icon: '🧍' };
    return { class: 'occ-seating', key: 'Seating', icon: '💺' };
}

async function processSmartArrivals(item, prefix = 'main', restrictToLiveGPS = false) {
  const group = item.group;
  const matchDetails = item.matchDetails;
  const groupKey = group.key + (item.isTransfer ? '_T' : '');
  const cardEl = document.getElementById(`${prefix}-route-${groupKey}`);
  
  try {
    const smartEl = document.getElementById(`${prefix}-smart-${groupKey}`);
    const occSecEl = document.getElementById(`${prefix}-occ-sec-${groupKey}`);
    const lblSmartEl = document.getElementById(`${prefix}-lbl-smart-${groupKey}`);
    const subsEl = document.getElementById(`${prefix}-subs-${groupKey}`);

    let combinedArrivals = [];
    const now = Date.now();

    await Promise.all(matchDetails.map(async (m) => {
      const targetStop = m.stops[m.targetIndex];

      if (m.routeId.startsWith('NLB_')) {
          const rawNlbId = m.routeId.replace('NLB_', '');
          try { 
              const targetEtaRes = await fetchJSON(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rawNlbId}&stopId=${targetStop.stopId}&language=en`); 
              if (targetEtaRes && targetEtaRes.estimatedArrivals) {
                  targetEtaRes.estimatedArrivals.forEach(arr => {
                      combinedArrivals.push({
                          arrivalTimeStr: arr.estimatedArrivalTime.replace(/-/g, '/'),
                          noGPS: arr.noGPS === 1 || arr.noGPS === '1',
                          targetStop, targetIndex: m.targetIndex, totalStops: m.stops.length, stops: m.stops 
                      });
                  });
              }
          } catch(e) {}
      } else {
          // Both KMB and LWB ETAs load directly from this single endpoint
          try {
              const res = await fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${targetStop.stopId}/${targetStop.kmbRoute}/${targetStop.kmbServiceType}`);
              if (res && res.data) {
                  res.data.filter(arr => arr.dir === targetStop.kmbBound && arr.eta).forEach(arr => {
                      combinedArrivals.push({
                          arrivalTimeStr: arr.eta, // e.g. "2023-10-09T19:12:00+08:00" natively parsed
                          noGPS: arr.rmk_en?.toLowerCase().includes('scheduled'),
                          targetStop, targetIndex: m.targetIndex, totalStops: m.stops.length, stops: m.stops 
                      });
                  });
              }
          } catch(e) {}
      }
    }));

    if (restrictToLiveGPS) {
        combinedArrivals = combinedArrivals.filter(c => !c.noGPS);
    }

    combinedArrivals = combinedArrivals.filter(c => new Date(c.arrivalTimeStr).getTime() > now - 60000);
    combinedArrivals.sort((a, b) => new Date(a.arrivalTimeStr).getTime() - new Date(b.arrivalTimeStr).getTime());
    
    if (restrictToLiveGPS && combinedArrivals.length === 0) {
        if (cardEl) cardEl.remove();
        return;
    }

    const activeItem = combinedArrivals.length > 0 ? combinedArrivals[0] : null;

    if (subsEl && activeItem) {
        if (combinedArrivals.length > 1) {
            let subsHtml = '';
            for (let i = 1; i < combinedArrivals.length && i <= 2; i++) {
                const cBus = combinedArrivals[i];
                const cArr = new Date(cBus.arrivalTimeStr);
                const cRawMins = Math.max(0, Math.floor((cArr.getTime() - now) / 60000));
                const timeText = cRawMins === 0 ? 'Due' : `${cRawMins}m`;
                const labelText = cBus.noGPS ? 'Scheduled' : 'Actual';
                const seqName = i === 1 ? 'Next Bus' : '3rd Bus';
                subsHtml += `
                    <div class="sub-eta-row">
                        <span class="sub-eta-label">${seqName} <span style="font-size:0.75rem; opacity:0.6; margin-left:4px;">(${labelText})</span></span>
                        <span class="sub-eta-time" style="color: ${cBus.noGPS ? 'var(--accent-orange)' : 'var(--text-primary)'}">${timeText}</span>
                    </div>
                `;
            }
            subsEl.innerHTML = subsHtml;
        } else {
            subsEl.innerHTML = `<div class="sub-eta-row" style="justify-content:center; color: var(--text-secondary); font-size: 0.9rem;">No further departures scheduled.</div>`;
        }
    }

    if (combinedArrivals.length === 0) {
      if (cardEl) {
        cardEl.dataset.smartMins = 9999;
        cardEl.dataset.targetArrivalTime = "";
      }
      if (smartEl) {
          smartEl.innerText = '--';
          smartEl.className = 'smart-eta departing'; // Dim it out
      }
      if (lblSmartEl) lblSmartEl.innerText = 'No Schedule';
      if (occSecEl) occSecEl.style.display = 'none';
      if (subsEl) subsEl.innerHTML = `<div class="sub-eta-row" style="justify-content:center; color: var(--text-secondary); font-size: 0.9rem;">Route ended / No schedule.</div>`;
      return;
    }

    const activeBus = activeItem;
    const arrivalTime = new Date(activeBus.arrivalTimeStr);
    const pseudoBusId = activeBus.arrivalTimeStr.replace(/[^0-9]/g, ''); 
    const isNoGPS = activeBus.noGPS;
    let rawEtaMins = Math.max(0, Math.floor((arrivalTime.getTime() - now) / 60000));

    let state = busStateMap[groupKey];
    if (!state) {
        state = { filter: new KalmanFilter1D(0.1, rawEtaMins, 1.0), timestamp: now, pseudoBusId: pseudoBusId };
        busStateMap[groupKey] = state;
    } 
    if (state.pseudoBusId !== pseudoBusId) {
        state.pseudoBusId = pseudoBusId;
        state.filter = new KalmanFilter1D(0.1, rawEtaMins, 1.0); 
    }

    let dwellPenaltyMins = 0;
    
    if (rawEtaMins <= 30) {
        const { pct } = calculateOccupancy(group.routeNo, group.dest_e, activeItem.targetIndex, activeItem.totalStops, now);
        let occState = pct > 95 ? 'full' : (pct > 75 ? 'standing' : 'seating');

        if (pct > 95) dwellPenaltyMins = 2.0;
        else if (pct > 75) dwellPenaltyMins = 1.0;

        const barsEl = document.getElementById(`${prefix}-bars-${groupKey}`);
        const occInfo = getOccData(occState);
        if (barsEl) {
            barsEl.className = `occ-pill ${occInfo.class}`;
            barsEl.innerText = `${occInfo.icon} ${occInfo.key} · ${pct}%`;
        }
        if (occSecEl) occSecEl.style.display = 'flex';
    } else {
        if (occSecEl) occSecEl.style.display = 'none';
    }
    
    let effectiveRawEta = rawEtaMins;
    if (rawEtaMins > 3 && !isNoGPS) effectiveRawEta += dwellPenaltyMins;

    let smartMins = effectiveRawEta;
    if (rawEtaMins >= 0) {
      if (isNoGPS) {
        smartMins = rawEtaMins; 
        if (lblSmartEl) lblSmartEl.innerText = `Scheduled`;
        if (smartEl) smartEl.style.color = 'var(--accent-orange)';
      } else {
        if (lblSmartEl) lblSmartEl.innerText = `Actual`;
        if (smartEl) smartEl.style.color = ''; 
        const dtMins = (now - state.timestamp) / 60000;
        if (dtMins > 0) {
           const isOptimistic = (effectiveRawEta < state.filter.x);
           const dynamicR = Math.max(1.0, effectiveRawEta * 0.1); 
           smartMins = Math.round(state.filter.update(effectiveRawEta, dtMins, isOptimistic, dynamicR));
           state.timestamp = now;
        } else {
           smartMins = Math.round(state.filter.x);
        }
      }
    }

    const newArrivalMs = now + (smartMins * 60000);
    const oldArrivalMs = parseInt(cardEl.dataset.targetArrivalTime, 10);
    let finalTargetMs = newArrivalMs;

    if (oldArrivalMs && !isNaN(oldArrivalMs)) {
        const driftMs = newArrivalMs - oldArrivalMs;
        if (driftMs > 0 && driftMs < 60000) finalTargetMs = oldArrivalMs;
    }
    
    cardEl.dataset.targetArrivalTime = finalTargetMs;
    const finalSmartMins = Math.max(0, Math.ceil((finalTargetMs - now) / 60000));
    
    if (cardEl) cardEl.dataset.smartMins = finalSmartMins;
    
    if (finalSmartMins === 0) {
        if(smartEl) smartEl.innerText = 'Due';
        if(smartEl) smartEl.className = 'smart-eta arriving';
    } else {
      if(smartEl) smartEl.innerText = `${finalSmartMins}m`;
      if(smartEl) smartEl.className = 'smart-eta';
    }

  } catch (err) {
    if (cardEl) cardEl.dataset.smartMins = 9999;
  }
}

// --- Map Logic ---
function initDetailMap() {
    mapInstance = L.map('map-container', { zoomControl: false, doubleClickZoom: true, tap: true }).setView([22.3, 114.16], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        className: 'dark-tiles',
        attribution: '&copy; OpenStreetMap'
    }).addTo(mapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
}

function initGlobalMap() {
    globalMapInstance = L.map('global-map-container', { zoomControl: false, doubleClickZoom: true, tap: true }).setView([22.3, 114.16], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        className: 'dark-tiles',
        attribution: '&copy; OpenStreetMap'
    }).addTo(globalMapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(globalMapInstance);
    
    if (lastKnownPos) {
        const userIcon = L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });
        userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon: userIcon, zIndexOffset: 1000}).addTo(globalMapInstance);
        globalMapInstance.setView([lastKnownPos.lat, lastKnownPos.lon], 16);
    }
}

function drawRouteOnMap(group) {
    if(!mapInstance) return;
    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = getStopsForGroup(group);
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: 'var(--accent-red)', weight: 6, opacity: 0.9}).addTo(mapInstance);
    
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        mapMarkers.push(marker);
    });
    
    const bounds = mapRouteLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) { bounds.extend(userMarkerDetail.getLatLng()); }
    mapInstance.fitBounds(bounds, { padding: [40, 40] });
}

function renderGlobalMapStops() {
    if (!globalMapInstance || !lastKnownPos) return;
    
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];
    
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:16px;height:16px;background:white;border:4px solid var(--accent-red);border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.5);"></div>', iconSize: [16, 16] });
    
    let nearby = allStops.filter(s => calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, parseFloat(s.latitude), parseFloat(s.longitude)) <= 0.8);
    
    nearby.forEach(s => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(globalMapInstance);
        marker.on('click', () => {
            openMapSheet(s, marker);
        });
        globalMarkers.push(marker);
    });
    
    globalMapInstance.setView([lastKnownPos.lat, lastKnownPos.lon], 16);
}

function openMapSheet(stopObj, marker) {
    currentMapSheetStop = stopObj;
    document.getElementById('map-bottom-sheet').classList.add('active');
    document.getElementById('sheet-title').innerText = stopObj.stopName_e;
    
    // Smoothly wait for flex CSS transition then resize Map appropriately
    setTimeout(() => {
        if (globalMapInstance) {
            globalMapInstance.invalidateSize();
            if (marker) globalMapInstance.panTo(marker.getLatLng(), {animate: true});
        }
    }, 320);

    refreshMapSheet();
}

async function refreshMapSheet() {
    if (!currentMapSheetStop) return;
    
    let relevantGroups = [];
    currentMapSheetStop.routes.forEach(groupKey => {
        const group = groupedRoutes.find(g => g.key === groupKey);
        if (group) {
            let matchDetails = [];
            group.routeIds.forEach(rId => {
                const stops = routeStopsCache[rId] || [];
                const targetIndex = stops.findIndex(s => getGlobalStopKey(s) === currentMapSheetStop.stopKey);
                if (targetIndex !== -1) {
                    matchDetails.push({ routeId: rId, stops, targetIndex, isLastStop: (targetIndex === stops.length - 1) });
                }
            });
            if (matchDetails.length > 0) relevantGroups.push({ group, matchDetails, isTransfer: false });
        }
    });

    const containerId = 'sheet-route-list';
    const prefix = 'sheet';
    
    buildEtaCardsHTML(relevantGroups, containerId, prefix);
    
    // Apply strict filtering in the map sheet to ONLY show live ETAs
    await Promise.all(relevantGroups.map(item => processSmartArrivals(item, prefix, true)));

    const listEl = document.getElementById(containerId);
    if(listEl) {
      const cards = Array.from(listEl.querySelectorAll('.route-card'));
      
      // If there are no cards left after the live GPS filtering, show a nice empty state
      if (cards.length === 0) {
          listEl.innerHTML = `<div class="text-center" style="padding: 20px;">No buses are actively arriving at this stop right now.</div>`;
      } else {
          cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
          cards.forEach(card => listEl.appendChild(card));
      }
    }
}

function closeMapSheet() {
    document.getElementById('map-bottom-sheet').classList.remove('active');
    currentMapSheetStop = null;
    setTimeout(() => {
        if (globalMapInstance) globalMapInstance.invalidateSize();
    }, 320);
}

// --- Search View ---
function setSearchCompany(co) {
    searchCompanyFilter = co;
    document.querySelectorAll('#search-company-tabs .co-tab').forEach(btn => {
        if(btn.innerText.toUpperCase() === co || (co==='ALL' && btn.innerText==='All')) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    renderSearchResults();
}

function renderSearchResults() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('searchResults');
    
    let matches = groupedRoutes;
    if(searchCompanyFilter !== 'ALL') {
        matches = matches.filter(g => g.company === searchCompanyFilter);
    }
    
    if(query) matches = matches.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query));
    
    if(matches.length === 0) { listEl.innerHTML = '<div class="text-center">No routes found</div>'; return; }
    
    let html = '';
    matches.slice(0, 100).forEach(g => {
        let coColor = g.company === 'KMB' ? '#e31837' : (g.company === 'LWB' ? '#ff9f0a' : '#0a84ff');
        html += `<div class="simple-list-item" onclick="openRouteDetail('${g.key}')">
            <div class="route-no-col" style="font-size:1.8rem; font-weight:900; width:85px; color:${coColor};">${g.routeNo}</div>
            <div class="route-info-col" style="flex:1;">
                <div style="font-weight:700; font-size:1.2rem;">To ${g.dest_e}</div>
                <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">
                   <span class="co-badge" style="background:${coColor};">${g.company}</span>
                </div>
            </div>
        </div>`;
    });
    listEl.innerHTML = html;
}

// --- Favorites View ---
function renderFavList() {
    const listEl = document.getElementById('favList');
    let html = `<div class="add-fav-btn" onclick="openFavModal()">+ Add New Favorite Route</div>`;

    if(favRoutes.length === 0) {
        html += '<div class="text-center">No bookmarks yet.</div>';
        listEl.innerHTML = html;
        return;
    }
    
    favRoutes.forEach(k => {
        const g = groupedRoutes.find(r => r.key === k);
        if(g) {
            let coColor = g.company === 'KMB' ? '#e31837' : (g.company === 'LWB' ? '#ff9f0a' : '#0a84ff');
            html += `<div class="simple-list-item" onclick="openRouteDetail('${g.key}')">
                <div class="route-no-col" style="font-size:1.8rem; font-weight:900; width:85px; color:${coColor};">${g.routeNo}</div>
                <div class="route-info-col" style="flex:1;">
                    <div style="font-weight:700; font-size:1.2rem;">To ${g.dest_e}</div>
                    <div style="font-size: 0.8rem; margin-top:4px;">
                       <span class="co-badge" style="background:${coColor};">${g.company}</span>
                    </div>
                </div>
                <button class="del-fav-btn" onclick="event.stopPropagation(); removeFavRoute('${g.key}');">🗑️</button>
            </div>`;
        }
    });
    listEl.innerHTML = html;
}

function removeFavRoute(key) {
    favRoutes = favRoutes.filter(k => k !== key);
    localStorage.setItem('hkbus_fav_routes_v12', JSON.stringify(favRoutes));
    renderFavList();
}

function openFavModal() {
    document.getElementById('fav-modal').style.display = 'flex';
    document.getElementById('favSearchInput').value = '';
    renderFavSearch();
}

function closeFavModal() {
    document.getElementById('fav-modal').style.display = 'none';
}

function renderFavSearch() {
    const query = document.getElementById('favSearchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('favSearchResults');
    if(!query) { listEl.innerHTML = '<div class="text-center">Type route number to add</div>'; return; }

    const matches = groupedRoutes.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query));
    if(matches.length === 0) { listEl.innerHTML = '<div class="text-center">No routes found</div>'; return; }
    
    let html = '';
    matches.slice(0, 50).forEach(g => {
        const isSaved = favRoutes.includes(g.key);
        let coColor = g.company === 'KMB' ? '#e31837' : (g.company === 'LWB' ? '#ff9f0a' : '#0a84ff');
        html += `<div class="simple-list-item" style="opacity: ${isSaved ? '0.5' : '1'}; pointer-events: ${isSaved ? 'none' : 'auto'};" onclick="addFavFromModal('${g.key}')">
            <div class="route-no-col" style="font-size:1.4rem; font-weight:900; width:65px; color:${coColor};">${g.routeNo}</div>
            <div class="route-info-col" style="flex:1;">
                <div style="font-weight:700;">To ${g.dest_e}</div>
                <div style="font-size:0.85rem; color:var(--text-secondary); text-transform:uppercase;">${isSaved ? '(Saved)' : ''} <span class="co-badge" style="background:${coColor};">${g.company}</span></div>
            </div>
        </div>`;
    });
    listEl.innerHTML = html;
}

function addFavFromModal(key) {
    if(!favRoutes.includes(key)) {
        favRoutes.push(key);
        localStorage.setItem('hkbus_fav_routes_v12', JSON.stringify(favRoutes));
    }
    closeFavModal();
    renderFavList();
}

// --- Detail View Stops ---
function renderStopList() {
    const listEl = document.getElementById('stop-list-container');
    const stops = getStopsForGroup(detailRouteGroup);
    
    let html = '';
    stops.forEach((s, idx) => {
        html += `<div class="stop-item" id="stop-item-${idx}">
            <div class="stop-line"></div>
            <div class="stop-dot"></div>
            <div class="stop-name">${idx + 1}. ${s.stopName_e}</div>
        </div>`;
    });
    listEl.innerHTML = html;
}

// --- Background Loop ---
function startBackgroundLoop() {
  setInterval(() => {
    if (isSyncing) return;
    
    document.querySelectorAll('.route-card').forEach(card => {
        const targetMs = parseInt(card.dataset.targetArrivalTime, 10);
        if (!targetMs || isNaN(targetMs)) return;
        const remainingMs = targetMs - Date.now();
        const mins = Math.max(0, Math.ceil(remainingMs / 60000));
        card.dataset.smartMins = mins;
        
        const smartEl = card.querySelector('.smart-eta');
        if (smartEl && card.dataset.smartMins != "9999") {
            if (mins > 0) {
                smartEl.innerText = `${mins}m`;
                smartEl.className = 'smart-eta';
            } else {
                smartEl.innerText = 'Due';
                smartEl.className = 'smart-eta arriving';
            }
        }
    });

    if (Date.now() % 15000 < 1000) {
        isSyncing = true;
        let syncPromises = [];
        if (currentView === 'main') {
            syncPromises.push(updateNetworkTelemetry());
        }
        if (document.getElementById('map-bottom-sheet').classList.contains('active')) {
            syncPromises.push(refreshMapSheet());
        }
        
        Promise.all(syncPromises).finally(() => { isSyncing = false; });
    }
  }, 1000);
}

window.onload = initApp;
