<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TransitPulse HK - Smart Engine</title>
<style>
  :root {
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-blue: #0a84ff;
    --accent-yellow: #ffd60a;
    --accent-orange: #ff9f0a;
    --accent-purple: #bf5af2;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background-color: var(--accent-red);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  
  .live-badge {
    background: rgba(0,0,0,0.25);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  
  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  .stop-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: var(--bg-color);
  }

  .refresh-timer { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; }

  #routeList { display: flex; flex-direction: column; }

  .route-card {
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
    background-color: var(--bg-color);
    gap: 10px;
  }

  .card-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .route-left { display: flex; align-items: center; gap: 14px; }
  .route-no { font-size: 1.8rem; font-weight: 900; width: 60px; letter-spacing: -0.5px; }

  .route-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .route-dest { font-size: 0.95rem; font-weight: 600; }
  .route-status { font-size: 0.75rem; color: var(--text-secondary); }

  .eta-container { display: flex; gap: 12px; align-items: center; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 60px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; }

  .official-eta {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .smart-eta {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--accent-green);
    font-variant-numeric: tabular-nums;
  }

  .smart-eta.adjusted { color: var(--accent-blue); }

  .inference-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .tag {
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    font-weight: 500;
  }

  .tag.blue { color: var(--accent-blue); border-color: rgba(10, 132, 255, 0.3); }
  .tag.green { color: var(--accent-green); border-color: rgba(48, 209, 88, 0.3); }
  .tag.orange { color: var(--accent-orange); border-color: rgba(255, 159, 10, 0.3); }
  .tag.yellow { color: var(--accent-yellow); border-color: rgba(255, 214, 10, 0.3); }
  .tag.purple { color: var(--accent-purple); border-color: rgba(191, 90, 242, 0.3); }
</style>
</head>
<body>

<div class="header">
  <h1>TransitPulse HK</h1>
  <div class="live-badge">SMART ENGINE</div>
</div>

<div class="stop-header">
  <span>📍 Lo Uk Tsuen</span>
  <span class="refresh-timer" id="refreshTimer">Syncing...</span>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Initializing telemetry...</div>
</div>

<script>
  const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
  const TARGET_STOP_NAME = 'Lo Uk Tsuen';
  const TARGET_ROUTES = ['3M', '1', '4', '2', '11', 'A35', 'N35', 'N1']; 
  const REFRESH_INTERVAL = 30;
  
  let countdown = REFRESH_INTERVAL;
  let timerInterval;
  const busStateMap = {};

  function calculateDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Time-of-day heuristic fallback if no 2nd bus is scheduled
  function getFallbackOccupancy(routeNo, destName) {
    const h = new Date().getHours();
    const dest = destName.toLowerCase();
    if (h >= 7 && h <= 9 && (dest.includes('tung chung') || dest.includes('mui wo'))) return 'orange';
    if (h >= 17 && h <= 19 && !dest.includes('tung chung')) return 'orange';
    return 'green';
  }

  async function fetchJSON(endpoint) {
    const response = await fetch(`${API_BASE}${endpoint}`);
    if (!response.ok) throw new Error('API offline');
    return await response.json();
  }

  async function updateNetworkTelemetry() {
    try {
      const routeData = await fetchJSON('/route.php?action=list');
      const relevantRoutes = routeData.routes.filter(r => TARGET_ROUTES.includes(r.routeNo));
      
      const listEl = document.getElementById('routeList');
      const loadingEl = document.getElementById('loadingText');
      if (loadingEl) loadingEl.remove();

      for (const route of relevantRoutes) {
        const destName = route.routeName_e.split('>').pop().trim();
        const cardId = `route-${route.routeId}`;
        
        if (!document.getElementById(cardId)) {
          listEl.insertAdjacentHTML('beforeend', `
            <div class="route-card" id="${cardId}" data-smart-mins="9999">
              <div class="card-main">
                <div class="route-left">
                  <div class="route-no">${route.routeNo}</div>
                  <div class="route-info">
                    <div class="route-dest">To ${destName}</div>
                    <div class="route-status" id="status-${route.routeId}">Loading telemetry...</div>
                  </div>
                </div>
                <div class="eta-container">
                  <div class="eta-box">
                    <span class="eta-label">Official</span>
                    <span class="official-eta" id="off-${route.routeId}">--</span>
                  </div>
                  <div class="eta-box">
                    <span class="eta-label">Smart</span>
                    <span class="smart-eta" id="smart-${route.routeId}">--</span>
                  </div>
                </div>
              </div>
              <div class="inference-row" id="tags-${route.routeId}"></div>
            </div>
          `);
        }
      }

      const promises = relevantRoutes.map(route => processRouteSmartETA(route));
      await Promise.all(promises);

      sortCards();

    } catch (err) {
      console.error('Telemetry failure:', err);
    }
  }

  async function processRouteSmartETA(route) {
    const routeId = route.routeId;
    const cardEl = document.getElementById(`route-${routeId}`);
    
    try {
      const stopData = await fetchJSON(`/stop.php?action=list&routeId=${routeId}`);
      const stops = stopData.stops;
      const targetIndex = stops.findIndex(s => s.stopName_e.toLowerCase().includes(TARGET_STOP_NAME.toLowerCase()));

      if (targetIndex === -1) {
        if (cardEl) cardEl.remove();
        return;
      }

      const statusEl = document.getElementById(`status-${routeId}`);
      const offEl = document.getElementById(`off-${routeId}`);
      const smartEl = document.getElementById(`smart-${routeId}`);
      const tagsEl = document.getElementById(`tags-${routeId}`);
      
      const targetStop = stops[targetIndex];
      const upstreamStop = targetIndex > 0 ? stops[targetIndex - 1] : null;

      const targetReq = fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${targetStop.stopId}&language=en`);
      const upstreamReq = upstreamStop 
        ? fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${upstreamStop.stopId}&language=en`)
        : Promise.resolve(null);

      const [targetEtaRes, upstreamEtaRes] = await Promise.all([targetReq, upstreamReq]);

      if (!targetEtaRes.estimatedArrivals || targetEtaRes.estimatedArrivals.length === 0) {
        cardEl.dataset.smartMins = 9999;
        offEl.innerText = '--';
        smartEl.innerText = '--';
        statusEl.innerText = 'No upcoming departures';
        tagsEl.innerHTML = '';
        return;
      }

      const rawBus = targetEtaRes.estimatedArrivals[0];
      const arrivalTime = new Date(rawBus.estimatedArrivalTime.replace(/-/g, '/'));
      const serverTime = new Date(rawBus.generateTime.replace(/-/g, '/'));
      const rawEtaMins = Math.max(0, Math.floor((arrivalTime - serverTime) / 60000));

      let smartMins = rawEtaMins;
      let reasonTags = [];

      // 1. Occupancy Inference (Headway Compression Math)
      if (targetEtaRes.estimatedArrivals.length > 1) {
        const bus2 = targetEtaRes.estimatedArrivals[1];
        const arrTime2 = new Date(bus2.estimatedArrivalTime.replace(/-/g, '/'));
        const rawEtaMins2 = Math.max(0, Math.floor((arrTime2 - serverTime) / 60000));
        
        const headwayGap = rawEtaMins2 - rawEtaMins;
        
        if (headwayGap <= 12) {
          reasonTags.push(`<span class="tag purple">High Load (Bunching)</span>`);
        } else if (headwayGap >= 25) {
          reasonTags.push(`<span class="tag orange">High Load (Wide Gap)</span>`);
        } else {
          reasonTags.push(`<span class="tag green">Normal Load</span>`);
        }
      } else {
        // Fallback heuristic if no 2nd bus is listed
        const destName = route.routeName_e.split('>').pop().trim();
        const fbColor = getFallbackOccupancy(route.routeNo, destName);
        const fbText = fbColor === 'orange' ? 'Likely Standing' : 'Probable Seats';
        reasonTags.push(`<span class="tag ${fbColor}">${fbText} (Time Est.)</span>`);
      }

      // 2. Spatial & Delay Logic
      if (rawEtaMins <= 2) {
        smartMins = rawEtaMins;
      } else {
        const busKey = `${routeId}_${rawBus.estimatedArrivalTime}`;
        const now = Date.now();
        const prevState = busStateMap[busKey];

        if (upstreamStop && upstreamEtaRes && upstreamEtaRes.estimatedArrivals && upstreamEtaRes.estimatedArrivals.length > 0) {
          const upBus = upstreamEtaRes.estimatedArrivals[0];
          const upArrTime = new Date(upBus.estimatedArrivalTime.replace(/-/g, '/'));
          const upServerTime = new Date(upBus.generateTime.replace(/-/g, '/'));
          const upstreamEtaMins = Math.max(0, Math.floor((upArrTime - upServerTime) / 60000));

          const distanceKm = calculateDistanceKm(
            parseFloat(upstreamStop.latitude), parseFloat(upstreamStop.longitude),
            parseFloat(targetStop.latitude), parseFloat(targetStop.longitude)
          );
          const minTransitMins = Math.max(1.0, (distanceKm / 35.0) * 60);

          if (rawEtaMins < upstreamEtaMins + Math.floor(minTransitMins)) {
            smartMins = Math.ceil(upstreamEtaMins + minTransitMins);
            reasonTags.push(`<span class="tag blue">Upstream Buffer</span>`);
          }
        }

        if (prevState) {
          const elapsedMins = (now - prevState.timestamp) / 60000;
          const rawDecay = prevState.rawEtaMins - rawEtaMins;
          const decayRate = elapsedMins > 0 ? (rawDecay / elapsedMins) : 1;

          if (decayRate < 0.3 && rawEtaMins > 3) {
            smartMins = Math.min(rawEtaMins + 3, smartMins + 2);
            reasonTags.push(`<span class="tag yellow">Minor Delay</span>`);
          }
        }
        busStateMap[busKey] = { timestamp: now, rawEtaMins, smartMins };
      }

      // 3. UI Updates
      cardEl.dataset.smartMins = smartMins;
      offEl.innerText = rawEtaMins === 0 ? 'Due' : `${rawEtaMins}m`;

      if (smartMins === 0) {
        smartEl.innerText = 'Due';
        smartEl.className = 'smart-eta';
      } else {
        smartEl.innerText = `${smartMins} min`;
        smartEl.className = smartMins > rawEtaMins ? 'smart-eta adjusted' : 'smart-eta';
      }

      const gpsTag = rawBus.noGPS === 1 
        ? `<span class="tag yellow">Scheduled</span>` 
        : `<span class="tag green">Live GPS</span>`;
      
      tagsEl.innerHTML = `${gpsTag} ${reasonTags.join(' ')}`;
      statusEl.innerText = `Updated ${serverTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

    } catch (err) {
      const statusEl = document.getElementById(`status-${routeId}`);
      if (statusEl) statusEl.innerText = 'Telemetry sync failed';
      if (cardEl) cardEl.dataset.smartMins = 9999;
    }
  }

  function sortCards() {
    const listEl = document.getElementById('routeList');
    const cards = Array.from(listEl.querySelectorAll('.route-card'));
    cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
    cards.forEach(card => listEl.appendChild(card));
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        document.getElementById('refreshTimer').innerText = 'Syncing...';
        updateNetworkTelemetry();
      } else {
        document.getElementById('refreshTimer').innerText = `Syncing in ${countdown}s`;
      }
    }, 1000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimer').innerText = 'Syncing...';
      updateNetworkTelemetry();
      startTimer();
    } else {
      clearInterval(timerInterval);
    }
  });

  updateNetworkTelemetry();
  startTimer();
</script>
</body>
</html>
