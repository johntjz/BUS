<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Pulse HK - Transit Network</title>
<link rel="stylesheet" href="leaflet.css">

<style>
  :root {
    --theme-color: #0a84ff; /* Unified Pulse Blue */
    --kmb-red: #e31837;
    --bg-light: #121212;
    --bg-white: #1c1c1e;
    --text-main: #ffffff;
    --text-sub: #98989d;
    --border-color: #2c2c2e;
    --accent-blue: #0a84ff;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
    --accent-red: #ff453a;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  html { font-size: 16px; transition: font-size 0.2s ease-in-out; }
  html.text-sm { font-size: 14px; } 
  html.text-xs { font-size: 12px; } 

  body { background-color: var(--bg-light); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; color-scheme: dark; }

  .header { background-color: var(--theme-color); color: white; padding: 0 12px; display: flex; justify-content: center; align-items: center; position: relative; z-index: 1001; height: 55px; flex-shrink: 0; }
  .header h1 { font-size: 1.15rem; font-weight: 700; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 50px; padding-right: 50px; width: 100%; box-sizing: border-box; }
  .back-btn { position: absolute; left: 4px; top: 0; bottom: 0; width: 44px; display: none; align-items: center; justify-content: center; background: none; border: none; color: white; font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 0; z-index: 2; line-height: 1; }
  .text-size-btn { position: absolute; right: 4px; top: 0; bottom: 0; width: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: white; font-size: 1.05rem; font-weight: 800; cursor: pointer; padding: 0; z-index: 2; }
  .view-container { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; display: none; flex-direction: column; background: var(--bg-light); }
  .view-container.active { display: flex; }

  .bottom-tabs { background-color: var(--bg-white); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; height: 65px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 1001; }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); flex: 1; height: 100%; cursor: pointer; font-size: 0.75rem; gap: 4px; transition: color 0.2s; }
  .tab.active { color: var(--theme-color); font-weight: 700; }
  .tab-icon { font-size: 1.5rem; margin-bottom: 2px; }

  .location-header { background: var(--bg-white); padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
  .refresh-timer { font-size: 1.05rem; color: var(--theme-color); font-weight: 800; font-variant-numeric: tabular-nums; }

  .detail-live-bar { background: var(--bg-white); padding: 8px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-sub); font-weight: 700; flex-shrink: 0; }
  .live-dot-pulse { color: var(--accent-green); display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }

  .route-list-item { display: flex; padding: 16px; border-bottom: 1px solid var(--border-color); align-items: center; gap: 16px; cursor: pointer; background: var(--bg-light); transition: background 0.2s; }
  .route-list-item.inactive-route { opacity: 0.85; }
  .route-list-item:active { background: var(--bg-white); }
  
  .route-no-col { min-width: 80px; max-width: 105px; padding: 6px 4px; border-radius: 8px; font-size: 1.4rem; font-weight: 900; text-align: center; color: white; letter-spacing: -0.5px; line-height: 1.1; word-break: break-word; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .route-no-col.bus-mode { font-size: 1.85rem; background: transparent !important; color: var(--text-main); text-align:left; align-items:flex-start; padding:0; }
  
  .route-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .route-dest { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
  .route-sub { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .route-eta-col { text-align: right; min-width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
  .eta-time { font-size: 2.1rem; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; line-height: 1; }
  
  .eta-expanded-container { display: none; flex-direction: column; gap: 0; background: #181818; border-bottom: 1px solid var(--border-color); }
  .eta-expanded-container.active { display: flex; }
  .eta-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px dashed var(--border-color); }
  .eta-row:last-child { border-bottom: none; }
  .eta-row-left { display: flex; align-items: center; gap: 12px; font-size: 1rem; color: var(--text-sub); flex: 1; flex-wrap:wrap; }
  .eta-row-seq { display: inline-block; min-width: 40px; font-weight: 900; color: var(--text-main); font-size: 1.35rem; line-height: 1; letter-spacing: -0.5px; flex-shrink:0; }
  
  .search-box-container { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 10;}
  .search-input { width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1.3rem; outline: none; text-align: center; background: var(--bg-light); color: var(--text-main); font-weight: 700; }
  .search-input:focus { border-color: var(--theme-color); }
  .region-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
  .region-filters::-webkit-scrollbar { display: none; }
  .region-btn { flex: 0 0 auto; padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-sub); font-size: 1rem; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  .region-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }

  #map-container, #global-map-container { flex: 1; width: 100%; background: #111; z-index: 1; position:relative; }
  #map-container { height: 35vh; flex-shrink: 0; border-bottom: 1px solid var(--border-color); transition: height 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-light); }
  
  .stop-item { position: relative; padding: 24px 16px 24px 50px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
  .stop-line { position: absolute; left: 28px; top: 0; bottom: 0; width: 4px; z-index: 1; }
  .stop-item:first-child .stop-line { top: 34px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 34px; }
  .stop-dot { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: #aaa; border: 4px solid var(--bg-light); z-index: 2; }
  .stop-name { font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
  .nearest-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; background: rgba(10,132,255,0.2); color: var(--accent-blue); border: 1px solid rgba(10,132,255,0.4); vertical-align: middle; text-transform: uppercase; }
  
  .map-bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-white); border-top-left-radius: 20px; border-top-right-radius: 20px; max-height: 70vh; overflow-y: auto; z-index: 1000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); box-shadow: 0 -4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
  .map-bottom-sheet.active { transform: translateY(0); }
  .sheet-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-white); z-index: 2; }
  .sheet-title { font-size: 1.25rem; font-weight: 800; }
  .sheet-close { font-size: 1.5rem; font-weight: bold; color: var(--text-sub); cursor: pointer; background: none; border: none; }
  
  .text-center { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 1.15rem; }
  .init-loader { padding: 80px 20px; text-align: center; }
  .progress-bar { width: 85%; height: 8px; background: #333; margin: 24px auto; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--theme-color); width: 0%; transition: 0.3s; }
  
  .occ-pill { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .occ-seating { background: rgba(48, 209, 88, 0.15); color: var(--accent-green); border: 1px solid rgba(48, 209, 88, 0.3); }
  .occ-standing { background: rgba(255, 159, 10, 0.15); color: var(--accent-orange); border: 1px solid rgba(255, 159, 10, 0.3); }
  .occ-crowded { background: rgba(255, 69, 58, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 69, 58, 0.3); }
  .occ-full { background: rgba(227, 24, 55, 0.15); color: var(--kmb-red); border: 1px solid rgba(227, 24, 55, 0.3); }
  .occ-neutral { background: rgba(148, 163, 184, 0.15); color: var(--text-sub); border: 1px solid rgba(148, 163, 184, 0.3); }

  .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  .custom-user-icon div { width: 100% !important; height: 100% !important; background: var(--theme-color) !important; border-radius: 50% !important; border: 3px solid white !important; box-shadow: 0 0 12px rgba(0,0,0,0.8) !important; }
</style>
</head>
<body>

<header class="header" id="mainHeader">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Pulse HK</h1>
  <button class="text-size-btn" onclick="toggleTextSize()">aA</button>
</header>

<main id="view-main" class="view-container active">
  <div class="location-header">
    <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size: 1.6rem;">📍</span>
        <div class="location-text" id="mainLocationText">Locating nearest stop...</div>
    </div>
    <div class="refresh-timer" id="refreshTimerMain">--</div>
  </div>
  <div id="mainRouteList">
      <div class="init-loader">
          <div id="loadText" style="font-size:1.2rem; color:var(--text-main); font-weight: 700;">Connecting to Transit Networks...</div>
          <div class="progress-bar"><div class="progress-fill" id="loadBar"></div></div>
      </div>
  </div>
</main>

<main id="view-search" class="view-container">
  <div class="search-box-container">
   <div class="region-filters">
        <button class="region-btn active" id="filter-ALL" onclick="setRegionFilter('ALL')">All Transit</button>
        <button class="region-btn" id="filter-BUS" onclick="setRegionFilter('BUS')">Buses</button>
        <button class="region-btn" id="filter-MTR" onclick="setRegionFilter('MTR')">MTR</button>
        <button class="region-btn" id="filter-FERRY" onclick="setRegionFilter('FERRY')">Ferries</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search Route or Line" oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<main id="view-map" class="view-container">
    <div id="global-map-container"></div>
    <div id="map-bottom-sheet" class="map-bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-title" id="sheet-title">Stop Name</div>
            <button class="sheet-close" onclick="closeMapSheet()">✕</button>
        </div>
        <div id="sheet-route-list"></div>
    </div>
</main>

<main id="view-fav" class="view-container">
  <div class="location-header" style="justify-content:center;">
      <div class="location-text">Favorite Routes</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div class="detail-live-bar" id="detailLiveBar">
    <span class="live-dot-pulse">● LIVE TRACKER</span>
    <span id="detailLastUpdated">Loading...</span>
  </div>
  <div id="stop-list-container"></div>
</main>

<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main"><span class="tab-icon">📍</span><span>Nearby</span></div>
  <div class="tab" onclick="switchTab('search')" id="tab-search"><span class="tab-icon">🚇</span><span>Routes</span></div>
  <div class="tab" onclick="switchTab('map')" id="tab-map"><span class="tab-icon">🗺️</span><span>Map</span></div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav"><span class="tab-icon">⭐</span><span>Favorites</span></div>
</nav>

<script src="leaflet.js"></script>

function cleanStopName(name) { return name ? name.replace(/\s*[\(（][^\)）]*[\)）]/g, '').trim() : ''; }
function formatStopName(name) { return name ? name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ') : ''; }

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  if (lat1 === 0 || lat2 === 0) return Infinity;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function fetchJSONCached(url) {
    if (requestCache.has(url)) return requestCache.get(url);
    const promise = new Promise(async (resolve) => {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) resolve(null);
            else resolve(await response.json());
        } catch(e) { resolve(null); }
    });
    requestCache.set(url, promise);
    setTimeout(() => requestCache.delete(url), 2000); 
    return promise;
}

async function initApp() {
  try {
    const fill = document.getElementById('loadBar');
    const txt = document.getElementById('loadText');
    
    // 1. Load Bus Data
    txt.innerText = "Loading Bus Network...";
    fill.style.width = "30%";
    const res = await fetch('bus_index.min.json', { cache: 'default' });
    if (res.ok) {
        const busDb = await res.json();
        busDb.groupedRoutes.forEach(r => {
            r.mode = 'bus';
            if(r.company==='KMB') r.colorHex='#e31837';
            else if(r.company==='CTB') r.colorHex='#facc15';
            else if(r.company==='NLB') r.colorHex='#14b8a6';
            else if(r.company==='LWB') r.colorHex='#f97316';
            else if(r.company==='GMB') r.colorHex='#22c55e';
            groupedRoutes.push(r);
        });
        Object.keys(busDb.routeStopsCache).forEach(k => routeStopsCache[k] = busDb.routeStopsCache[k]);
    }

    // 2. Build MTR Data
    txt.innerText = "Loading MTR Network...";
    fill.style.width = "60%";
    Object.keys(HR_ROUTES).forEach(hrKey => {
        const meta = LINE_META[hrKey];
        groupedRoutes.push({ key: hrKey, routeNo: hrKey.replace('EAL_', 'EAL ').replace('TKL_', 'TKL '), dest_e: meta.name, company: 'MTR Heavy Rail', network: meta.network, colorHex: meta.colorHex, mode: 'mtr' });
        routeStopsCache[hrKey] = HR_ROUTES[hrKey].map((code, idx) => {
            const s = RAW_HR_STATIONS.find(stn => stn.code === code);
            return s ? { ...s, stopName_e: s.name, latitude: s.lat, longitude: s.lng, seq: idx + 1, isTerminal: (idx===0 || idx===HR_ROUTES[hrKey].length-1) } : null;
        }).filter(Boolean);
    });
    Object.keys(LR_ROUTES).forEach(lrKey => {
        const meta = LINE_META[lrKey];
        groupedRoutes.push({ key: lrKey, routeNo: lrKey.replace('LR_', ''), dest_e: meta.name, company: 'MTR Light Rail', network: meta.network, colorHex: meta.colorHex, mode: 'mtr' });
        routeStopsCache[lrKey] = LR_ROUTES[lrKey].map((code, idx) => {
            const s = LR_STOPS_DICT[code];
            return s ? { code: code, stopName_e: s.name, latitude: s.lat, longitude: s.lng, seq: idx + 1, isTerminal: s.isTerminal } : null;
        }).filter(Boolean);
    });

    // 3. Build Ferry Data
    txt.innerText = "Loading Ferry Network...";
    fill.style.width = "90%";
    for (const [key, data] of Object.entries(window.PulseFerry.scheduleData)) {
        groupedRoutes.push({ key: key, routeNo: data.name, dest_e: data.name, company: data.operator, network: data.category, colorHex: data.category==='islands'?'#0ea5e9':'#0d9488', trips: data.trips, piers: data.piers, mode: 'ferry' });
        let seq = 1;
        routeStopsCache[key] = [];
        if (data.piers) {
            for (const [pKey, pName] of Object.entries(data.piers)) {
                const coords = PIER_COORDS[pName] || {lat: 22.28, lng: 114.16}; 
                routeStopsCache[key].push({ stopKey: pName, stopName_e: pName, latitude: coords.lat, longitude: coords.lng, seq: seq++ });
            }
        }
    }

    // 4. Unify Global Stops Map
    const uniqueStops = new Map();
    groupedRoutes.forEach(g => {
        const ids = g.mode === 'bus' ? g.routeIds : [g.key];
        ids.forEach(id => {
            (routeStopsCache[id] || []).forEach(s => {
                const lat = parseFloat(s.latitude || s.lat || 0);
                const lon = parseFloat(s.longitude || s.lng || 0);
                let rawKey = g.mode === 'bus' ? `${s.stopName_e}_${lat.toFixed(3)}` : (g.mode === 'mtr' ? `${s.stopName_e}_${lat.toFixed(3)}_${g.network}` : `${s.stopName_e}`);
                const globalKey = `${rawKey}_${g.mode}`;
                
                s.stopKey = globalKey; 
                s.latitude = lat; s.longitude = lon;

                if (!uniqueStops.has(globalKey)) {
                    uniqueStops.set(globalKey, { stopKey: globalKey, stopName_e: s.stopName_e, latitude: lat, longitude: lon, mode: g.mode, network: g.network || g.company, code: s.code, isTerminal: s.isTerminal, routes: new Set([g.key]) });
                } else {
                    uniqueStops.get(globalKey).routes.add(g.key);
                }
            });
        });
    });
    allStops = Array.from(uniqueStops.values());

    initDetailMap(); 
    initGlobalMap();
    await locateNearestStopPromise();
    startTimer();
  } catch (err) {
    document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="color:#ef4444;">Error building unified network.</div>';
    console.error(err);
  }
}

async function fetchAllEtaRaw(group, stopKey) {
    if (group.mode === 'bus') return await fetchBusEtaRaw(group, stopKey);
    if (group.mode === 'mtr') return await fetchMtrEtaRaw(group, stopKey);
    if (group.mode === 'ferry') return await fetchFerryEtaRaw(group, stopKey);
    return [];
}

async function fetchBusEtaRaw(group, stopKeyToMatch) {
    let rawETAs = [];
    const now = Date.now();
    await Promise.all(group.routeIds.map(async (rId) => {
        try {
            const stops = routeStopsCache[rId] || [];
            const tIndex = stops.findIndex(s => s.stopKey === stopKeyToMatch);
            if (tIndex === -1) return;
            
            const targets = [];
            for(let i=0; i<=4; i++){
                if (tIndex + i < stops.length && stops[tIndex + i]) targets.push({ stop: stops[tIndex + i], offset: i });
            }
            
            await Promise.all(targets.map(async ({ stop, offset }) => {
                if (!stop || !stop.stopId) return;
                const addEta = (etaStr, noGPS) => {
                    if (!etaStr) return;
                    rawETAs.push({ estimatedArrivalTime: etaStr.replace('T', ' ').substring(0, 19), noGPS: noGPS, offset: offset });
                };

                if (rId.startsWith('KMB_') || rId.startsWith('LWB_')) {
                    const parts = rId.split('_');
                    const res = await fetchJSONCached(`${KMB_API_BASE}/eta/${stop.stopId}/${parts[1]}/${parts[3]}`);
                    if(res && res.data) res.data.filter(e => e.dir === parts[2] && e.eta).forEach(e => addEta(e.eta, (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0));
                } else if (rId.startsWith('NLB_')) {
                    const res = await fetchJSONCached(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rId.replace('NLB_','')}&stopId=${stop.stopId}&language=en`);
                    if(res && res.estimatedArrivals) res.estimatedArrivals.forEach(arr => addEta(arr.estimatedArrivalTime, arr.noGPS));
                } else if (rId.startsWith('CTB_')) {
                    const routeNo = rId.split('_')[1];
                    const [resCTB, resNWFB] = await Promise.all([ fetchJSONCached(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stop.stopId}/${routeNo}`), fetchJSONCached(`https://rt.data.gov.hk/v2/transport/citybus/eta/NWFB/${stop.stopId}/${routeNo}`) ]);
                    [resCTB, resNWFB].forEach(res => { if(res && res.data) res.data.forEach(e => { if(e.eta) addEta(e.eta, (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0); }); });
                } else if (rId.startsWith('GMB_')) {
                    const parts = rId.split('_');
                    const res = await fetchJSONCached(`https://data.etagmb.gov.hk/eta/stop/${stop.stopId}`);
                    if(res && res.data) {
                        const tgt = res.data.find(d => String(d.route_id) === parts[1] && String(d.route_seq) === parts[2]);
                        if (tgt && tgt.eta) tgt.eta.forEach(e => { if(e.timestamp) addEta(e.timestamp, 0); });
                    }
                }
            }));
        } catch(e) { }
    }));
    
    let currETAs = [], futureETAs = [];
    rawETAs.forEach(e => {
        const arrTime = new Date(e.estimatedArrivalTime.replace(/-/g, '/')).getTime();
        if (!isNaN(arrTime) && arrTime > now - 15000) {
            e.targetMs = arrTime;
            if (e.offset === 0) currETAs.push(e); else futureETAs.push(e);
        }
    });

    let leftBuses = [];
    futureETAs.forEach(fEta => {
        const diffMins = (fEta.targetMs - now) / 60000;
        const assumedTravelTime = fEta.offset * 2.5; 
        if (diffMins <= assumedTravelTime + 1.5) { 
            const isStillComing = currETAs.some(cEta => cEta.targetMs < fEta.targetMs + 60000 && cEta.targetMs > fEta.targetMs - (fEta.offset * 5 * 60000));
            if (!isStillComing) leftBuses.push({ ...fEta, isLeft: true, minsAgo: Math.max(0, assumedTravelTime - diffMins), sortTimeMs: now - (Math.max(0, assumedTravelTime - diffMins) * 60000) });
        }
    });

    leftBuses.sort((a,b) => a.minsAgo - b.minsAgo);
    let uniqueLeft = leftBuses.length > 0 ? [leftBuses[0]] : [];
    currETAs.forEach(e => { e.sortTimeMs = e.targetMs; e.isLeft = false; });
    
    let uniqueCombined = [], seenMins = new Set();
    [...uniqueLeft, ...currETAs].sort((a,b) => a.sortTimeMs - b.sortTimeMs).forEach(arr => {
         const key = `${Math.floor(arr.sortTimeMs / 60000)}_${arr.isLeft}`;
         if (!seenMins.has(key)) { seenMins.add(key); uniqueCombined.push(arr); }
    });
    return uniqueCombined;
}

async function fetchMtrEtaRaw(group, stopKey) {
    const stn = allStops.find(s => s.stopKey === stopKey && s.routes.has(group.key));
    if(!stn) return [];
    let results = [];
    const currentHour = new Date().getHours();
    const currentIdx = routeStopsCache[group.key].findIndex(s => s.code === stn.code);

    try {
        if (group.network === 'HR') {
            const apiLineCode = LINE_META[group.key].apiCode || group.key; 
            const res = await fetchJSONCached(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${apiLineCode}&sta=${stn.code}`);
            if(res && res.status === 1 && res.data && res.data[`${apiLineCode}-${stn.code}`]) {
                const data = res.data[`${apiLineCode}-${stn.code}`];
                const validDests = routeStopsCache[group.key].map(s => s.code);
                
                const processDir = (trainsArray) => {
                    (trainsArray || []).forEach((t, i) => {
                        if (!validDests.includes(t.dest) && t.dest !== 'ADM') return;
                        if (t.dest === 'LMC' && group.key === 'EAL_LW') return;
                        if (t.dest === 'LOW' && group.key === 'EAL_LMC') return;
                        if (t.dest === 'LHP' && group.key === 'TKL_POA') return;
                        if (t.dest === 'POA' && group.key === 'TKL_LHP') return;

                        const destObj = RAW_HR_STATIONS.find(s => s.code === t.dest);
                        const ttnt = parseInt(t.ttnt) || 0;
                        let load = 30; // Stubbed Load
                        let targetAbsoluteMs = Date.now();
                        if (t.ttnt === "0" || t.ttnt === "-") targetAbsoluteMs = Date.now() + 15000;
                        else {
                            let addSecs = (t.time && t.time.includes(':')) ? Math.floor((Math.max(0, new Date(t.time.replace(/-/g, '/')).getTime() - Date.now()) % 60000) / 1000) : Math.floor(Math.random() * 45); 
                            targetAbsoluteMs = Date.now() + (ttnt * 60000) + (addSecs * 1000);
                        }
                        results.push({ destName: `To ${destObj ? destObj.name : t.dest}`, targetAbsoluteMs, platText: `Plat ${t.plat}`, isScheduled: false });
                    });
                };
                processDir(data.UP); processDir(data.DOWN);
            }
        } else {
            const res = await fetchJSONCached(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${parseInt(stn.code, 10)}`);
            if(res && res.status === 1 && res.platform_list) {
                res.platform_list.forEach(plat => {
                    (plat.route_list || []).forEach((t) => {
                        if (t.route_no.trim() !== group.routeNo) return;
                        const timeStr = t.time_en ? t.time_en.trim().toLowerCase() : '';
                        let targetAbsoluteMs = Date.now();
                        if (timeStr === '-' || timeStr === 'arriving') targetAbsoluteMs = Date.now() + 15000;
                        else {
                            const m = timeStr.match(/\d+/);
                            if(m) targetAbsoluteMs = Date.now() + (parseInt(m[0], 10) * 60000) + (Math.floor(Math.random() * 60) * 1000);
                        }
                        results.push({ destName: `To ${t.dest_en}`, targetAbsoluteMs, platText: `Plat ${plat.platform_id}`, carInfo: (t.train_length==="2"||t.train_length===2)?'2-Car':'1-Car', isScheduled: false });
                    });
                });
            }
        }
    } catch(e) {}
    results.forEach(e => { e.sortTimeMs = e.targetAbsoluteMs; });
    return results.sort((a,b) => a.sortTimeMs - b.sortTimeMs);
}

async function fetchFerryEtaRaw(group, stopKey) {
    let matchingPierKey = null;
    for (const [k, v] of Object.entries(group.piers)) { if (v === stopKey.split('_')[0]) { matchingPierKey = k; break; } }
    if (!matchingPierKey) return [];

    const now = new Date();
    const isWeekend = now.getDay() === 0 || now.getDay() === 6;
    const deps = [];
    
    group.trips.forEach(trip => {
        if (trip.weekdayOnly && isWeekend) return;
        if (trip.weekendOnly && !isWeekend) return;
        const stops = trip.stops;
        if (!stops || stops.length === 0) return;
        
        const pierIndex = stops.findIndex(s => s.p === matchingPierKey);
        if (pierIndex !== -1 && pierIndex < stops.length - 1) {
            const currentStop = stops[pierIndex];
            const finalStop = stops[stops.length - 1];
            
            let targetDate = new Date();
            const parts = currentStop.t.split(':');
            targetDate.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
            if (Date.now() - targetDate.getTime() > 12 * 3600000) targetDate.setDate(targetDate.getDate() + 1);
            else if (targetDate.getTime() - Date.now() > 20 * 3600000) targetDate.setDate(targetDate.getDate() - 1);
            
            const diffMinutes = Math.floor((targetDate.getTime() - now.getTime()) / 60000);
            if (diffMinutes >= -15 && diffMinutes < 1440) {
                deps.push({
                    destName: group.piers[finalStop.p] || finalStop.p,
                    etaDestTime: finalStop.t,
                    mins: diffMinutes,
                    targetAbsoluteMs: targetDate.getTime(),
                    sortTimeMs: targetDate.getTime(),
                    apiStr: currentStop.t,
                    vesselType: trip.vesselType || 'ordinary'
                });
            }
        }
    });
    return deps.sort((a,b) => a.sortTimeMs - b.sortTimeMs);
}

function getSummaryHtml(arrs, mode) {
    if (arrs.length === 0) return { html: `<div class="eta-time" style="color:var(--text-sub)">--</div>`, class: 'inactive-route' };
    
    if (mode === 'bus') {
        let upcoming = arrs.filter(a => !a.isLeft);
        if (upcoming.length > 0) {
            const apiDiffMs = Math.max(0, upcoming[0].targetMs - Date.now());
            let m = Math.floor(apiDiffMs / 60000);
            return { html: `<div class="eta-time" style="color:${(upcoming[0].noGPS===1||upcoming[0].noGPS==='1')?'var(--accent-orange)':'var(--accent-green)'}">${m===0?'Due':`${m}<span style="font-size:1.1rem; margin-left:2px;">m</span>`}</div>`, class: '' };
        } else if (arrs.length > 0 && arrs[0].isLeft) {
            let m = Math.floor(arrs[0].minsAgo); let s = Math.floor((arrs[0].minsAgo % 1) * 60);
            return { html: `<div class="eta-time" style="color:var(--text-sub); font-size:1.4rem; font-weight:900;">-${m>0?`${m}m ${s}s`:`${s}s`}</div>`, class: 'inactive-route' };
        }
    } else if (mode === 'mtr') {
        const diffMs = Math.max(0, arrs[0].targetAbsoluteMs - Date.now());
        let m = Math.floor(diffMs / 60000);
        return { html: `<div class="eta-time live-summary" style="color:${arrs[0].isScheduled?'var(--accent-orange)':'var(--accent-green)'}">${m===0?'Due':`${m}<span style="font-size:1.1rem; margin-left:2px;">m</span>`}</div>`, class: '' };
    } else if (mode === 'ferry') {
        const diffMs = Math.max(0, arrs[0].targetAbsoluteMs - Date.now());
        let m = Math.floor(diffMs / 60000);
        return { html: `<div class="eta-time live-summary" style="color:var(--accent-green)">${m===0?'Due':`${m}<span style="font-size:1.1rem; margin-left:2px;">m</span>`}</div>`, class: '' };
    }
    return { html: `<div class="eta-time" style="color:var(--text-sub)">--</div>`, class: 'inactive-route' };
}

function generateExpandedHtml(arrs, group, stopKey) {
    if (arrs.length === 0) return '<div style="color:var(--text-sub); text-align:center; padding: 20px;">No departures available.</div>';
    let html = '';
    
    if (group.mode === 'bus') {
        const stops = routeStopsCache[group.key] || [];
        const stopIdx = stops.findIndex(s => s.stopKey === stopKey);
        let occAssigned = false;
        
        for(let i = 0; i < Math.min(4, arrs.length); i++) {
            const arr = arrs[i];
            let mainStr = '', subStr = '', color = '', occBadge = '';
            
            if (arr.isLeft) {
                let m = Math.floor(arr.minsAgo), s = Math.floor((arr.minsAgo % 1) * 60);
                const diff = Math.max(0, arr.targetMs - Date.now());
                occBadge = `<span style="font-size:1.6rem; font-weight:900; color:var(--text-sub);">-${m>0?`${m}m ${s}s`:`${s}s`}</span>`;
                mainStr = `<span style="opacity:0;">--</span>`; 
                subStr = `Live Tracker (+${arr.offset} stop): ${Math.floor(diff/60000)}m ${Math.floor((diff%60000)/1000)}s`;
                color = 'var(--text-sub)';
            } else {
                const diff = Math.max(0, arr.targetMs - Date.now());
                let m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
                let isSched = (arr.noGPS === 1 || arr.noGPS === '1');
                color = isSched ? 'var(--accent-orange)' : 'var(--accent-green)'; 
                mainStr = (m === 0 && s <= 45) ? 'Due' : `${Math.max(1, m)} <span style="font-size:1.2rem; font-weight:700;">m</span>`;
                subStr = `Live Tracker (Stop): ${m>0?`${m}m ${s}s`:`${s}s`}`;
                
                if (!occAssigned && m <= 25) {
                    const pct = Math.floor(Math.random() * 100); // Stub for bus occupancy
                    let cls = pct>=90?'occ-full':(pct>=70?'occ-crowded':(pct>=45?'occ-standing':'occ-seating'));
                    let txt = pct>=90?'FULL':(pct>=70?'CROWDED':(pct>=45?'STAND':'SEATS'));
                    occBadge = `<span class="occ-pill ${cls}">${txt}</span>`;
                    occAssigned = true; 
                }
            }
            html += `<div class="eta-row"><div class="eta-row-left"><span class="eta-row-seq">${group.routeNo}</span>${occBadge}</div><div class="eta-row-time" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;"><div style="color:${color};">${mainStr}</div><div style="font-size:0.75rem; font-weight:700; color:var(--text-sub); margin-top:4px;">${subStr}</div></div></div>`;
        }
    } else if (group.mode === 'mtr') {
        for(let i = 0; i < Math.min(4, arrs.length); i++) {
            const arr = arrs[i];
            let color = arr.isScheduled ? 'var(--accent-orange)' : 'var(--accent-green)';
            const diff = Math.max(0, arr.targetAbsoluteMs - Date.now());
            let m = Math.floor(diff / 60000);
            html += `<div class="eta-row"><div class="eta-row-left"><span>${arr.destName}</span><div style="font-size: 0.85rem; color: var(--text-sub); font-weight: 600; display: flex; gap: 8px; align-items: center;"><span>${arr.platText}</span>${arr.carInfo?`<span class="occ-pill" style="background:rgba(148, 163, 184, 0.15); border:1px solid rgba(148, 163, 184, 0.3); color:var(--text-sub);">${arr.carInfo}</span>`:''}</div></div><div class="eta-row-time" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;"><div style="color:${color}; font-size:1.8rem;">${m===0?'Due':`${m}m`}</div></div></div>`;
        }
    } else if (group.mode === 'ferry') {
        for(let i = 0; i < Math.min(4, arrs.length); i++) {
            const arr = arrs[i];
            let badge = arr.vesselType==='fast'?`<span class="occ-pill" style="background:rgba(14, 165, 233, 0.15); color:var(--accent-blue); border:1px solid rgba(14, 165, 233, 0.3);">⚡ Fast</span>`:`<span class="occ-pill" style="background:rgba(245, 158, 11, 0.15); color:var(--accent-orange); border:1px solid rgba(245, 158, 11, 0.3);">⛴️ Ordinary</span>`;
            let color = arr.mins <= 0 ? 'var(--accent-orange)' : 'var(--accent-green)';
            let timeLabel = arr.mins <= 0 ? (arr.mins<0?'Departed':'Boarding') : `${arr.mins}m`;
            html += `<div class="eta-row"><div class="eta-row-left"><span>To ${arr.destName}</span><div style="font-size: 0.85rem; color: var(--text-sub); font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">${badge}</div></div><div class="eta-row-time" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;"><div style="color:${color}; font-size:1.5rem;">${timeLabel}</div><div style="font-size:0.8rem; font-weight:800; color:var(--text-main); margin-top:4px;">Dep. ${arr.apiStr}</div></div></div>`;
        }
    }
    return html;
}

function makeUserIcon() { return L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] }); }
function updateUserMarkers() {
    if (!lastKnownPos) return;
    const icon = makeUserIcon();
    if (mapInstance) { if (!userMarkerDetail) userMarkerDetail = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(mapInstance); else userMarkerDetail.setLatLng([lastKnownPos.lat, lastKnownPos.lon]); }
    if (globalMapInstance) { if (!userMarkerGlobal) userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(globalMapInstance); else userMarkerGlobal.setLatLng([lastKnownPos.lat, lastKnownPos.lon]); }
}
function startGPSTracking() {
    if (!navigator.geolocation || gpsWatcherId) return;
    gpsWatcherId = navigator.geolocation.watchPosition((pos) => { lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude }; updateUserMarkers(); }, () => {}, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
}
function refreshGPS(timeoutMs = 4000) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(lastKnownPos);
        navigator.geolocation.getCurrentPosition((pos) => { lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude }; updateUserMarkers(); resolve(lastKnownPos); }, () => resolve(lastKnownPos), { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 10000 });
    });
}
function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) { document.getElementById('mainLocationText').innerText = 'GPS Not Supported'; renderMainNearby(); return resolve(false); }
        document.getElementById('mainLocationText').innerText = 'Locating...';
        navigator.geolocation.getCurrentPosition((pos) => {
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude }; updateUserMarkers();
            let closest = null, minDistance = Infinity;
            allStops.forEach(s => { const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude)); if (d < minDistance) { minDistance = d; closest = s; } });
            if (closest) {
                currentNearestStopKey = closest.stopKey;
                document.getElementById('mainLocationText').innerText = closest.stopName_e;
                renderMainNearby(); if (currentView === 'map' && globalMapInstance) renderGlobalMapStops(); if (currentView === 'search') renderSearchResults();
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby stops mapped'; document.getElementById('mainRouteList').innerHTML = '';
            }
            startGPSTracking(); resolve(true);
        }, () => { document.getElementById('mainLocationText').innerText = 'Location Access Denied'; renderMainNearby(); resolve(false); }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 });
    });
}

function drawRouteOnMap(group) {
    if(!mapInstance) return;
    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    let stops = [];
    if (group.mode === 'bus') stops = routeStopsCache[group.routeIds[0]] || [];
    else stops = routeStopsCache[group.key] || [];
    
    stops = stops.filter(s => s.latitude !== '0' && s.longitude !== '0');
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: group.colorHex, weight: 6, opacity: 0.9}).addTo(mapInstance);
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        marker.on('click', () => { expandStop(idx); document.getElementById(`stop-item-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' }); });
        mapMarkers.push(marker);
    });
    
    const bounds = mapRouteLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) { bounds.extend(userMarkerDetail.getLatLng()); }
    mapInstance.fitBounds(bounds, { padding: [40, 40] });
}

function renderGlobalMapStops() {
    if (!globalMapInstance || !lastKnownPos) return;
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];
    const bounds = globalMapInstance.getBounds();
    const currentZoom = globalMapInstance.getZoom();

    let nearby = allStops.filter(s => s.latitude !== '0' && bounds.contains([parseFloat(s.latitude), parseFloat(s.longitude)]));
    if (currentZoom < 13) { nearby = nearby.filter(s => s.mode !== 'bus' && s.mode !== 'ferry'); } // Show only MTR when zoomed out

    nearby.forEach(s => {
        const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: `<div style="width:16px;height:16px;background:white;border:4px solid ${s.mode==='ferry'?'#0ea5e9':(s.mode==='mtr'?'#eab308':'var(--kmb-red)')};border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.5);"></div>`, iconSize: [16, 16] });
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(globalMapInstance);
        marker.on('click', () => { globalMapInstance.setView(marker.getLatLng(), Math.max(currentZoom, 15), { animate: true }); openMapSheet(s); });
        globalMarkers.push(marker);
    });
}

function switchTab(tabId) {
    if (tabId === 'main') { mainExpandedGroupKey = null; document.getElementById('mainLocationText').innerText = 'Locating...'; locateNearestStopPromise(); }
    currentView = tabId; detailRouteGroup = null; detailOpenToken++; 
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`view-${tabId}`).classList.add('active'); document.getElementById(`tab-${tabId}`).classList.add('active');
    document.getElementById('backBtn').style.display = 'none'; document.getElementById('headerTitle').innerText = 'Pulse HK';
    if (tabId === 'search') renderSearchResults();
    if (tabId === 'fav') renderFavList();
    if (tabId === 'map') { closeMapSheet(); if (!globalMapInstance) { initGlobalMap(); locateNearestStopPromise().then(() => { renderGlobalMapStops(); }); } else { globalMapInstance.invalidateSize(); renderGlobalMapStops(); } }
}

async function autoSelectNearestStop(token) {
    let stops = [];
    if (detailRouteGroup.mode === 'bus') stops = routeStopsCache[detailRouteGroup.routeIds[0]] || [];
    else stops = routeStopsCache[detailRouteGroup.key] || [];
    
    if (stops.length === 0) return;
    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);
    if (token !== detailOpenToken) return;

    let bestIdx = 0; 
    if (pos) { let foundIdx = findNearestStopIdx(stops, pos); if (foundIdx !== -1) bestIdx = foundIdx; }
    const nameEl = document.querySelector(`#stop-item-${bestIdx} .stop-name`);
    if (nameEl && pos && stops[bestIdx].latitude !== '0') nameEl.insertAdjacentHTML('beforeend', `<span class="nearest-tag">Nearest GPS</span>`);
    await expandStop(bestIdx, true);
}

function openRouteDetail(groupKey) {

    setTimeout(async () => { if (token !== detailOpenToken) return; if(mapInstance) mapInstance.invalidateSize(); drawRouteOnMap(group); renderStopList(); await autoSelectNearestStop(token); }, 100);
}

function navigateBack() { switchTab(previousView); }

function openMapSheet(stopObj) {
    document.getElementById('map-bottom-sheet').classList.add('active');
    document.getElementById('sheet-title').innerText = stopObj.stopName_e;
    let relevantGroups = [];
    stopObj.routes.forEach(groupKey => { const group = groupedRoutes.find(g => g.key === groupKey); if (group) relevantGroups.push(group); });
    const listEl = document.getElementById('sheet-route-list'); listEl.innerHTML = '<div class="text-center">Loading schedules...</div>';
    
    Promise.all(relevantGroups.map(async g => {
        const arrs = await fetchAllEtaRaw(g, stopObj.stopKey);
        let firstEta = Infinity;
        if (arrs.length > 0) firstEta = (g.mode === 'bus' ? (arrs.filter(a=>!a.isLeft)[0]?.targetMs || 99999999999999) : (arrs[0].targetAbsoluteMs || arrs[0].targetMs || Infinity));
        return { group: g, arrs, firstEta };
    })).then(groupsWithEtas => {
        groupsWithEtas.sort((a,b) => a.firstEta - b.firstEta);
        let html = '';
        groupsWithEtas.forEach(item => {
            const g = item.group; const arrs = item.arrs;
            const summary = getSummaryHtml(arrs, g.mode);
            html += `
              <div class="route-list-item ${summary.class}" onclick="toggleSheetEta('${g.key}', '${stopObj.stopKey}')" id="sheet-item-${g.key}">
                  <div class="route-no-col ${g.mode==='bus'?'bus-mode':''}" style="background-color:${g.colorHex};">${g.mode!=='bus'?`<div>${g.network.substring(0,3).toUpperCase()}</div>`:g.routeNo}</div>
                  <div class="route-info-col"><div class="route-dest">${g.mode==='bus'?'To ':''}${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
                  <div class="route-eta-col" id="sheet-eta-summary-${g.key}">${summary.html}</div>
              </div>
              <div class="eta-expanded-container" id="sheet-eta-expanded-${g.key}"></div>
            `;
        });
        listEl.innerHTML = html || '<div class="text-center">No routes available</div>';
    });
}

function closeMapSheet() { document.getElementById('map-bottom-sheet').classList.remove('active'); sheetExpandedGroupKey = null; }

async function toggleSheetEta(groupKey, stopKey) {
    const expandContainer = document.getElementById(`sheet-eta-expanded-${groupKey}`);
    if (!expandContainer) return;
    if (sheetExpandedGroupKey === groupKey) { expandContainer.classList.remove('active'); sheetExpandedGroupKey = null; } 
    else {
        if (sheetExpandedGroupKey) { const prev = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`); if (prev) prev.classList.remove('active'); }
        sheetExpandedGroupKey = groupKey; expandContainer.classList.add('active');
        expandContainer.innerHTML = '<div style="color:var(--text-sub); padding: 20px; text-align:center;">Loading...</div>';
        const group = groupedRoutes.find(g => g.key === groupKey);
        if(group) { const arrs = await fetchAllEtaRaw(group, stopKey); expandContainer.innerHTML = generateExpandedHtml(arrs, group, stopKey); }
    }
}

async function renderMainNearby(isSilentRefresh = false) {
    const listEl = document.getElementById('mainRouteList');
    if (!currentNearestStopKey) { if (!isSilentRefresh) listEl.innerHTML = '<div class="text-center">Locating...</div>'; return; }
    const stopObj = allStops.find(s => s.stopKey === currentNearestStopKey);
    if (!stopObj) return;

    let relevantGroups = [];
    stopObj.routes.forEach(groupKey => { const group = groupedRoutes.find(g => g.key === groupKey); if (group) relevantGroups.push(group); });
    if (!isSilentRefresh) listEl.innerHTML = '<div class="init-loader"><div style="font-size:1.2rem; color:var(--text-main); font-weight:700;">Fetching live times...</div></div>';

    let groupsWithEtas = await Promise.all(relevantGroups.map(async g => {
        const arrs = await fetchAllEtaRaw(g, currentNearestStopKey);
        let firstEta = Infinity;
        if (arrs.length > 0) firstEta = (g.mode === 'bus' ? (arrs.filter(a=>!a.isLeft)[0]?.targetMs || 99999999999999) : (arrs[0].targetAbsoluteMs || arrs[0].targetMs || Infinity));
        return { group: g, arrs, firstEta };
    }));

    groupsWithEtas.sort((a,b) => a.firstEta - b.firstEta);
    let html = '';
    groupsWithEtas.forEach(item => {
        const g = item.group; const arrs = item.arrs;
        const summary = getSummaryHtml(arrs, g.mode);
        const isExpanded = (mainExpandedGroupKey === g.key);

        html += `
          <div class="route-list-item ${summary.class}" onclick="toggleMainEta('${g.key}')" id="main-item-${g.key}">
              <div class="route-no-col ${g.mode==='bus'?'bus-mode':''}" style="background-color:${g.colorHex};">${g.mode!=='bus'?`<div>${g.network.substring(0,3).toUpperCase()}</div>`:g.routeNo}</div>
              <div class="route-info-col"><div class="route-dest">${g.mode==='bus'?'To ':''}${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
              <div class="route-eta-col" id="main-eta-summary-${g.key}">${summary.html}</div>
          </div>
          <div class="eta-expanded-container ${isExpanded ? 'active' : ''}" id="main-eta-expanded-${g.key}">
        `;
        if (isExpanded) html += generateExpandedHtml(arrs, g, currentNearestStopKey);
        html += `</div>`;
    });
    listEl.innerHTML = html || '<div class="text-center">No routes found for this stop.</div>';
}

async function toggleMainEta(groupKey) {
    if (mainExpandedGroupKey === groupKey) { document.getElementById(`main-eta-expanded-${groupKey}`).classList.remove('active'); mainExpandedGroupKey = null; } 
    else {
        if (mainExpandedGroupKey) { const prev = document.getElementById(`main-eta-expanded-${mainExpandedGroupKey}`); if (prev) prev.classList.remove('active'); }
        mainExpandedGroupKey = groupKey; const expandContainer = document.getElementById(`main-eta-expanded-${groupKey}`); expandContainer.classList.add('active');
        expandContainer.innerHTML = '<div style="color:var(--text-sub); padding: 20px; text-align:center;">Loading times...</div>';
        const group = groupedRoutes.find(g => g.key === groupKey);
        if(group && currentNearestStopKey) { const arrs = await fetchAllEtaRaw(group, currentNearestStopKey); expandContainer.innerHTML = generateExpandedHtml(arrs, group, currentNearestStopKey); }
    }
}

function setRegionFilter(region) {
    activeRegionFilter = region;
    document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`filter-${region}`).classList.add('active');
    renderSearchResults();
}

function renderSearchResults() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('searchResults');
    
    let matches = groupedRoutes;
    if (activeRegionFilter !== 'ALL') matches = matches.filter(g => g.mode === activeRegionFilter.toLowerCase());
    if (query) matches = matches.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query) || (g.company && g.company.toLowerCase().includes(query)));
    
    if(matches.length === 0) { listEl.innerHTML = '<div class="text-center" style="padding-top:60px; font-size:4rem; opacity:0.2;">🚇</div><div class="text-center">No routes found</div>'; return; }
    
    let html = '';
    matches.slice(0, 100).forEach(g => {
        html += `
          <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
              <div class="route-no-col ${g.mode==='bus'?'bus-mode':''}" style="background-color:${g.colorHex};">${g.mode!=='bus'?`<div>${g.network.substring(0,3).toUpperCase()}</div>`:g.routeNo}</div>
              <div class="route-info-col"><div class="route-dest">${g.mode==='bus'?'To ':''}${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function renderFavList() {
    const listEl = document.getElementById('favList');
    let html = `<div class="add-fav-btn" onclick="openFavModal()">+ Add New Favorite</div>`;
    if(favRoutes.length === 0) { listEl.innerHTML = html + '<div class="text-center">No bookmarks yet.</div>'; return; }
    
    favRoutes.forEach(k => {
        const g = groupedRoutes.find(r => r.key === k);
        if(g) {
            html += `
              <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
                  <div class="route-no-col ${g.mode==='bus'?'bus-mode':''}" style="background-color:${g.colorHex};">${g.mode!=='bus'?`<div>${g.network.substring(0,3).toUpperCase()}</div>`:g.routeNo}</div>
                  <div class="route-info-col"><div class="route-dest">${g.mode==='bus'?'To ':''}${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
                  <button class="del-fav-btn" onclick="event.stopPropagation(); removeFavRoute('${g.key}');">🗑️</button>
              </div>
            `;
        }
    });
    listEl.innerHTML = html;
}

function removeFavRoute(key) { favRoutes = favRoutes.filter(k => k !== key); localStorage.setItem('pulse_fav_routes_v1', JSON.stringify(favRoutes)); renderFavList(); }
function openFavModal() { document.getElementById('fav-modal').style.display = 'flex'; document.getElementById('favSearchInput').value = ''; renderFavSearch(); }
function closeFavModal() { document.getElementById('fav-modal').style.display = 'none'; }

function renderFavSearch() {
    const query = document.getElementById('favSearchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('favSearchResults');
    if(!query) { listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">🔍</div><div class="text-center">Type route</div>'; return; }

    const matches = groupedRoutes.filter(g => g.routeNo.toLowerCase().includes(query) || g.dest_e.toLowerCase().includes(query) || (g.company && g.company.toLowerCase().includes(query)));
    if(matches.length === 0) { listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">🚇</div><div class="text-center">No routes found</div>'; return; }
    
    let html = '';
    matches.slice(0, 50).forEach(g => {
        const isSaved = favRoutes.includes(g.key);
        html += `
          <div class="route-list-item" style="opacity: ${isSaved ? '0.5' : '1'}; pointer-events: ${isSaved ? 'none' : 'auto'};" onclick="addFavFromModal('${g.key}')">
              <div class="route-no-col ${g.mode==='bus'?'bus-mode':''}" style="background-color:${g.colorHex};">${g.mode!=='bus'?`<div>${g.network.substring(0,3).toUpperCase()}</div>`:g.routeNo}</div>
              <div class="route-info-col"><div class="route-dest">${g.mode==='bus'?'To ':''}${g.dest_e}</div><div class="route-sub">${g.company} ${isSaved ? '(Saved)' : ''}</div></div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function addFavFromModal(key) { if(!favRoutes.includes(key)) { favRoutes.push(key); localStorage.setItem('pulse_fav_routes_v1', JSON.stringify(favRoutes)); } closeFavModal(); renderFavList(); }

function renderStopList() {
    const listEl = document.getElementById('stop-list-container');
    let stops = [];
    if (detailRouteGroup.mode === 'bus') stops = routeStopsCache[detailRouteGroup.routeIds[0]] || [];
    else stops = routeStopsCache[detailRouteGroup.key] || [];

    let html = '';
    stops.forEach((s, idx) => {
        html += `
            <div class="stop-item" id="stop-item-${idx}" onclick="expandStop(${idx})">
                <div class="stop-line" style="background-color: ${detailRouteGroup.colorHex};"></div>
                <div class="stop-dot" id="stop-dot-${idx}" style="box-shadow: 0 0 0 4px ${detailRouteGroup.colorHex}4D;"></div>
                <div class="stop-name">${idx + 1}. ${s.stopName_e}</div>
                <div class="eta-expanded-container" id="detail-eta-expanded-${idx}" style="margin-top: 20px; border-radius:12px;"></div>
            </div>
        `;
    });
    listEl.innerHTML = html;
}

async function expandStop(idx, forceOpen = false) {
    if (detailExpandedStopIdx === idx && !forceOpen) {
        document.getElementById(`detail-eta-expanded-${idx}`).classList.remove('active');
        document.getElementById(`stop-item-${idx}`).classList.remove('active-stop');
        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] }));
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    if (!item || !expandContainer) return;
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: `<div style="width:20px;height:20px;background:white;border:6px solid ${detailRouteGroup.colorHex};border-radius:50%;"></div>`, iconSize: [20, 20] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (mapInstance && mapMarkers[idx]) mapInstance.setView(mapMarkers[idx].getLatLng(), 16, { animate: true });
    
    let stops = [];
    if (detailRouteGroup.mode === 'bus') stops = routeStopsCache[detailRouteGroup.routeIds[0]] || [];
    else stops = routeStopsCache[detailRouteGroup.key] || [];
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchAllEtaRaw(detailRouteGroup, targetStop.stopKey);
        if (detailExpandedStopIdx !== idx) return; 
        expandContainer.innerHTML = generateExpandedHtml(arrs, detailRouteGroup, targetStop.stopKey);
        updateDetailTimestamp();
    } catch (e) { expandContainer.innerHTML = '<div style="color:var(--kmb-red); text-align:center; padding: 20px;">Network Failed</div>'; }
}

function startTimer() {
  clearInterval(timerInterval); countdown = REFRESH_INTERVAL; document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  timerInterval = setInterval(() => {
    if (isSyncing) return;
    countdown--;
    if (countdown <= 0) {
      isSyncing = true; countdown = REFRESH_INTERVAL; document.getElementById('refreshTimerMain').innerText = '...';
      if (currentView === 'main') { renderMainNearby(true).then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          let stops = [];
          if (detailRouteGroup.mode === 'bus') stops = routeStopsCache[detailRouteGroup.routeIds[0]] || [];
          else stops = routeStopsCache[detailRouteGroup.key] || [];
          const targetStop = stops[detailExpandedStopIdx];
          fetchAllEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              const expandContainer = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
              if(expandContainer) expandContainer.innerHTML = generateExpandedHtml(arrs, detailRouteGroup, targetStop.stopKey);
              updateDetailTimestamp(); isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else if (currentView === 'map' && sheetExpandedGroupKey) {
          const group = groupedRoutes.find(g => g.key === sheetExpandedGroupKey);
          if(group && currentNearestStopKey) {
              fetchAllEtaRaw(group, currentNearestStopKey).then(arrs => {
                 const expandContainer = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
                 if (expandContainer) expandContainer.innerHTML = generateExpandedHtml(arrs, group, currentNearestStopKey);
                 isSyncing = false;
              }).catch(() => { isSyncing = false; });
          } else { isSyncing = false; }
      } else { isSyncing = false; }
    } else { document.getElementById('refreshTimerMain').innerText = `${countdown}s`; }
  }, 1000);
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearInterval(timerInterval); if (gpsWatcherId) { navigator.geolocation.clearWatch(gpsWatcherId); gpsWatcherId = null; } } 
    else if (groupedRoutes.length > 0) { startTimer(); startGPSTracking(); refreshGPS(2000); }
});

window.onload = initApp;
</script>
