<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Pulse</h1>
    <span class="clock" id="liveClock">--:--:--</span>
  </div>
  <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
    <option value="en">EN</option>
    <option value="tc">繁體</option>
    <option value="sc">简体</option>
  </select>
</div>

<div class="stop-header">
  <div class="controls-container">
    <button id="gpsBtn" class="gps-btn" onclick="locateNearestStop(false, false)">📍</button>
    <div class="selectors">
      <select id="routeSelect" class="stop-input" onchange="handleRouteChange(this.value)"></select>
      <select id="stopSelect" class="stop-input" onchange="handleStopChange(this.value)"></select>
    </div>
  </div>
  <div class="status-bar">
    <span class="refresh-timer" id="refreshTimer">Initializing...</span>
    <span class="gps-status" id="gpsStatus"></span>
  </div>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Connecting to network...</div>
</div>

<div id="buildVersion" style="text-align: center; padding: 24px 0 40px; font-size: 0.75rem; color: var(--text-secondary); font-family: monospace;">
  Loading version...
</div>

<script src="app.js?v=1.0.2"></script>
</body>
</html>
