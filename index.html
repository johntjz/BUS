<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransitPulse HK</title>
<style>
  :root {
    --bg-color: #1c1c1e;
    --card-bg: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #8e8e93;
    --accent-red: #e31837;
    --accent-green: #34c759;
    --accent-yellow: #ffcc00;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
  }

  .header {
    background-color: var(--accent-red);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
  
  .live-badge {
    background: rgba(0,0,0,0.2);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  
  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  .stop-header {
    padding: 16px 20px;
    border-bottom: 1px solid #3a3a3c;
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .route-card {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #3a3a3c;
    background-color: transparent;
  }

  .route-no {
    font-size: 1.75rem;
    font-weight: 900;
    width: 65px;
    letter-spacing: -0.5px;
  }

  .route-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .route-dest {
    font-size: 1rem;
    font-weight: 600;
  }

  .route-status {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .route-eta {
    font-size: 1.25rem;
    font-weight: 600;
    text-align: right;
  }
</style>
</head>
<body>

<div class="header">
  <h1>TransitPulse HK</h1>
  <div class="live-badge">LIVE API</div>
</div>

<div class="stop-header">
  📍 Nearest Stop: Lo Uk Tsuen
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);">Initializing API connection...</div>
</div>

<script>
  const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
  const TARGET_STOP_NAME = 'Lo Uk Tsuen';
  
  // Routes visible in the provided UI design
  const TARGET_ROUTES = ['3M', '1', '4', '2']; 
  
  async function fetchJSON(endpoint) {
    const response = await fetch(`${API_BASE}${endpoint}`);
    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
    return await response.json();
  }

  async function initApp() {
    const listEl = document.getElementById('routeList');
    
    try {
      // 1. Fetch Master Route List to get internal 'routeId'
      const routeData = await fetchJSON('/route.php?action=list');
      
      // Filter the global list to only match the routes we care about
      const relevantRoutes = routeData.routes.filter(r => TARGET_ROUTES.includes(r.routeNo));
      
      listEl.innerHTML = ''; // Clear loading state

      // Build UI and trigger concurrent API fetches for each route
      for (const route of relevantRoutes) {
        // Parse destination from "Start > Destination" format
        const destName = route.routeName_e.split('>').pop().trim();
        const cardId = `route-${route.routeId}`;
        
        listEl.insertAdjacentHTML('beforeend', `
          <div class="route-card" id="${cardId}">
            <div class="route-no">${route.routeNo}</div>
            <div class="route-info">
              <div class="route-dest">To ${destName}</div>
              <div class="route-status" id="status-${route.routeId}">Locating API...</div>
            </div>
            <div class="route-eta" id="eta-${route.routeId}">--</div>
          </div>
        `);

        // Trigger step 2 and 3 for this specific route
        resolveStopsAndFetchETA(route);
      }
    } catch (error) {
      listEl.innerHTML = `<div style="padding: 20px; color: #ff453a;">Connection failed: ${error.message}</div>`;
    }
  }

  async function resolveStopsAndFetchETA(route) {
    const statusEl = document.getElementById(`status-${route.routeId}`);
    const etaEl = document.getElementById(`eta-${route.routeId}`);

    try {
      // 2. Fetch all stops for this specific routeId
      const stopData = await fetchJSON(`/stop.php?action=list&routeId=${route.routeId}`);
      
      // Find the specific stop ID for "Lo Uk Tsuen"
      const targetStop = stopData.stops.find(s => 
        s.stopName_e.toLowerCase().includes(TARGET_STOP_NAME.toLowerCase())
      );

      if (!targetStop) {
        statusEl.innerText = 'Stop not serviced on this bound';
        return;
      }
      
      // 3. Fetch the actual Estimated Arrivals using resolved IDs
      const etaData = await fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${route.routeId}&stopId=${targetStop.stopId}&language=en`);
      
      if (etaData.estimatedArrivals && etaData.estimatedArrivals.length > 0) {
        const nextBus = etaData.estimatedArrivals[0];
        
        // Calculate time delta natively (Safari compatible dates)
        const arrivalTime = new Date(nextBus.estimatedArrivalTime.replace(/-/g, '/'));
        const serverTime = new Date(nextBus.generateTime.replace(/-/g, '/'));
        
        const diffMs = arrivalTime - serverTime;
        const diffMins = Math.floor(diffMs / 60000);
        
        if (diffMins <= 0) {
           etaEl.innerText = 'Due';
           etaEl.style.color = 'var(--accent-yellow)';
        } else {
           etaEl.innerText = `${diffMins} min`;
           etaEl.style.color = 'var(--accent-green)';
        }
        statusEl.innerText = `Updated at ${serverTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      } else {
        etaEl.innerText = '--';
        statusEl.innerText = 'No upcoming departures';
      }
    } catch (error) {
      statusEl.innerText = 'ETA temporarily unavailable';
    }
  }

  // Bootstrap application
  initApp();
</script>
</body>
</html>
