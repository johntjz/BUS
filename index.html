<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TransitPulse HK - Smart Engine</title>
<style>
  :root {
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-blue: #0a84ff;
    --accent-yellow: #ffd60a;
    --accent-orange: #ff9f0a;
    --accent-purple: #bf5af2;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background-color: var(--accent-red);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  
  .live-badge {
    background: rgba(0,0,0,0.25);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }
  
  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  .stop-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background-color: var(--bg-color);
    gap: 12px;
    flex-wrap: wrap;
  }

  .controls-container {
    display: flex;
    gap: 10px;
    flex: 1;
    min-width: 260px;
  }

  .gps-btn {
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    width: 48px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  
  .gps-btn:active { background: #3a3a3c; }
  .gps-btn.loading { color: var(--accent-blue); animation: pulse 1s infinite; }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  .selectors {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  select.stop-input {
    background: #2c2c2e;
    color: #fff;
    border: 1px solid #3a3a3c;
    padding: 8px 32px 8px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    outline: none;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989d" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
    background-repeat: no-repeat;
    background-position: right 8px center;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  
  select.stop-input:focus { border-color: var(--accent-blue); }

  .refresh-timer { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; margin-top: 6px; }

  #routeList { display: flex; flex-direction: column; min-height: 50vh; }

  .route-card {
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
    border-bottom: 1px solid var(--card-border);
    background-color: var(--bg-color);
    gap: 12px;
  }

  .card-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .route-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; padding-right: 10px; }
  .route-no { font-size: 1.8rem; font-weight: 900; width: 60px; letter-spacing: -0.5px; flex-shrink: 0; }

  .route-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  
  .dest-wrap { display: flex; align-items: center; flex-wrap: wrap; column-gap: 10px; row-gap: 4px; }
  .route-dest { font-size: 0.95rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  
  .route-status { font-size: 0.75rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .eta-container { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 50px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; }

  .official-eta { font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .smart-eta { font-size: 1.35rem; font-weight: 800; color: var(--accent-green); font-variant-numeric: tabular-nums; }
  .smart-eta.adjusted { color: var(--accent-blue); }

  .compact-occupancy {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.03);
  }

  .bar-segments { display: flex; gap: 2px; }
  .segment { width: 4px; height: 10px; border-radius: 1px; background-color: #2c2c2e; }
  .segment.active-green { background-color: var(--accent-green); }
  .segment.active-orange { background-color: var(--accent-orange); }
  .segment.active-red { background-color: var(--accent-red); }

  .occupancy-pct-text { font-size: 0.7rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
  .inference-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .tag { font-size: 0.68rem; padding: 2px 7px; border-radius: 4px; background: var(--card-bg); border: 1px solid var(--card-border); font-weight: 500; }
  .tag.blue { color: var(--accent-blue); border-color: rgba(10, 132, 255, 0.3); }
  .tag.green { color: var(--accent-green); border-color: rgba(48, 209, 88, 0.3); }
  .tag.orange { color: var(--accent-orange); border-color: rgba(255, 159, 10, 0.3); }
  .tag.yellow { color: var(--accent-yellow); border-color: rgba(255, 214, 10, 0.3); }
  .tag.purple { color: var(--accent-purple); border-color: rgba(191, 90, 242, 0.3); }
</style>
</head>
<body>

<div class="header">
  <h1>TransitPulse HK</h1>
  <div class="live-badge">SMART ENGINE</div>
</div>

<div class="stop-header">
  <div class="controls-container">
    <button id="gpsBtn" class="gps-btn" onclick="locateNearestStop(false)" aria-label="Find nearest stop">📍</button>
    <div class="selectors">
      <select id="routeSelect" class="stop-input" onchange="handleRouteChange(this.value)">
        <option value="ALL">All Lines</option>
      </select>
      <select id="stopSelect" class="stop-input" onchange="handleStopChange(this.value)"></select>
    </div>
  </div>
  <span class="refresh-timer" id="refreshTimer">Initializing...</span>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Fetching transit network framework...</div>
</div>

<script>
  const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
  const REFRESH_INTERVAL = 15; // Increased polling precision
  
  let currentRouteId = 'ALL';
  let currentStopName = '';
  let countdown = REFRESH_INTERVAL;
  let timerInterval;
  
  let allStops = [];
  let allRoutes = [];
  let routeStopsCache = {};
  const busStateMap = {};

  async function fetchJSON(endpoint) {
    const response = await fetch(`${API_BASE}${endpoint}`);
    if (!response.ok) throw new Error('API offline');
    return await response.json();
  }

  // --- INITIALIZATION & SELECTOR LOGIC ---
  async function initApp() {
    try {
      const [rData, sData] = await Promise.all([
        fetchJSON('/route.php?action=list'),
        fetchJSON('/stop.php?action=list')
      ]);
      
      allRoutes = rData.routes;
      
      // Populate Route Select
      const rSelect = document.getElementById('routeSelect');
      allRoutes.forEach(r => {
          const dest = r.routeName_e.split('>').pop().trim();
          rSelect.insertAdjacentHTML('beforeend', `<option value="${r.routeId}">${r.routeNo} (To ${dest})</option>`);
      });

      // Filter global unique stops for 'ALL' mode
      const uniqueStops = new Map();
      sData.stops.forEach(s => {
        if (s.stopName_e && !uniqueStops.has(s.stopName_e)) {
          uniqueStops.set(s.stopName_e, s);
        }
      });
      allStops = Array.from(uniqueStops.values()).sort((a, b) => a.stopName_e.localeCompare(b.stopName_e));
      
      populateStopDropdown(allStops);

      const savedStop = localStorage.getItem('selectedNLBStop');
      const savedRoute = localStorage.getItem('selectedNLBRoute');
      
      if (savedRoute) {
          currentRouteId = savedRoute;
          rSelect.value = savedRoute;
      }
      
      if (savedStop) {
        currentStopName = savedStop;
        if (currentRouteId !== 'ALL') {
           await cacheRouteStops(currentRouteId);
           populateStopDropdown(routeStopsCache[currentRouteId]);
        }
        document.getElementById('stopSelect').value = currentStopName;
        startAppLoop();
      } else {
        locateNearestStop(true); 
      }
    } catch (err) {
      document.getElementById('loadingText').innerText = "Network Error: Could not connect to HK Gov Transport API.";
      console.error(err);
    }
  }

  async function cacheRouteStops(routeId) {
    if (!routeStopsCache[routeId]) {
        try {
            const res = await fetchJSON(`/stop.php?action=list&routeId=${routeId}`);
            routeStopsCache[routeId] = res.stops || [];
        } catch(e) {
            routeStopsCache[routeId] = [];
        }
    }
  }

  function populateStopDropdown(stopsList) {
    const sSelect = document.getElementById('stopSelect');
    sSelect.innerHTML = '';
    
    const unique = [];
    const seen = new Set();
    for(const s of stopsList) {
        if(!seen.has(s.stopName_e)) {
            seen.add(s.stopName_e);
            unique.push(s);
        }
    }
    
    unique.forEach(s => {
        sSelect.insertAdjacentHTML('beforeend', `<option value="${s.stopName_e}">${s.stopName_c} - ${s.stopName_e}</option>`);
    });
  }

  async function handleRouteChange(val) {
    currentRouteId = val;
    localStorage.setItem('selectedNLBRoute', currentRouteId);
    
    if (val === 'ALL') {
        populateStopDropdown(allStops);
    } else {
        document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Caching line stops...</div>';
        await cacheRouteStops(val);
        populateStopDropdown(routeStopsCache[val]);
    }
    
    // Auto-select nearest/valid stop if current is wiped out by line change
    const sSelect = document.getElementById('stopSelect');
    let stopExists = Array.from(sSelect.options).some(opt => opt.value === currentStopName);
    
    if (!stopExists && sSelect.options.length > 0) {
        currentStopName = sSelect.options[0].value;
        localStorage.setItem('selectedNLBStop', currentStopName);
    } else {
        sSelect.value = currentStopName;
    }
    
    for (let key in busStateMap) delete busStateMap[key];
    countdown = REFRESH_INTERVAL;
    updateNetworkTelemetry();
  }

  function handleStopChange(val) {
    if (!val || val.trim() === '') return;
    currentStopName = val.trim();
    localStorage.setItem('selectedNLBStop', currentStopName);
    
    document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Syncing stop telemetry...</div>';
    for (let key in busStateMap) delete busStateMap[key];
    
    countdown = REFRESH_INTERVAL;
    updateNetworkTelemetry();
  }

  // --- SPATIAL MATH & GPS ---
  function calculateDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function locateNearestStop(isAutoInit = false) {
    if (!navigator.geolocation) {
      if (isAutoInit) fallbackDefault();
      else alert("Geolocation is not supported by your browser");
      return;
    }
    
    const btn = document.getElementById('gpsBtn');
    btn.classList.add('loading');

    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      
      let closest = null;
      let minDistance = Infinity;
      
      allStops.forEach(s => {
        const d = calculateDistanceKm(lat, lon, parseFloat(s.latitude), parseFloat(s.longitude));
        if (d < minDistance) {
          minDistance = d;
          closest = s;
        }
      });
      
      btn.classList.remove('loading');
      if (closest) {
        // Reset Line to ALL to guarantee we see data at this new physical location
        currentRouteId = 'ALL';
        document.getElementById('routeSelect').value = 'ALL';
        localStorage.setItem('selectedNLBRoute', 'ALL');
        populateStopDropdown(allStops);

        currentStopName = closest.stopName_e;
        document.getElementById('stopSelect').value = currentStopName;
        localStorage.setItem('selectedNLBStop', currentStopName);
        
        for (let key in busStateMap) delete busStateMap[key];
        
        if (isAutoInit) startAppLoop();
        else {
            document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Syncing nearest stop telemetry...</div>';
            countdown = REFRESH_INTERVAL;
            updateNetworkTelemetry();
        }
      } else if (isAutoInit) {
        fallbackDefault();
      }
    }, (err) => {
      btn.classList.remove('loading');
      if (isAutoInit) {
        fallbackDefault();
      } else {
        alert("GPS Error: Could not determine location. Please check device permissions.");
      }
    }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
  }

  function fallbackDefault() {
    currentRouteId = 'ALL';
    document.getElementById('routeSelect').value = 'ALL';
    currentStopName = 'Lo Uk Tsuen';
    populateStopDropdown(allStops);
    document.getElementById('stopSelect').value = currentStopName;
    startAppLoop();
  }

  function startAppLoop() {
    updateNetworkTelemetry();
    startTimer();
  }

  // --- CORE TELEMETRY ---
  async function updateNetworkTelemetry() {
    if (!currentStopName) return;
    
    try {
      const routesToCheck = currentRouteId === 'ALL' ? allRoutes : allRoutes.filter(r => r.routeId === currentRouteId);
      const uncachedRoutes = routesToCheck.filter(r => !routeStopsCache[r.routeId]);
      
      if (uncachedRoutes.length > 0) {
          if (!document.getElementById('loadingText')) {
              document.getElementById('routeList').innerHTML = '<div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Caching route structure...</div>';
          }
          const fetchPromises = uncachedRoutes.map(r => cacheRouteStops(r.routeId));
          await Promise.all(fetchPromises);
      }

      const relevantRoutes = [];
      const searchLower = currentStopName.toLowerCase();
      
      for (const r of routesToCheck) {
        const stops = routeStopsCache[r.routeId] || [];
        const targetIndex = stops.findIndex(s => 
          (s.stopName_e && s.stopName_e.toLowerCase() === searchLower)
        );
        
        if (targetIndex !== -1) {
          relevantRoutes.push({ route: r, stops, targetIndex });
        }
      }

      const listEl = document.getElementById('routeList');
      const loadingEl = document.getElementById('loadingText');
      if (loadingEl) loadingEl.remove();

      if (relevantRoutes.length === 0) {
        listEl.innerHTML = `<div style="padding: 20px; color: var(--text-secondary); text-align: center;">No active routes match this criteria.</div>`;
        return;
      }

      for (const item of relevantRoutes) {
        const routeId = item.route.routeId;
        const cardId = `route-${routeId}`;
        const destName = item.route.routeName_e.split('>').pop().trim();

        if (!document.getElementById(cardId)) {
          listEl.insertAdjacentHTML('beforeend', `
            <div class="route-card" id="${cardId}" data-smart-mins="9999">
              <div class="card-main">
                <div class="route-left">
                  <div class="route-no">${item.route.routeNo}</div>
                  <div class="route-info">
                    <div class="dest-wrap">
                      <div class="route-dest">To ${destName}</div>
                      <div class="compact-occupancy" id="occ-sec-${routeId}" style="display:none;">
                        <div class="bar-segments" id="bars-${routeId}">
                          ${Array(10).fill('<div class="segment"></div>').join('')}
                        </div>
                        <span class="occupancy-pct-text" id="pct-${routeId}">--%</span>
                      </div>
                    </div>
                    <div class="route-status" id="status-${routeId}">Loading telemetry...</div>
                  </div>
                </div>
                <div class="eta-container">
                  <div class="eta-box">
                    <span class="eta-label">Official</span>
                    <span class="official-eta" id="off-${routeId}">--</span>
                  </div>
                  <div class="eta-box">
                    <span class="eta-label">Smart</span>
                    <span class="smart-eta" id="smart-${routeId}">--</span>
                  </div>
                </div>
              </div>
              <div class="inference-row" id="tags-${routeId}"></div>
            </div>
          `);
        }
      }

      const validIds = relevantRoutes.map(i => `route-${i.route.routeId}`);
      document.querySelectorAll('.route-card').forEach(c => {
        if (!validIds.includes(c.id)) c.remove();
      });

      const promises = relevantRoutes.map(item => processRouteSmartETA(item.route, item.stops, item.targetIndex));
      await Promise.all(promises);

      sortCards();

    } catch (err) {
      console.error('Telemetry failure:', err);
    }
  }

  async function processRouteSmartETA(route, stops, targetIndex) {
    const routeId = route.routeId;
    const cardEl = document.getElementById(`route-${routeId}`);
    
    try {
      const destName = route.routeName_e.split('>').pop().trim();
      const statusEl = document.getElementById(`status-${routeId}`);
      const offEl = document.getElementById(`off-${routeId}`);
      const smartEl = document.getElementById(`smart-${routeId}`);
      const tagsEl = document.getElementById(`tags-${routeId}`);
      const occSecEl = document.getElementById(`occ-sec-${routeId}`);
      const barsEl = document.getElementById(`bars-${routeId}`);
      const pctEl = document.getElementById(`pct-${routeId}`);
      
      const targetStop = stops[targetIndex];
      const upstreamStop = targetIndex > 0 ? stops[targetIndex - 1] : null;

      const [targetEtaRes, upstreamEtaRes] = await Promise.all([
        fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${targetStop.stopId}&language=en`),
        upstreamStop 
          ? fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${routeId}&stopId=${upstreamStop.stopId}&language=en`)
          : Promise.resolve(null)
      ]);

      if (!targetEtaRes.estimatedArrivals || targetEtaRes.estimatedArrivals.length === 0) {
        setEmptyState(cardEl, offEl, smartEl, statusEl, tagsEl, occSecEl);
        return;
      }

      const now = Date.now();
      const activeBus = targetEtaRes.estimatedArrivals[0];
      const serverTime = new Date(activeBus.generateTime.replace(/-/g, '/'));
      const arrivalTime = new Date(activeBus.estimatedArrivalTime.replace(/-/g, '/'));
      const busArrivalTimeId = activeBus.estimatedArrivalTime;
      
      let elapsedSinceGenerate = now - serverTime.getTime();
      if (elapsedSinceGenerate < 0 || elapsedSinceGenerate > 120000) {
        elapsedSinceGenerate = 0; 
      }

      const remainingMs = (arrivalTime.getTime() - serverTime.getTime()) - elapsedSinceGenerate;
      const rawEtaMins = Math.max(0, Math.floor(remainingMs / 60000));
      
      let smartMins = rawEtaMins;
      let reasonTags = [];
      const destNameLower = destName.toLowerCase();

      if (destNameLower.includes('mui wo') && rawEtaMins <= 3 && rawEtaMins > 0) {
         smartMins = Math.max(smartMins, rawEtaMins + 1);
         reasonTags.push(`<span class="tag orange">Traffic Signal</span>`);
      }

      const { pct, activeBars } = calculateOccupancy(destName, targetEtaRes.estimatedArrivals, targetIndex, stops.length);
      let colorClass = pct > 75 ? 'active-red' : (pct > 45 ? 'active-orange' : 'active-green');
      let barHtml = '';
      for (let i = 1; i <= 10; i++) barHtml += `<div class="segment ${i <= activeBars ? colorClass : ''}"></div>`;
      barsEl.innerHTML = barHtml;
      pctEl.innerText = `${pct}%`;
      pctEl.style.color = pct > 75 ? 'var(--accent-red)' : (pct > 45 ? 'var(--accent-orange)' : 'var(--accent-green)');
      occSecEl.style.display = 'flex';

      const prevState = busStateMap[routeId];
      const isSameBus = prevState && prevState.busArrivalTimeId === busArrivalTimeId;

      if (rawEtaMins > 0) {
        if (upstreamStop && upstreamEtaRes && upstreamEtaRes.estimatedArrivals && upstreamEtaRes.estimatedArrivals.length > 0) {
          const upBus = upstreamEtaRes.estimatedArrivals[0];
          const upArrTime = new Date(upBus.estimatedArrivalTime.replace(/-/g, '/'));
          const upServerTime = new Date(upBus.generateTime.replace(/-/g, '/'));
          const upstreamEtaMins = Math.max(0, Math.floor((upArrTime - upServerTime) / 60000));

          const distanceKm = calculateDistanceKm(
            parseFloat(upstreamStop.latitude), parseFloat(upstreamStop.longitude),
            parseFloat(targetStop.latitude), parseFloat(targetStop.longitude)
          );
          const minTransitMins = Math.max(1.0, (distanceKm / 35.0) * 60);

          if (rawEtaMins < upstreamEtaMins + Math.floor(minTransitMins)) {
            smartMins = Math.ceil(upstreamEtaMins + minTransitMins);
            reasonTags.push(`<span class="tag blue">Upstream Buffer</span>`);
          }
        }

        if (isSameBus) {
          const elapsedMins = (now - prevState.timestamp) / 60000;
          const expectedSmart = prevState.smartMins - elapsedMins;
          
          if (smartMins < expectedSmart - 1 && !reasonTags.join('').includes('Traffic Signal')) { 
            smartMins = Math.ceil(expectedSmart - 0.5);
            reasonTags.push(`<span class="tag purple">Signal Smoothed</span>`);
          }

          const rawDecay = prevState.rawEtaMins - rawEtaMins;
          const decayRate = elapsedMins > 0 ? (rawDecay / elapsedMins) : 1;
          
          if (decayRate < 0.2 && rawEtaMins > 2) {
            smartMins = Math.max(smartMins, Math.min(rawEtaMins + 2, prevState.smartMins));
            if (!reasonTags.join('').includes('Smoothed') && !reasonTags.join('').includes('Traffic Signal')) {
              reasonTags.push(`<span class="tag yellow">Traffic Delay</span>`);
            }
          }
        } else if (prevState && prevState.smartMins <= 1 && rawEtaMins > 5) {
          const timeSincePreviousDue = (now - prevState.timestamp) / 1000;
          if (timeSincePreviousDue < 25) {
            smartMins = 0;
            reasonTags.push(`<span class="tag green">At Stop</span>`);
          }
        }

        if (rawEtaMins <= 2) {
          smartMins = rawEtaMins;
        } else if (Math.abs(smartMins - rawEtaMins) > 10) {
          smartMins = rawEtaMins;
        }

        busStateMap[routeId] = { timestamp: now, rawEtaMins, smartMins, busArrivalTimeId };
      } else {
        smartMins = 0;
        busStateMap[routeId] = { timestamp: now, rawEtaMins: 0, smartMins: 0, busArrivalTimeId };
      }

      cardEl.dataset.smartMins = smartMins;
      offEl.innerText = rawEtaMins === 0 ? 'Due' : `${rawEtaMins}m`;

      if (smartMins === 0) {
        smartEl.innerText = 'Due';
        smartEl.className = 'smart-eta';
      } else {
        smartEl.innerText = `${smartMins} min`;
        smartEl.className = smartMins > rawEtaMins ? 'smart-eta adjusted' : 'smart-eta';
      }

      tagsEl.innerHTML = reasonTags.join(' ');
      
      const localTimeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      const serverTimeString = serverTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      statusEl.innerText = `Sync: ${localTimeString} | API: ${serverTimeString}`;

    } catch (err) {
      if (cardEl) {
        const statusEl = document.getElementById(`status-${routeId}`);
        if (statusEl) statusEl.innerText = 'Telemetry sync failed';
        cardEl.dataset.smartMins = 9999;
      }
    }
  }
  
  function calculateOccupancy(destName, estimatedArrivals, currentStopIndex, totalStops) {
    const now = new Date();
    const hour = now.getHours();
    const dest = destName.toLowerCase();

    let baseLoad = 40; 
    if (hour >= 7 && hour <= 9) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo')) ? 80 : 45;
    } else if (hour >= 17 && hour <= 19) {
      baseLoad = (!dest.includes('tung chung')) ? 75 : 50;
    } else if (hour >= 11 && hour <= 14) {
      baseLoad = 35;
    }

    const routeProgress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
    let spatialMultiplier = 1 - Math.pow(routeProgress, 2.5);
    
    if (routeProgress < 0.05 && estimatedArrivals && estimatedArrivals.length > 0) {
      const minToDeparture = Math.floor((new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - now) / 60000);
      if (minToDeparture > 5) spatialMultiplier *= 0.5;
    }

    let headwayMultiplier = 1.0;
    if (estimatedArrivals && estimatedArrivals.length >= 2) {
      const serverTime = new Date(estimatedArrivals[0].generateTime.replace(/-/g, '/'));
      const t1 = Math.max(0, (new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000);
      const t2 = Math.max(0, (new Date(estimatedArrivals[1].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000);
      const gap = t2 - t1;

      if (gap <= 8) {
        headwayMultiplier = 1.8;
      } else {
        const lambda = 0.08; 
        headwayMultiplier = 0.5 + (2.0 * (1 - Math.exp(-lambda * gap)));
      }
    }

    let calculatedLoad = baseLoad * spatialMultiplier * headwayMultiplier;
    const noise = (Math.random() * 6) - 3;
    
    const pct = Math.min(98, Math.max(5, Math.round(calculatedLoad + noise)));
    const activeBars = Math.min(10, Math.max(1, Math.round(pct / 10)));

    return { pct, activeBars };
  }

  function setEmptyState(cardEl, offEl, smartEl, statusEl, tagsEl, occSecEl) {
    if(cardEl) cardEl.dataset.smartMins = 9999;
    if(offEl) offEl.innerText = '--';
    if(smartEl) smartEl.innerText = '--';
    if(statusEl) statusEl.innerText = 'No upcoming departures';
    if(tagsEl) tagsEl.innerHTML = '';
    if(occSecEl) occSecEl.style.display = 'none';
  }

  function sortCards() {
    const listEl = document.getElementById('routeList');
    const cards = Array.from(listEl.querySelectorAll('.route-card'));
    cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
    cards.forEach(card => listEl.appendChild(card));
  }

  function startTimer() {
    clearInterval(timerInterval);
    countdown = REFRESH_INTERVAL;
    document.getElementById('refreshTimer').innerText = `Syncing in ${countdown}s`;
    
    timerInterval = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        document.getElementById('refreshTimer').innerText = 'Syncing...';
        updateNetworkTelemetry();
      } else {
        document.getElementById('refreshTimer').innerText = `Syncing in ${countdown}s`;
      }
    }, 1000);
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimer').innerText = 'Syncing...';
      updateNetworkTelemetry();
      startTimer();
    } else {
      clearInterval(timerInterval);
    }
  });

  // Startup
  initApp();
</script>
