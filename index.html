<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TransitPulse HK - Live Analytics</title>
<style>
  :root {
    --bg-color: #1c1c1e;
    --card-bg: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #8e8e93;
    --accent-red: #e31837;
    --accent-green: #34c759;
    --accent-yellow: #ffcc00;
    --accent-orange: #ff9500;
  }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background-color: var(--accent-red);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
  
  .live-badge {
    background: rgba(0,0,0,0.2);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    animation: pulse 2s infinite;
  }
  
  .live-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  .stop-header {
    padding: 16px 20px;
    border-bottom: 1px solid #3a3a3c;
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: var(--bg-color);
  }

  .refresh-timer { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; font-variant-numeric: tabular-nums; }

  /* Using flexbox for the list container to enable smooth re-ordering */
  #routeList {
    display: flex;
    flex-direction: column;
  }

  .route-card {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid #3a3a3c;
    background-color: var(--bg-color);
    transition: background-color 0.2s ease;
  }

  .route-no { font-size: 1.75rem; font-weight: 900; width: 65px; letter-spacing: -0.5px; }

  .route-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .route-dest { font-size: 1rem; font-weight: 600; }
  .route-status { font-size: 0.8rem; color: var(--text-secondary); }

  .inference-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 2px;
  }

  .tag {
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: #3a3a3c;
    font-weight: 500;
    white-space: nowrap;
  }

  .tag.high-conf { color: var(--accent-green); border: 1px solid rgba(52, 199, 89, 0.3); }
  .tag.med-conf { color: var(--accent-yellow); border: 1px solid rgba(255, 204, 0, 0.3); }
  .tag.low-conf { color: var(--accent-orange); border: 1px solid rgba(255, 149, 0, 0.3); }
  
  .tag.load-heavy { color: var(--accent-orange); }
  .tag.load-light { color: var(--accent-green); }

  .route-eta { font-size: 1.25rem; font-weight: 600; text-align: right; min-width: 60px; font-variant-numeric: tabular-nums;}
</style>
</head>
<body>

<div class="header">
  <h1>TransitPulse HK</h1>
  <div class="live-badge">LIVE API</div>
</div>

<div class="stop-header">
  <span>📍 Lo Uk Tsuen</span>
  <span class="refresh-timer" id="refreshTimer">Updating...</span>
</div>

<div id="routeList">
  <div style="padding: 20px; color: var(--text-secondary);" id="loadingText">Initializing telemetry...</div>
</div>

<script>
  const API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
  const TARGET_STOP_NAME = 'Lo Uk Tsuen';
  const TARGET_ROUTES = ['3M', '1', '4', '2', '11']; 
  const REFRESH_INTERVAL = 30;
  
  let countdown = REFRESH_INTERVAL;
  let timerInterval;

  // Inference Model 1: Confidence
  function calculateConfidence(bus) {
    if (bus.noGPS === 1) return { level: 'low', text: 'Scheduled Only' };
    if (bus.departed === 0) return { level: 'med', text: 'At Terminus' };
    return { level: 'high', text: 'Live GPS' };
  }

  // Inference Model 2: Occupancy Thermodynamics
  function inferOccupancy(routeNo, destName) {
    const d = new Date();
    const hour = d.getHours();
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const dest = destName.toLowerCase();
    
    let load = { level: 'light', text: 'Probable Seats' };

    if (!isWeekend) {
      if (hour >= 7 && hour <= 9 && (dest.includes('tung chung') || dest.includes('mui wo'))) {
        load = { level: 'heavy', text: 'Likely Standing' };
      } else if (hour >= 17 && hour <= 19 && !dest.includes('tung chung') && !dest.includes('mui wo')) {
        load = { level: 'heavy', text: 'Likely Standing' };
      }
    } else {
      if (hour >= 10 && hour <= 14 && (dest.includes('tai o') || dest.includes('ngong ping'))) {
        load = { level: 'heavy', text: 'Near Maximum' };
      } else if (hour >= 16 && hour <= 19 && (dest.includes('tung chung') || dest.includes('mui wo'))) {
        load = { level: 'heavy', text: 'Near Maximum' };
      }
    }
    return load;
  }

  async function fetchJSON(endpoint) {
    const response = await fetch(`${API_BASE}${endpoint}`);
    if (!response.ok) throw new Error('API unreachable');
    return await response.json();
  }

  async function updateNetworkTelemetry() {
    try {
      const routeData = await fetchJSON('/route.php?action=list');
      const relevantRoutes = routeData.routes.filter(r => TARGET_ROUTES.includes(r.routeNo));
      
      const listEl = document.getElementById('routeList');
      const loadingEl = document.getElementById('loadingText');
      if (loadingEl) loadingEl.remove();

      // Step 1: Ensure DOM shells exist for all monitored bindings
      for (const route of relevantRoutes) {
        const destName = route.routeName_e.split('>').pop().trim();
        const cardId = `route-${route.routeId}`;
        
        if (!document.getElementById(cardId)) {
          // Initialize dataset.etaMins at 9999 so loading elements sit at the bottom
          listEl.insertAdjacentHTML('beforeend', `
            <div class="route-card" id="${cardId}" data-eta-mins="9999">
              <div class="route-no">${route.routeNo}</div>
              <div class="route-info">
                <div class="route-dest">To ${destName}</div>
                <div class="route-status" id="status-${route.routeId}">Awaiting telemetry...</div>
                <div class="inference-tags" id="tags-${route.routeId}"></div>
              </div>
              <div class="route-eta" id="eta-${route.routeId}">--</div>
            </div>
          `);
        }
      }

      // Step 2: Fetch all ETA data concurrently to prevent sequential UI waterfalling
      const fetchPromises = relevantRoutes.map(route => {
        const destName = route.routeName_e.split('>').pop().trim();
        return resolveStopsAndFetchETA(route, destName);
      });

      await Promise.all(fetchPromises);
      
      // Step 3: Execute sorting algorithm once all network payloads have resolved
      sortCards();

    } catch (error) {
      console.error('Core telemetry failure:', error);
    }
  }

  async function resolveStopsAndFetchETA(route, destName) {
    const cardEl = document.getElementById(`route-${route.routeId}`);
    const statusEl = document.getElementById(`status-${route.routeId}`);
    const etaEl = document.getElementById(`eta-${route.routeId}`);
    const tagsEl = document.getElementById(`tags-${route.routeId}`);

    try {
      const stopData = await fetchJSON(`/stop.php?action=list&routeId=${route.routeId}`);
      const targetStop = stopData.stops.find(s => 
        s.stopName_e.toLowerCase().includes(TARGET_STOP_NAME.toLowerCase())
      );

      if (!targetStop) {
        statusEl.innerText = 'Stop not serviced on this bound';
        cardEl.dataset.etaMins = 9999;
        tagsEl.innerHTML = '';
        return;
      }
      
      const etaData = await fetchJSON(`/stop.php?action=estimatedArrivals&routeId=${route.routeId}&stopId=${targetStop.stopId}&language=en`);
      
      if (etaData.estimatedArrivals && etaData.estimatedArrivals.length > 0) {
        const nextBus = etaData.estimatedArrivals[0];
        const arrivalTime = new Date(nextBus.estimatedArrivalTime.replace(/-/g, '/'));
        const serverTime = new Date(nextBus.generateTime.replace(/-/g, '/'));
        
        const diffMs = arrivalTime - serverTime;
        const diffMins = Math.floor(diffMs / 60000);
        
        // Push resolved minutes into the DOM dataset for the sorting algorithm
        cardEl.dataset.etaMins = diffMins;

        if (diffMins <= 0) {
           etaEl.innerText = 'Due';
           etaEl.style.color = 'var(--accent-yellow)';
        } else {
           etaEl.innerText = `${diffMins} min`;
           etaEl.style.color = 'var(--accent-green)';
        }
        statusEl.innerText = `Updated at ${serverTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

        const conf = calculateConfidence(nextBus);
        const load = inferOccupancy(route.routeNo, destName);

        tagsEl.innerHTML = `
          <span class="tag ${conf.level}-conf">${conf.text}</span>
          <span class="tag load-${load.level}">${load.text}</span>
        `;
      } else {
        // No buses scheduled; push to bottom of sorted index
        cardEl.dataset.etaMins = 9999; 
        etaEl.innerText = '--';
        etaEl.style.color = 'var(--text-primary)';
        statusEl.innerText = 'No upcoming departures';
        tagsEl.innerHTML = '';
      }
    } catch (error) {
      cardEl.dataset.etaMins = 9999;
      statusEl.innerText = 'Telemetry sync failed';
    }
  }

  // DOM Sorting Mechanism
  function sortCards() {
    const listEl = document.getElementById('routeList');
    const cards = Array.from(listEl.querySelectorAll('.route-card'));
    
    // Sort array natively by integers
    cards.sort((a, b) => {
      const valA = parseInt(a.dataset.etaMins, 10);
      const valB = parseInt(b.dataset.etaMins, 10);
      return valA - valB;
    });
    
    // Re-appending existing nodes in sorted order prevents redrawing and flickering
    cards.forEach(card => listEl.appendChild(card));
  }

  // Mobile Web Environment Handlers
  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = REFRESH_INTERVAL;
        document.getElementById('refreshTimer').innerText = 'Updating...';
        updateNetworkTelemetry();
      } else {
        document.getElementById('refreshTimer').innerText = `Updating in ${countdown}s`;
      }
    }, 1000);
  }

  // Prevent intervals from desyncing when Safari/Chrome puts tabs to sleep
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimer').innerText = 'Updating...';
      updateNetworkTelemetry();
      startTimer();
    } else {
      // Kill execution to prevent battery drain while minimized
      clearInterval(timerInterval);
    }
  });

  // Initialization
  updateNetworkTelemetry();
  startTimer();

</script>
</body>
</html>
