<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pulse HK - Transport Network</title>
<style>
  :root {
    /* Status Colors */
    --bg-color: #121214;
    --card-bg: #1c1c1e;
    --card-border: #2c2c2e;
    --text-primary: #ffffff;
    --text-secondary: #98989d;
    --accent-red: #e31837;
    --accent-green: #30d158;
    --accent-orange: #ff9f0a;
    --accent-blue: #0a84ff;
    
    /* Directional Colors (Subtle Left Border Only) */
    --dir-blue: #0a84ff;    /* Tung Chung */
    --dir-purple: #bf5af2;  /* Mui Wo */
    --dir-cyan: #32ade6;    /* Tai O / Kowloon */
    --dir-indigo: #5e5ce6;  /* Airport/Port / NT */
    --dir-pink: #ff375f;    /* Tong Fuk / HK Island */
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden; 
  }
  .header {
    background-color: var(--accent-red);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left { display: flex; flex-direction: column; }
  .title-row { display: flex; align-items: baseline; gap: 8px; }
  .header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .build-badge { font-size: 0.55rem; color: rgba(255, 255, 255, 0.7); font-family: monospace; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
  
  .time-row { display: flex; align-items: baseline; gap: 12px; margin-top: 2px; }
  .clock { font-size: 0.75rem; font-weight: 500; opacity: 0.9; font-variant-numeric: tabular-nums; }
  .refresh-timer { font-size: 0.75rem; color: rgba(255,255,255,0.85); font-weight: 600; font-variant-numeric: tabular-nums; }
  
  select.lang-select {
    background: rgba(0,0,0,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; outline: none; cursor: pointer; flex-shrink: 0;
  }
  .stop-header {
    padding: 12px 16px; border-bottom: 1px solid var(--card-border);
    display: flex; flex-direction: column; background-color: var(--bg-color); gap: 4px;
    position: sticky; top: 58px; z-index: 9;
  }
  .controls-container { display: flex; gap: 10px; width: 100%; min-width: 0; }
  
  .action-btn {
    background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
    width: 44px; height: 72px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
  }
  .action-btn:active { background: #3a3a3c; }
  .action-btn.active-gps { border-color: var(--accent-green); color: var(--accent-green); background: rgba(48, 209, 88, 0.1); }
  .action-btn.active-fav { border-color: #ffd60a; color: #ffd60a; background: rgba(255, 214, 10, 0.1); }

  .selectors { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  
  /* Searchable Pseudo-Select Inputs */
  .search-input {
    background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
    padding: 8px 32px 8px 12px; border-radius: 8px;
    font-size: 0.9rem; font-weight: 600; outline: none; cursor: pointer;
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background-image: url('data:image/svg+xml;utf8,<svg fill="%2398989d" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
    background-repeat: no-repeat; background-position: right 8px center;
  }
  .search-input-text { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }

  .gps-status { font-size: 0.75rem; color: var(--accent-green); font-weight: 600; text-align: right; padding-right: 4px; display: flex; justify-content: space-between; align-items: center; }
  
  /* Search Modal */
  .search-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-color); z-index: 100; flex-direction: column;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; padding: 12px 16px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); gap: 12px; align-items: center; }
  .modal-search-bar {
    flex: 1; background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c;
    padding: 10px 12px; border-radius: 8px; font-size: 1rem; outline: none;
  }
  .modal-close { color: var(--accent-blue); background: none; border: none; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
  .modal-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .modal-item {
    padding: 14px 16px; border-bottom: 1px solid var(--card-border);
    font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .modal-item:active { background-color: #1e1e20; }
  .modal-item-icon { font-size: 1.1rem; }
  .fav-header { padding: 8px 16px; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); background: #1a1a1c; text-transform: uppercase; }

  #detailControls {
    display: none; padding: 12px 16px; background: var(--bg-color); border-bottom: 1px solid var(--card-border);
  }
  .back-btn {
    width: 100%; background: #2c2c2e; color: var(--dir-blue); border: 1px solid #3a3a3c;
    border-radius: 8px; padding: 12px; font-size: 1.05rem; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  }
  .back-btn:active { background: #3a3a3c; }

  #routeList { display: flex; flex-direction: column; min-height: 50vh; padding-bottom: 24px; }
  
  /* Directional Color-Coding Anchor - Restored White Text for Clean UI */
  .route-card {
    display: flex; flex-direction: column; align-items: stretch;
    padding: 16px 16px 16px 12px; border-bottom: 1px solid var(--card-border); gap: 0;
    border-left: 6px solid var(--card-border);
    cursor: pointer; transition: background-color 0.2s;
  }
  .route-card:active { background-color: #1e1e20; }
  .route-main-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  }

  .route-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .route-no { font-size: 1.6rem; font-weight: 900; min-width: 45px; letter-spacing: -0.5px; flex-shrink: 0; color: var(--text-primary); }
  .route-company { font-size: 0.6rem; color: var(--text-secondary); text-align: center; margin-top: -2px; font-weight: 700; background: #2c2c2e; padding: 2px 4px; border-radius: 4px; }
  .route-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .route-dest { font-size: 1.05rem; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; color: var(--text-primary); }
  
  .eta-container { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .eta-box { display: flex; flex-direction: column; align-items: flex-end; min-width: 42px; }
  .eta-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; margin-bottom: 2px; text-align: right; }
  .official-eta { font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); text-decoration: line-through; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .smart-eta { font-size: 1.45rem; font-weight: 800; color: var(--accent-green); font-variant-numeric: tabular-nums; transition: color 0.3s; }
  
  @keyframes blink-arriving { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  @keyframes blink-delayed { 0% { opacity: 1; color: var(--accent-orange); } 50% { opacity: 0.4; color: var(--accent-red); } 100% { opacity: 1; color: var(--accent-orange); } }
  @keyframes fade-departing { 0% { opacity: 0.8; color: var(--text-secondary); } 50% { opacity: 0.3; color: var(--text-secondary); } 100% { opacity: 0.8; color: var(--text-secondary); } }
  
  .smart-eta.arriving { color: var(--accent-orange); font-size: 1.25rem; animation: blink-arriving 1.5s infinite; }
  .smart-eta.delayed { animation: blink-delayed 2s infinite; font-size: 1.15rem; font-weight: 700; }
  .smart-eta.departing { animation: fade-departing 2s infinite; font-size: 1.15rem; font-weight: 700; }

  /* Practical Text-Based Occupancy Pills */
  .compact-occupancy { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .occ-pill {
    display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px;
    font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .occ-pair { background: rgba(48, 209, 88, 0.15); color: var(--accent-green); }
  .occ-single { background: rgba(255, 159, 10, 0.15); color: var(--accent-orange); }
  .occ-standing { background: rgba(227, 24, 55, 0.15); color: var(--accent-red); }

  /* Subsequent Arrivals Styling */
  .subsequent-etas {
    display: none; flex-direction: column; gap: 10px;
    margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--card-border); width: 100%;
  }
  .detail-mode .subsequent-etas { display: flex; }
  .sub-eta-row { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
  .sub-eta-label { font-size: 0.95rem; color: var(--text-secondary); font-weight: 600; }
  .sub-eta-time { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Inactive Routes Toggle */
  .route-card.inactive { display: none; }
  .show-inactive .route-card.inactive { display: flex; }
  .toggle-btn {
    background: transparent; color: var(--text-secondary); border: 1px solid var(--card-border);
    padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin: auto; display: block;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="title-row">
      <h1>Pulse HK</h1>
      <span class="build-badge" id="buildVersion"></span>
    </div>
    <div class="time-row">
      <span class="clock" id="liveClock">--:--:--</span>
      <span class="refresh-timer" id="refreshTimer">Initializing...</span>
    </div>
  </div>
  <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
    <option value="en">EN</option>
    <option value="tc">繁體</option>
    <option value="sc">简体</option>
  </select>
</div>

<div class="stop-header">
  <div class="controls-container">
    <button id="gpsBtn" class="action-btn active-gps" onclick="manualGpsSync()">📍</button>
    <button id="favBtn" class="action-btn" onclick="toggleFavorite()">☆</button>
    <div class="selectors">
      <div class="search-input" onclick="openModal('route')">
        <span class="search-input-text" id="routeSelectText">All Routes</span>
      </div>
      <div class="search-input" onclick="openModal('stop')">
        <span class="search-input-text" id="stopSelectText">Select Stop...</span>
      </div>
    </div>
  </div>
  <div class="gps-status">
      <span id="favStatusText" style="color: var(--text-secondary);"></span>
      <span id="gpsStatus"></span>
  </div>
</div>

<div id="detailControls">
  <button class="back-btn" onclick="hideDetail()" id="backBtn">🔙 Back to all routes</button>
</div>

<div id="routeList">
  <div id="loadingText" style="padding: 20px; color: var(--text-secondary); text-align: center;">Connecting to network...</div>
</div>

<!-- Search Modal -->
<div id="searchModal" class="search-modal">
  <div class="modal-header">
    <input type="text" id="searchInput" class="modal-search-bar" placeholder="Search..." oninput="renderModalList()" autocomplete="off">
    <button class="modal-close" onclick="closeModal()">Cancel</button>
  </div>
  <div id="searchList" class="modal-list"></div>
</div>

<script>
const NLB_API_BASE = 'https://rt.data.gov.hk/v2/transport/nlb';
const KMB_API_BASE = 'https://data.etabus.gov.hk/v1/transport/kmb';
const REFRESH_INTERVAL = 15; 
const CACHE_EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;

// AI INSTRUCTION: ALWAYS UPDATE THIS APP_TIMESTAMP VARIABLE WITH THE CURRENT TIME (YYYY-MM-DD HH:MM HKT) WHEN REGENERATING THIS FILE.
const APP_TIMESTAMP = "Patch: 2026-10-07 10:14 HKT";
const vEl = document.getElementById("buildVersion");
if (vEl) vEl.innerText = APP_TIMESTAMP;

let currentLang = localStorage.getItem('pulse_lang') || 'en';
if (document.getElementById('langSelect')) document.getElementById('langSelect').value = currentLang;

const i18n = {
  en: {
    allLines: "All Routes", loadingIndex: "Loading station index...",
    syncing: "Syncing Network Mappings...", building: "Building Station Index...",
    liveETA: "Fetching live arrivals...", locating: "Locating...", nearest: "Nearest:",
    noStops: "No stops found", gpsDenied: "GPS Denied / Failed",
    gpsNotSupported: "GPS Not Supported", noBuses: "No active buses depart from here currently.",
    to: "To", due: "Due", delayed: "Delayed", departing: "Departing", min: "m", refresh: "Refresh in", refreshing: "Refreshing...",
    official: "Official", actual: "Actual ETA", scheduled: "Scheduled (No GPS)",
    arrivingLabel: "Status", arriving: "Arriving...",
    showInactive: "Show inactive routes", hideInactive: "Hide inactive routes",
    back: "🔙 Back to all routes", noMore: "No further departures scheduled.", next1: "Next Bus", next2: "3rd Bus",
    manual: "Manual Override", favAdded: "Saved to Favourites", favRemoved: "Removed from Favourites",
    pairSeats: "Row-free", singleSeats: "Shared", standing: "Standing Only"
  },
  tc: {
    allLines: "所有路線", loadingIndex: "載入車站索引...",
    syncing: "同步網絡數據...", building: "建立車站索引...",
    liveETA: "獲取實時班次...", locating: "定位中...", nearest: "最近:",
    noStops: "找不到車站", gpsDenied: "定位失敗/被拒絕",
    gpsNotSupported: "不支援定位", noBuses: "目前沒有巴士從此站開出。",
    to: "往", due: "即將到達", delayed: "延誤", departing: "剛駛離", min: "分鐘", refresh: "更新:", refreshing: "更新中...",
    official: "官方", actual: "實際預計", scheduled: "預定班次 (無GPS)",
    arrivingLabel: "狀態", arriving: "即將抵達...",
    showInactive: "顯示未有班次路線", hideInactive: "隱藏未有班次路線",
    back: "🔙 返回所有路線", noMore: "沒有更多預定班次。", next1: "下一班", next2: "第三班",
    manual: "手動選擇", favAdded: "已加入常用車站", favRemoved: "已移除常用車站",
    pairSeats: "雙人吉位", singleSeats: "單人位", standing: "只限企位"
  },
  sc: {
    allLines: "所有路线", loadingIndex: "载入车站索引...",
    syncing: "同步网络数据...", building: "建立车站索引...",
    liveETA: "获取实时班次...", locating: "定位中...", nearest: "最近:",
    noStops: "找不到车站", gpsDenied: "定位失败/被拒绝",
    gpsNotSupported: "不支持定位", noBuses: "目前没有巴士从此站开出。",
    to: "往", due: "即将到达", delayed: "延误", departing: "刚驶离", min: "分钟", refresh: "更新:", refreshing: "更新中...",
    official: "官方", actual: "实际预计", scheduled: "预定班次 (无GPS)",
    arrivingLabel: "状态", arriving: "即将抵达...",
    showInactive: "显示未有班次路线", hideInactive: "隐藏未有班次路线",
    back: "🔙 返回所有路线", noMore: "没有更多预定班次。", next1: "下一班", next2: "第三班",
    manual: "手动选择", favAdded: "已加入常用车站", favRemoved: "已移除常用车站",
    pairSeats: "双人空位", singleSeats: "单人位", standing: "仅限站位"
  }
};

const getT = (key) => i18n[currentLang][key];

let currentRouteKey = 'ALL';
let currentStopName_e = '';
let countdown = REFRESH_INTERVAL;
let timerInterval;
let detailModeRouteKey = null;

let allStops = [];
let groupedRoutes = []; 
let routeStopsCache = {};
const busStateMap = {}; 
let showInactive = false;
let favStops = JSON.parse(localStorage.getItem('pulse_fav_stops') || '[]');

let autoGpsEnabled = true;
let serverClockOffset = 0;
let isClockSynced = false;

let activeModalType = null; 

function getNow() { return Date.now() + serverClockOffset; }

function toggleInactive() {
  showInactive = !showInactive;
  const listEl = document.getElementById('routeList');
  if (showInactive) listEl.classList.add('show-inactive');
  else listEl.classList.remove('show-inactive');
  const btn = document.getElementById('toggleInactiveBtn');
  if (btn) btn.innerText = showInactive ? getT('hideInactive') : getT('showInactive');
}

function showDetail(groupKey) {
  if (detailModeRouteKey === groupKey) { hideDetail(); return; }
  detailModeRouteKey = groupKey;
  document.getElementById('detailControls').style.display = 'block';
  document.getElementById('routeList').classList.add('detail-mode');
  const btn = document.getElementById('backBtn');
  if (btn) btn.innerText = getT('back');
  updateNetworkTelemetry();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function hideDetail() {
  detailModeRouteKey = null;
  document.getElementById('detailControls').style.display = 'none';
  document.getElementById('routeList').classList.remove('detail-mode');
  updateNetworkTelemetry();
}

function getDirectionColor(dest) {
  const d = (dest || '').toLowerCase();
  if (d.includes('tung chung')) return 'var(--dir-blue)';
  if (d.includes('mui wo')) return 'var(--dir-purple)';
  if (d.includes('tai o') || d.includes('kowloon') || d.includes('tsim sha tsui')) return 'var(--dir-cyan)';
  if (d.includes('airport') || d.includes('gtc') || d.includes('hzmb') || d.includes('macao') || d.includes('yuen long') || d.includes('tuen mun')) return 'var(--dir-indigo)';
  if (d.includes('tong fuk') || d.includes('causeway bay') || d.includes('tin hau')) return 'var(--dir-pink)';
  return 'var(--card-border)';
}

class KalmanFilter1D {
  constructor(processNoise, initialEstimate, initialError) {
    this.q = processNoise; this.x = initialEstimate; this.p = initialError; 
  }
  update(measurement, dt, isOptimistic, dynamicR) {
    this.x = this.x - dt; this.p = this.p + this.q; 
    const currentR = isOptimistic ? (dynamicR * 0.2) : dynamicR; 
    const k = this.p / (this.p + currentR); 
    this.x = this.x + k * (measurement - this.x); 
    this.p = (1 - k) * this.p; 
    return Math.max(0, this.x); 
  }
}

function generateDeterministicNoise(routeStr, currentStopIndex, timestamp) {
  const timeBlock = Math.floor(timestamp / 300000); 
  const seed = `${routeStr}-${currentStopIndex}-${timeBlock}`;
  let hash = 0;
  for (let i = 0; i < seed.length; i++) { hash = ((hash << 5) - hash) + seed.charCodeAt(i); hash |= 0; }
  return ((Math.abs(hash) % 100) / 100 * 6) - 3;
}

setInterval(() => {
  const clockEl = document.getElementById('liveClock');
  if (clockEl) {
    clockEl.innerText = new Date(getNow()).toLocaleTimeString(
      currentLang === 'en' ? 'en-US' : 'zh-HK', 
      { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: currentLang==='en' }
    );
  }
}, 1000);

async function fetchJSON(url) {
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) throw new Error('API offline');
  const serverDateStr = response.headers.get('date');
  if (serverDateStr && !isClockSynced) {
      const serverTime = new Date(serverDateStr).getTime();
      if (!isNaN(serverTime)) { serverClockOffset = serverTime - Date.now(); isClockSynced = true; }
  }
  return await response.json();
}

function getLocalizedName(obj, prefix) {
  if (currentLang === 'tc') return obj[`${prefix}_c`];
  if (currentLang === 'sc') return obj[`${prefix}_s`];
  return obj[`${prefix}_e`];
}

async function initApp() {
  try {
    document.getElementById('loadingText').innerText = getT('loadingIndex');
    
    // Bumped cache key to v7 to force bulk KMB reload
    const cachedGrouped = localStorage.getItem('pulse_grouped_routes_v7');
    const cachedStops = localStorage.getItem('pulse_stops_v7');
    const cacheTime = localStorage.getItem('pulse_cache_time_v7');
    const now = Date.now(); 

    if (cachedGrouped && cachedStops && cacheTime && (now - parseInt(cacheTime) < CACHE_EXPIRY_MS)) {
      groupedRoutes = JSON.parse(cachedGrouped);
      routeStopsCache = JSON.parse(cachedStops);
    } else {
      document.getElementById('loadingText').innerText = "Syncing Network Mappings (This takes a few seconds)...";
      
      const groupedMap = new Map();
      routeStopsCache = {};

      // 1. Fetch NLB Data
      try {
          const nlbRData = await fetchJSON(`${NLB_API_BASE}/route.php?action=list`);
          const rawNlbRoutes = nlbRData.routes || [];
          
          rawNlbRoutes.forEach(r => {
            const dest_e = r.routeName_e ? r.routeName_e.split('>').pop().trim() : '';
            const dest_c = r.routeName_c ? r.routeName_c.split(/[>＞]/).pop().trim() : '';
            const dest_s = r.routeName_s ? r.routeName_s.split(/[>＞]/).pop().trim() : '';
            const cleanDest = dest_e.replace(/\s*\([^)]*\)/g, '').trim(); 
            const key = `NLB_${r.routeNo}___${cleanDest}`.replace(/[^a-zA-Z0-9_-]/g, '_');

            if (!groupedMap.has(key)) {
              groupedMap.set(key, { key, routeNo: r.routeNo, dest_e: cleanDest, dest_c, dest_s, routeIds: [`NLB_${r.routeId}`], company: 'NLB' });
            } else {
              groupedMap.get(key).routeIds.push(`NLB_${r.routeId}`);
            }
          });

          const chunkSize = 10;
          for (let i = 0; i < rawNlbRoutes.length; i += chunkSize) {
            const chunk = rawNlbRoutes.slice(i, i + chunkSize);
            await Promise.all(chunk.map(async (r) => {
              try {
                const res = await fetchJSON(`${NLB_API_BASE}/stop.php?action=list&routeId=${r.routeId}`);
                routeStopsCache[`NLB_${r.routeId}`] = res.stops || [];
              } catch(e) { routeStopsCache[`NLB_${r.routeId}`] = []; }
            }));
          }
      } catch(e) { console.error("NLB Fetch failed", e); }

      // 2. Fetch Massive KMB/LWB Data Concurrently
      try {
          const [kmbRoutesRes, kmbStopsRes, kmbRouteStopsRes] = await Promise.all([
              fetch(`${KMB_API_BASE}/route/`).then(r=>r.json()).catch(()=>null),
              fetch(`${KMB_API_BASE}/stop/`).then(r=>r.json()).catch(()=>null),
              fetch(`${KMB_API_BASE}/route-stop/`).then(r=>r.json()).catch(()=>null)
          ]);

          const allKmbStops = {};
          if (kmbStopsRes && kmbStopsRes.data) kmbStopsRes.data.forEach(s => { allKmbStops[s.stop] = s; });

          const formatStopName = (name) => {
              if (!name) return '';
              return name.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
          };

          if (kmbRoutesRes && kmbRoutesRes.data && kmbRouteStopsRes && kmbRouteStopsRes.data) {
              const kmbRouteStopsMap = {};
              kmbRouteStopsRes.data.forEach(rs => {
                  const key = `KMB_${rs.route}_${rs.bound}_${rs.service_type}`;
                  if (!kmbRouteStopsMap[key]) kmbRouteStopsMap[key] = [];
                  kmbRouteStopsMap[key].push(rs);
              });

              kmbRoutesRes.data.forEach(r => {
                  const rId = `KMB_${r.route}_${r.bound}_${r.service_type}`;
                  const rsData = kmbRouteStopsMap[rId];
                  if (!rsData) return;

                  rsData.sort((a,b) => parseInt(a.seq) - parseInt(b.seq));
                  const mappedStops = rsData.map(rs => {
                      const stopDetail = allKmbStops[rs.stop] || { name_en: 'Unknown', name_tc: '未知', name_sc: '未知', lat: '0', long: '0' };
                      return {
                          stopId: rs.stop,
                          stopName_e: formatStopName(stopDetail.name_en),
                          stopName_c: stopDetail.name_tc,
                          stopName_s: stopDetail.name_sc || stopDetail.name_tc,
                          latitude: stopDetail.lat,
                          longitude: stopDetail.long,
                          seq: rs.seq
                      };
                  });
                  routeStopsCache[rId] = mappedStops;

                  // Basic KMB/LWB heuristic (LWB mostly uses E, A, NA, S prefixes)
                  const isLWB = r.route.startsWith('E') || r.route.startsWith('A') || r.route.startsWith('NA') || r.route.startsWith('S');
                  const company = isLWB ? 'LWB' : 'KMB';
                  const cleanDestE = formatStopName(r.dest_en);
                  const groupKey = `KMB_${r.route}___${cleanDestE}`.replace(/[^a-zA-Z0-9_-]/g, '_');

                  if (!groupedMap.has(groupKey)) {
                      groupedMap.set(groupKey, {
                          key: groupKey, routeNo: r.route,
                          dest_e: cleanDestE, dest_c: r.dest_tc, dest_s: r.dest_sc,
                          routeIds: [rId], company: company
                      });
                  } else {
                      groupedMap.get(groupKey).routeIds.push(rId);
                  }
              });
          }
      } catch(e) { console.error("KMB/LWB Fetch failed", e); }

      groupedRoutes = Array.from(groupedMap.values());

      try {
        localStorage.setItem('pulse_grouped_routes_v7', JSON.stringify(groupedRoutes));
        localStorage.setItem('pulse_stops_v7', JSON.stringify(routeStopsCache));
        localStorage.setItem('pulse_cache_time_v7', Date.now().toString());
      } catch (e) {}
    }
    
    buildAllStopsList();
    
    const savedStop = localStorage.getItem('pulse_stop');
    const savedRoute = localStorage.getItem('pulse_route');
    
    if (savedRoute) currentRouteKey = savedRoute;
    updateRouteSelectText();
    updateFavButtonUI();
    
    // Enable Auto-GPS on Initial Load
    autoGpsEnabled = true;
    document.getElementById('gpsBtn').classList.add('active-gps');
    
    if (savedStop && allStops.some(s => s.stopName_e === savedStop)) {
      currentStopName_e = savedStop;
      updateStopSelectText();
    } 
    
    // Perform initial location lock then start loop
    await locateNearestStopPromise(false);
    
    // Failsafe default
    if (!currentStopName_e && allStops.length > 0) {
        currentStopName_e = 'Tung Chung Station Bus Terminus';
        updateStopSelectText();
    }
    
    resetAndFetch();
    startAppLoop();

  } catch (err) {
    document.getElementById('loadingText').innerText = "Network Error: Could not connect to API.";
  }
}

function buildAllStopsList() {
  const uniqueStops = new Map();
  Object.values(routeStopsCache).flat().forEach(s => {
    if (s && s.stopName_e && !uniqueStops.has(s.stopName_e)) uniqueStops.set(s.stopName_e, s);
  });
  allStops = Array.from(uniqueStops.values()).sort((a, b) => a.stopName_e.localeCompare(b.stopName_e));
}

function getStopsForGroup(group) {
  const uniqueMap = new Map();
  group.routeIds.forEach(id => {
    (routeStopsCache[id] || []).forEach(s => {
      if (s && s.stopName_e && !uniqueMap.has(s.stopName_e)) uniqueMap.set(s.stopName_e, s);
    });
  });
  return Array.from(uniqueMap.values()).sort((a, b) => a.stopName_e.localeCompare(b.stopName_e));
}

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function locateNearestStopPromise(isManualClick = false) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            if (isManualClick) document.getElementById('gpsStatus').innerText = getT('gpsNotSupported');
            return resolve(false);
        }
        
        if (isManualClick) document.getElementById('gpsStatus').innerText = getT('locating');

        navigator.geolocation.getCurrentPosition((pos) => {
            let closest = null, minDistance = Infinity;
            let stopsToCheck = (currentRouteKey === 'ALL' || !currentRouteKey) ? allStops : getStopsForGroup(groupedRoutes.find(g => g.key === currentRouteKey));
            if (!stopsToCheck || stopsToCheck.length === 0) stopsToCheck = allStops;

            stopsToCheck.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                const distMeters = Math.round(minDistance * 1000);
                document.getElementById('gpsStatus').innerText = `${getT('nearest')} ${distMeters}m`;
                
                if (closest.stopName_e !== currentStopName_e) {
                    currentStopName_e = closest.stopName_e;
                    localStorage.setItem('pulse_stop', currentStopName_e);
                    updateStopSelectText();
                    for (let key in busStateMap) delete busStateMap[key];
                    resolve(true); 
                } else {
                    resolve(false); 
                }
            } else {
                if (isManualClick) document.getElementById('gpsStatus').innerText = getT('noStops');
                resolve(false);
            }
        }, () => {
            if (isManualClick) document.getElementById('gpsStatus').innerText = getT('gpsDenied');
            resolve(false);
        }, { enableHighAccuracy: true, timeout: 5000, maximumAge: 10000 });
    });
}

async function updateNetworkTelemetry() {
  if (!currentStopName_e) return;
  
  try {
    let groupsToCheck = currentRouteKey === 'ALL' ? groupedRoutes : groupedRoutes.filter(g => g.key === currentRouteKey);
    let relevantGroups = [];
    
    for (const group of groupsToCheck) {
      const matchDetails = [];
      for (const routeId of group.routeIds) {
        const stops = routeStopsCache[routeId] || [];
        const targetIndex = stops.findIndex(s => s.stopName_e === currentStopName_e);
        if (targetIndex !== -1) matchDetails.push({ routeId, stops, targetIndex });
      }
      if (matchDetails.length > 0) relevantGroups.push({ group, matchDetails });
    }

    if (detailModeRouteKey) {
        relevantGroups = relevantGroups.filter(i => i.group.key === detailModeRouteKey);
    }

    const listEl = document.getElementById('routeList');
    
    // Purge any existing loading text/placeholder immediately
    const loadingEl = document.getElementById('loadingText');
    if (loadingEl) loadingEl.remove();

    if (relevantGroups.length === 0) {
      listEl.innerHTML = `<div style="padding: 20px; color: var(--text-secondary); text-align: center;">${getT('noBuses')}</div>`;
      return;
    }

    for (const item of relevantGroups) {
      const group = item.group;
      const cardId = `route-${group.key}`;
      const destName = getLocalizedName(group, 'dest');
      const dirColor = getDirectionColor(group.dest_e);

      if (!document.getElementById(cardId)) {
        listEl.insertAdjacentHTML('beforeend', `
          <div class="route-card" id="${cardId}" data-smart-mins="9999" style="border-left-color: ${dirColor};" onclick="showDetail('${group.key}')">
            <div class="route-main-row">
                <div class="route-left">
                <div style="display:flex; flex-direction:column;">
                    <div class="route-no" id="no-${group.key}">${group.routeNo}</div>
                    ${group.company !== 'NLB' ? `<div class="route-company">${group.company}</div>` : ''}
                </div>
                <div class="route-info">
                    <div class="route-dest" id="dest-${group.key}">${getT('to')} ${destName}</div>
                    <div class="compact-occupancy" id="occ-sec-${group.key}" style="display:none;">
                       <span id="bars-${group.key}" class="occ-pill"></span>
                    </div>
                </div>
                </div>
                <div class="eta-container">
                <div class="eta-box" id="box-off-${group.key}" style="display: none;">
                    <span class="eta-label" id="lbl-off-${group.key}">${getT('official')}</span>
                    <span class="official-eta" id="off-${group.key}">--</span>
                </div>
                <div class="eta-box" id="box-smart-${group.key}">
                    <span class="eta-label" id="lbl-smart-${group.key}">${getT('actual')}</span>
                    <span class="smart-eta" id="smart-${group.key}">--</span>
                </div>
                </div>
            </div>
            <div class="subsequent-etas" id="subs-${group.key}"></div>
          </div>
        `);
      } else {
         const dEl = document.getElementById(`dest-${group.key}`);
         if (dEl) dEl.innerText = `${getT('to')} ${destName}`;
         document.getElementById(cardId).style.borderLeftColor = dirColor;
      }
    }

    const validCardIds = relevantGroups.map(i => `route-${i.group.key}`);
    document.querySelectorAll('.route-card').forEach(c => {
      if (!validCardIds.includes(c.id)) c.remove();
    });

    await Promise.all(relevantGroups.map(item => processSmartArrivals(item.group, item.matchDetails)));

    const cards = Array.from(listEl.querySelectorAll('.route-card'));
    cards.sort((a, b) => parseInt(a.dataset.smartMins, 10) - parseInt(b.dataset.smartMins, 10));
    cards.forEach(card => listEl.appendChild(card));

    const oldBtn = document.getElementById('inactiveToggleContainer');
    if (oldBtn) oldBtn.remove();

    if (!detailModeRouteKey) {
        const inactiveCards = cards.filter(c => c.classList.contains('inactive'));
        if (inactiveCards.length > 0) {
        listEl.insertAdjacentHTML('beforeend', `
            <div id="inactiveToggleContainer" style="padding: 20px; text-align: center;">
            <button onclick="toggleInactive()" class="toggle-btn" id="toggleInactiveBtn">
                ${showInactive ? getT('hideInactive') : getT('showInactive')}
            </button>
            </div>
        `);
        }
    }

  } catch (err) {}
}

async function processSmartArrivals(group, matchDetails) {
  const groupKey = group.key;
  const cardEl = document.getElementById(`route-${groupKey}`);
  
  try {
    const offEl = document.getElementById(`off-${groupKey}`);
    const smartEl = document.getElementById(`smart-${groupKey}`);
    const occSecEl = document.getElementById(`occ-sec-${groupKey}`);
    const boxOffEl = document.getElementById(`box-off-${groupKey}`);
    const lblSmartEl = document.getElementById(`lbl-smart-${groupKey}`);
    const subsEl = document.getElementById(`subs-${groupKey}`);

    let combinedArrivals = [];

    await Promise.all(matchDetails.map(async (m) => {
      const targetStop = m.stops[m.targetIndex];
      const upstreamStop = m.targetIndex > 0 ? m.stops[m.targetIndex - 1] : null;

      let targetEtaRes = null, upstreamEtaRes = null;

      if (m.routeId.startsWith('KMB_')) {
        const parts = m.routeId.split('_');
        const routeNo = parts[1];
        const dir = parts[2]; 
        const serviceType = parts[3];
        
        try {
            const [tResp, uResp] = await Promise.all([
                fetch(`${KMB_API_BASE}/eta/${targetStop.stopId}/${routeNo}/${serviceType}`).catch(()=>null),
                upstreamStop ? fetch(`${KMB_API_BASE}/eta/${upstreamStop.stopId}/${routeNo}/${serviceType}`).catch(()=>null) : Promise.resolve(null)
            ]);
            
            const mapKmbEta = (resObj) => {
                if (!resObj || !resObj.data) return null;
                const valid = resObj.data.filter(e => e.dir === dir && e.eta);
                return {
                    estimatedArrivals: valid.map(e => ({
                        estimatedArrivalTime: e.eta.replace('T', ' ').substring(0, 19),
                        generateTime: e.data_timestamp.replace('T', ' ').substring(0, 19),
                        noGPS: (e.rmk_en && e.rmk_en.toLowerCase().includes('scheduled')) ? 1 : 0
                    }))
                };
            };

            if (tResp && tResp.ok) targetEtaRes = mapKmbEta(await tResp.json());
            if (uResp && uResp.ok) upstreamEtaRes = mapKmbEta(await uResp.json());
        } catch(e) {}
      } 
      else {
        // NLB
        const rawNlbId = m.routeId.replace('NLB_', '');
        [targetEtaRes, upstreamEtaRes] = await Promise.all([
            fetchJSON(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rawNlbId}&stopId=${targetStop.stopId}&language=en`).catch(()=>null),
            upstreamStop ? fetchJSON(`${NLB_API_BASE}/stop.php?action=estimatedArrivals&routeId=${rawNlbId}&stopId=${upstreamStop.stopId}&language=en`).catch(()=>null) : Promise.resolve(null)
        ]);
      }
      
      if (targetEtaRes && targetEtaRes.estimatedArrivals) {
        targetEtaRes.estimatedArrivals.forEach(arr => {
          combinedArrivals.push({
            arrival: arr,
            targetStop,
            upstreamStop,
            upstreamEtaRes,
            targetIndex: m.targetIndex,
            totalStops: m.stops.length
          });
        });
      }
    }));

    const activeState = busStateMap[groupKey];
    const now = getNow();
    const currentHour = new Date(now).getHours();
    
    // Time-aware retention tuning
    const isNight = (currentHour >= 20 || currentHour <= 5);
    const isPeak = (currentHour >= 7 && currentHour <= 9) || (currentHour >= 17 && currentHour <= 19);
    
    let maxZeroTolerance = 240000; 
    if (isNight) maxZeroTolerance = 45000;
    else if (isPeak) maxZeroTolerance = 480000; 
    else maxZeroTolerance = 300000; 

    combinedArrivals.sort((a, b) => new Date(a.arrival.estimatedArrivalTime.replace(/-/g, '/')) - new Date(b.arrival.estimatedArrivalTime.replace(/-/g, '/')));

    // Build sub-ETAs
    if (subsEl) {
        if (combinedArrivals.length > 1) {
            let subsHtml = '';
            for (let i = 1; i < combinedArrivals.length && i <= 2; i++) {
                const cBus = combinedArrivals[i].arrival;
                const cArr = new Date(cBus.estimatedArrivalTime.replace(/-/g, '/'));
                const cSrv = new Date(cBus.generateTime.replace(/-/g, '/'));
                let cElapsed = now - cSrv.getTime();
                if (cElapsed < 0) cElapsed = 0;
                if (cElapsed > 120000) cElapsed = 0;
                
                const cRawMins = Math.max(0, Math.floor(((cArr.getTime() - cSrv.getTime()) - cElapsed) / 60000));
                const isNoGPS = cBus.noGPS === 1 || cBus.noGPS === '1';
                
                const timeText = cRawMins === 0 ? getT('due') : `${cRawMins}${getT('min')}`;
                const labelText = isNoGPS ? getT('scheduled') : getT('actual');
                const timeColor = isNoGPS ? 'var(--accent-orange)' : 'var(--text-primary)';
                const seqName = i === 1 ? getT('next1') : getT('next2');
                
                subsHtml += `
                    <div class="sub-eta-row">
                        <span class="sub-eta-label">${seqName} <span style="font-size:0.75rem; opacity:0.6; margin-left:4px;">(${labelText})</span></span>
                        <span class="sub-eta-time" style="color: ${timeColor}">${timeText}</span>
                    </div>
                `;
            }
            subsEl.innerHTML = subsHtml;
        } else {
            subsEl.innerHTML = `<div class="sub-eta-row" style="justify-content:center; color: var(--text-secondary); font-size: 0.9rem;">${getT('noMore')}</div>`;
        }
    }

    if (activeState && (activeState.isScheduled || (activeState.filter && activeState.filter.x <= 3))) {
       let isBusStillThere = false;
       if (combinedArrivals.length > 0) {
           for (let c of combinedArrivals) {
               const cPseudoId = c.arrival.estimatedArrivalTime.replace(/[^0-9]/g, '');
               if (cPseudoId === activeState.pseudoBusId) {
                   isBusStillThere = true;
                   break;
               }
               const checkArrTime = new Date(c.arrival.estimatedArrivalTime.replace(/-/g, '/'));
               const checkSrvTime = new Date(c.arrival.generateTime.replace(/-/g, '/'));
               const checkEta = Math.max(0, Math.floor((checkArrTime - checkSrvTime) / 60000));
               
               if (activeState.filter && Math.abs(checkEta - activeState.filter.x) <= 3) {
                   isBusStillThere = true;
                   break;
               } else if (activeState.isScheduled && (c.arrival.noGPS === 1 || c.arrival.noGPS === '1') && checkEta <= 2) {
                   isBusStillThere = true;
                   break;
               }
           }
       }
       
       if (!isBusStillThere) {
           const timeSinceLost = now - activeState.timestamp;
           let nextBusEta = 999;
           if (combinedArrivals.length > 0) {
               let nArr = new Date(combinedArrivals[0].arrival.estimatedArrivalTime.replace(/-/g, '/'));
               let nSrv = new Date(combinedArrivals[0].arrival.generateTime.replace(/-/g, '/'));
               let nElapsed = Math.max(0, now - nSrv.getTime());
               if (nElapsed > 120000) nElapsed = 0;
               nextBusEta = Math.max(0, Math.floor(((nArr.getTime() - nSrv.getTime()) - nElapsed) / 60000));
           }
           
           if (activeState.isScheduled) {
               if (timeSinceLost < (isNight ? 60000 : 480000) && nextBusEta > 10) { 
                   cardEl.dataset.smartMins = 0;
                   if (cardEl) cardEl.classList.remove('inactive');
                   if (boxOffEl) boxOffEl.style.display = 'none';
                   
                   lblSmartEl.innerText = getT('scheduled');
                   smartEl.innerText = getT('due');
                   smartEl.className = 'smart-eta arriving';
                   
                   const activeOcc = activeState.occState || 'pair';
                   const barsEl = document.getElementById(`bars-${groupKey}`);
                   if(barsEl) {
                       barsEl.className = `occ-pill ${getOccData(activeOcc).class}`;
                       barsEl.innerText = `${getOccData(activeOcc).icon} ${getT(getOccData(activeOcc).key)}`;
                   }
                   occSecEl.style.display = 'flex';
                   return; 
               } else {
                   delete busStateMap[groupKey];
               }
           } else {
               const timeSpentAtZero = activeState.firstZeroTime ? (now - activeState.firstZeroTime) : 0;
               const maxMissingTime = isNight ? 45000 : ((nextBusEta > 15) ? maxZeroTolerance : 150000); 
               
               if (timeSpentAtZero > maxZeroTolerance || timeSinceLost > maxMissingTime) { 
                   delete busStateMap[groupKey];
               } else {
                   let projectedMins = Math.max(0, Math.round(activeState.filter.x - (timeSinceLost / 60000)));
                   cardEl.dataset.smartMins = projectedMins;
                   if (cardEl) cardEl.classList.remove('inactive');
                   if (boxOffEl) boxOffEl.style.display = 'none';
                   
                   if (projectedMins === 0) {
                       const remainingTolerance = maxZeroTolerance - timeSpentAtZero;
                       
                       if (remainingTolerance < 40000 || (isNight && timeSinceLost > 10000)) { 
                           lblSmartEl.innerText = getT('arrivingLabel');
                           smartEl.innerText = getT('departing');
                           smartEl.className = 'smart-eta departing';
                       } else if (timeSpentAtZero > 75000 && !isNight) {
                           lblSmartEl.innerText = getT('arrivingLabel'); 
                           smartEl.innerText = getT('delayed');
                           smartEl.className = 'smart-eta delayed';
                       } else {
                           lblSmartEl.innerText = getT('arrivingLabel');
                           smartEl.innerText = getT('due');
                           smartEl.className = 'smart-eta arriving';
                       }
                   } else {
                       lblSmartEl.innerText = getT('actual');
                       smartEl.innerText = `${projectedMins}${getT('min')}`;
                       smartEl.className = 'smart-eta'; 
                       offEl.innerText = '--';
                   }
                   
                   const activeOcc = activeState.occState || 'pair';
                   const barsEl = document.getElementById(`bars-${groupKey}`);
                   if(barsEl) {
                       barsEl.className = `occ-pill ${getOccData(activeOcc).class}`;
                       barsEl.innerText = `${getOccData(activeOcc).icon} ${getT(getOccData(activeOcc).key)}`;
                   }
                   occSecEl.style.display = 'flex';
                   return; 
               }
           }
       }
    }

    if (combinedArrivals.length === 0) {
      if(cardEl) {
        cardEl.dataset.smartMins = 9999;
        cardEl.classList.add('inactive');
      }
      if(offEl) offEl.innerText = '--';
      if(smartEl) smartEl.innerText = '--';
      if(occSecEl) occSecEl.style.display = 'none';
      if(boxOffEl) boxOffEl.style.display = 'none';
      return;
    }
    
    if (cardEl) cardEl.classList.remove('inactive');
    
    const activeItem = combinedArrivals[0];
    const activeBus = activeItem.arrival;
    const serverTime = new Date(activeBus.generateTime.replace(/-/g, '/'));
    const arrivalTime = new Date(activeBus.estimatedArrivalTime.replace(/-/g, '/'));
    const pseudoBusId = activeBus.estimatedArrivalTime.replace(/[^0-9]/g, ''); 
    const isNoGPS = activeBus.noGPS === 1 || activeBus.noGPS === '1';

    let elapsedSinceGenerate = now - serverTime.getTime();
    if (elapsedSinceGenerate < 0) elapsedSinceGenerate = 0;
    if (elapsedSinceGenerate > 120000) elapsedSinceGenerate = 0; 

    const remainingMs = (arrivalTime.getTime() - serverTime.getTime()) - elapsedSinceGenerate;
    const rawEtaMins = Math.max(0, Math.floor(remainingMs / 60000));
    
    // Text-Based Occupancy Check
    const { pct } = calculateOccupancy(group.routeNo, group.dest_e, combinedArrivals.map(c => c.arrival), activeItem.targetIndex, activeItem.totalStops, now);
    
    let occState = pct > 75 ? 'standing' : (pct > 45 ? 'single' : 'pair');

    let dwellPenaltyMins = 0;
    if (pct > 85) dwellPenaltyMins = 1.5;
    else if (pct > 65) dwellPenaltyMins = 0.5;

    let effectiveRawEta = rawEtaMins;
    if (rawEtaMins > 3 && !isNoGPS) {
        effectiveRawEta += dwellPenaltyMins;
    }

    const barsEl = document.getElementById(`bars-${groupKey}`);
    const occInfo = getOccData(occState);
    if(barsEl) {
        barsEl.className = `occ-pill ${occInfo.class}`;
        barsEl.innerText = `${occInfo.icon} ${getT(occInfo.key)}`;
    }
    occSecEl.style.display = 'flex';

    let smartMins = effectiveRawEta;
    
    if (rawEtaMins >= 0) {
      if (isNoGPS) {
        if (activeItem.targetIndex === 0) {
             smartMins = rawEtaMins;
        } else {
             const isPeakPadding = (currentHour >= 7 && currentHour <= 9) || (currentHour >= 17 && currentHour <= 19);
             const scheduleMultiplier = isPeakPadding ? 0.90 : 0.70;
             const convergenceFactor = rawEtaMins < 10 ? 1.0 : scheduleMultiplier;
             smartMins = Math.max(0, Math.floor(rawEtaMins * convergenceFactor)); 
        }
        
        lblSmartEl.innerText = getT('scheduled');
        smartEl.style.color = 'var(--accent-orange)';
        
        busStateMap[groupKey] = {
           isScheduled: true, timestamp: now, pseudoBusId: pseudoBusId, 
           occState: occState
        };
      } else {
        lblSmartEl.innerText = getT('actual');
        smartEl.style.color = ''; 

        let isSameBusForFilter = false;
        if (busStateMap[groupKey]) {
           const expectedMins = busStateMap[groupKey].filter ? (busStateMap[groupKey].filter.x - ((now - busStateMap[groupKey].timestamp) / 60000)) : 999;
           if (busStateMap[groupKey].pseudoBusId === pseudoBusId) {
               isSameBusForFilter = true;
           } else if (busStateMap[groupKey].filter && Math.abs(effectiveRawEta - expectedMins) <= 3) {
               isSameBusForFilter = true;
           }
        }

        if (!isSameBusForFilter || busStateMap[groupKey].isScheduled) {
          busStateMap[groupKey] = {
             filter: new KalmanFilter1D(0.1, effectiveRawEta, 1.0),
             timestamp: now, pseudoBusId: pseudoBusId, 
             occState: occState,
             firstZeroTime: (rawEtaMins === 0) ? now : null 
          };
        } else {
          busStateMap[groupKey].pseudoBusId = pseudoBusId; 
          if (rawEtaMins === 0) {
              busStateMap[groupKey].firstZeroTime = busStateMap[groupKey].firstZeroTime || now;
          } else {
              busStateMap[groupKey].firstZeroTime = null; 
          }
        }
        
        const state = busStateMap[groupKey];
        const dtMins = (now - state.timestamp) / 60000;
        
        state.occState = occState;
        
        if (dtMins > 0) {
           const isOptimistic = (effectiveRawEta < state.filter.x);
           const dynamicR = Math.max(1.0, effectiveRawEta * 0.1); 
           smartMins = Math.round(state.filter.update(effectiveRawEta, dtMins, isOptimistic, dynamicR));
           state.timestamp = now;
        } else {
           smartMins = Math.round(state.filter.x);
        }
        
        if (activeItem.upstreamStop && activeItem.upstreamEtaRes && activeItem.upstreamEtaRes.estimatedArrivals && activeItem.upstreamEtaRes.estimatedArrivals.length > 0) {
          let validUpstreamBus = null;
          let upstreamEtaMins = 0;
          let bestMatchDiff = Infinity;
          
          for (let uBus of activeItem.upstreamEtaRes.estimatedArrivals) {
              const uArrTime = new Date(uBus.estimatedArrivalTime.replace(/-/g, '/'));
              const uServerTime = new Date(uBus.generateTime.replace(/-/g, '/'));
              const uEtaMins = Math.max(0, Math.floor((uArrTime - uServerTime) / 60000));
              
              const diff = effectiveRawEta - uEtaMins;
              if (diff >= -2 && diff <= 15) {
                  if (Math.abs(diff) < bestMatchDiff) {
                      bestMatchDiff = Math.abs(diff);
                      validUpstreamBus = uBus;
                      upstreamEtaMins = uEtaMins;
                  }
              }
          }

          if (validUpstreamBus) {
              const distanceKm = calculateDistanceKm(
                parseFloat(activeItem.upstreamStop.latitude), parseFloat(activeItem.upstreamStop.longitude),
                parseFloat(activeItem.targetStop.latitude), parseFloat(activeItem.targetStop.longitude)
              );
              
              let effectiveMaxSpeed = (currentHour >= 19 || currentHour <= 6) ? 55.0 : 35.0; 

              const impliedTransitMins = effectiveRawEta - upstreamEtaMins;
              if (impliedTransitMins > 0) {
                  const impliedSpeedKmH = (distanceKm / (impliedTransitMins / 60));
                  if (impliedSpeedKmH < effectiveMaxSpeed) {
                      effectiveMaxSpeed = Math.max(10.0, impliedSpeedKmH); 
                  }
              }
              
              const minTransitMins = Math.max(0.5, (distanceKm / effectiveMaxSpeed) * 60);

              if (effectiveRawEta < upstreamEtaMins + Math.floor(minTransitMins)) {
                smartMins = Math.ceil(upstreamEtaMins + minTransitMins);
                if (state.filter) state.filter.x = smartMins; 
              }
          }
        }
      }
    } else {
      smartMins = 0;
      delete busStateMap[groupKey]; 
    }

    cardEl.dataset.smartMins = smartMins;
    offEl.innerText = rawEtaMins === 0 ? getT('due') : `${rawEtaMins}${getT('min')}`;

    if (smartMins === 0) {
      const state = busStateMap[groupKey];
      const zeroDuration = (state && state.firstZeroTime) ? (now - state.firstZeroTime) : 0;
      
      if (zeroDuration > 75000 && !isNight) { 
          lblSmartEl.innerText = getT('arrivingLabel');
          smartEl.innerText = getT('delayed');
          smartEl.className = 'smart-eta delayed';
      } else {
          lblSmartEl.innerText = getT('arrivingLabel');
          smartEl.innerText = getT('due');
          smartEl.className = 'smart-eta arriving';
      }
    } else {
      smartEl.innerText = `${smartMins}${getT('min')}`;
      smartEl.className = 'smart-eta';
    }

    if (boxOffEl) {
      boxOffEl.style.display = (smartMins === rawEtaMins && !isNoGPS) ? 'none' : 'flex';
    }

  } catch (err) {
    if (cardEl) {
        cardEl.dataset.smartMins = 9999;
        cardEl.classList.add('inactive');
    }
  }
}

// Occupancy Data Helper
function getOccData(state) {
    if (state === 'standing') return { class: 'occ-standing', key: 'standing', icon: '🧍' };
    if (state === 'single') return { class: 'occ-single', key: 'singleSeats', icon: '💺' };
    return { class: 'occ-pair', key: 'pairSeats', icon: '💺' };
}

function calculateOccupancy(routeNo, destName, estimatedArrivals, currentStopIndex, totalStops, currentTimestamp) {
  const date = new Date(currentTimestamp);
  const hour = date.getHours();
  const day = date.getDay(); 
  const isWeekend = (day === 0 || day === 6);
  const dest = (destName || '').toLowerCase();
  
  let baseLoad = 30; 

  if (!isWeekend) {
    if (hour >= 7 && hour <= 8) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo')) ? 75 : 15; 
      if (['1', '2', '4', '21'].includes(routeNo)) baseLoad = 30; 
    } else if (hour === 9) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo')) ? 55 : 15; 
      if (['1', '2', '4', '21'].includes(routeNo)) baseLoad = 25;
    } else if (hour >= 10 && hour <= 16) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo ferry')) ? 45 : 20; 
      if (['1', '2', '4', '21'].includes(routeNo)) baseLoad = 20;
    } else if (hour >= 17 && hour <= 19) {
      baseLoad = (!dest.includes('tung chung') && !dest.includes('mui wo ferry')) ? 75 : 20; 
      if (['1', '2', '4', '21'].includes(routeNo)) baseLoad = 35;
    } else if (hour >= 20) {
      baseLoad = 10;
    }
  } else {
    if (hour >= 9 && hour <= 14) {
      baseLoad = (!dest.includes('tung chung') && !dest.includes('mui wo ferry')) ? 80 : 25; 
    } else if (hour >= 15 && hour <= 18) {
      baseLoad = (dest.includes('tung chung') || dest.includes('mui wo ferry')) ? 85 : 35; 
    } else if (hour >= 19) {
      baseLoad = 20;
    }
  }

  let progress = Math.max(0, Math.min(1, currentStopIndex / Math.max(1, totalStops - 1)));
  let spatialMultiplier = 1.0; 

  const feeders = ['37M', '38', '39M', 'B4', 'B6'];
  const airportLines = ['E36'];
  const touristBidir = ['3M', '11', '1', '2', '4', '21', 'A35', 'N35'];

  if (feeders.includes(routeNo)) {
      if (progress < 0.75) {
          spatialMultiplier = 1.0; 
      } else {
          spatialMultiplier = Math.max(0, (1 - progress) / 0.25);
      }
  } else if (airportLines.includes(routeNo)) {
      if (progress < 0.85) {
          spatialMultiplier = Math.sqrt(Math.max(0.1, progress + 0.1));
      } else {
          spatialMultiplier = Math.max(0, (1 - progress) / 0.15);
      }
  } else if (touristBidir.includes(routeNo)) {
      spatialMultiplier = Math.sin(progress * Math.PI);
      if (progress > 0.7) {
          let dropFactor = Math.max(0, (1 - progress) / 0.3);
          spatialMultiplier = spatialMultiplier * Math.pow(dropFactor, 1.5);
      }
  } else {
      spatialMultiplier = Math.sin(progress * Math.PI);
  }

  if (currentStopIndex === 0 && estimatedArrivals && estimatedArrivals.length > 0) {
    const minToDeparture = Math.floor((new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - currentTimestamp) / 60000);
    if (minToDeparture > 10) spatialMultiplier = 0.1; 
    else if (minToDeparture > 5) spatialMultiplier = 0.3; 
    else spatialMultiplier = 0.6; 
  }

  let headwayMultiplier = 1.0;
  if (estimatedArrivals && estimatedArrivals.length >= 2) {
    const serverTime = new Date(estimatedArrivals[0].generateTime.replace(/-/g, '/'));
    const t1 = Math.max(0, (new Date(estimatedArrivals[0].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000);
    const t2 = Math.max(0, (new Date(estimatedArrivals[1].estimatedArrivalTime.replace(/-/g, '/')) - serverTime) / 60000);
    const gap = t2 - t1;
    
    if (baseLoad > 40) {
        headwayMultiplier = gap <= 8 ? 1.4 : 0.5 + (1.5 * (1 - Math.exp(-0.05 * gap)));
    } else {
        headwayMultiplier = gap <= 15 ? 1.0 : 1.2;
    }
    
    if (gap > 20) headwayMultiplier *= 1.25; 
  }

  const stableNoise = generateDeterministicNoise(routeNo, currentStopIndex, currentTimestamp);
  let rawVolume = (baseLoad * spatialMultiplier * headwayMultiplier) + stableNoise;

  const strictSingle = ['1', '2', '11', '21', '34', '36', 'A35', 'N35'];
  const strictDouble = ['37M', '38', '39M', 'B2', 'B2P', 'B4', 'B6', '4', 'E36']; 
  const mixedHeavy = ['3M']; 

  let capacityDivider = 1.0; 
  if (strictSingle.includes(routeNo)) capacityDivider = 0.6; 
  else if (strictDouble.includes(routeNo)) capacityDivider = 1.3; 
  else if (mixedHeavy.includes(routeNo)) capacityDivider = 1.25; 

  let pct = Math.min(100, Math.max(0, Math.round(rawVolume / capacityDivider)));
  
  return { pct };
}

let isSyncing = false;
function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimer').innerText = `${getT('refresh')} ${countdown}s`;
  
  timerInterval = setInterval(async () => {
    if (isSyncing) return;
    countdown--;
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimer').innerText = getT('refreshing');
      
      // Auto GPS tracking check during sync window
      if (autoGpsEnabled) {
          await locateNearestStopPromise(false); 
      }
      
      await updateNetworkTelemetry();
      isSyncing = false;
    } else {
      document.getElementById('refreshTimer').innerText = `${getT('refresh')} ${countdown}s`;
    }
  }, 1000);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    countdown = Math.min(countdown, 1); // Trigger near-immediate sync on app resume
    startTimer();
  } else {
    clearInterval(timerInterval);
  }
});

initApp();
